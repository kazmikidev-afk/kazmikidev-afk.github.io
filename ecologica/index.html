<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אקולוגיקה — הכנה למבחן במדעים · כיתה ו׳</title>
<meta name="description" content="אתר תרגול והכנה למבחן במדע וטכנולוגיה לכיתה ו׳ לפי המיקוד: אקולוגיה ואוריינות מדעית. לימוד, תרגול ומבחן לדוגמה.">
<meta name="theme-color" content="#1c7a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f2f7f4; --card:#ffffff; --ink:#14261c; --ink2:#455a4d; --line:#dce8e0;
  --pri:#1c7a4a; --pri2:#2e9e63; --pri-soft:#e3f4ea; --ok:#0f8a5f; --ok-soft:#e3f6ee;
  --bad:#c73e4e; --bad-soft:#fbe7ea; --warn:#a86408; --warn-soft:#fdf1dd;
  --chip:#e3f4ea; --shadow:0 2px 10px rgba(20,38,28,.07);
}
[data-theme="dark"]{
  --bg:#0e1a13; --card:#17281e; --ink:#eef6f0; --ink2:#a4bcab; --line:#2b4636;
  --pri:#4cc38a; --pri2:#6fd6a4; --pri-soft:#1e3a2b; --ok:#3ecf96; --ok-soft:#12352a;
  --bad:#ff8291; --bad-soft:#451f26; --warn:#f2b45c; --warn-soft:#3d2f14;
  --chip:#1e3a2b; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Heebo,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:1.45rem;margin:.2em 0 .35em;font-weight:800}
h2{font-size:1.15rem;margin:1.1em 0 .4em;font-weight:700}
h3{font-size:1.02rem;margin:.9em 0 .3em;font-weight:700}
p{margin:.35em 0}
a{color:var(--pri2)}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#166b40,#35a06a);color:#fff;border:none}
.hero h1{color:#fff}
.hero .sub{opacity:.92;font-size:.95rem}
.chip{display:inline-block;background:var(--chip);color:var(--pri2);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:600;margin:2px 4px 2px 0}
.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri2{background:var(--pri-soft);color:var(--pri2)}
.btn-ghost{background:transparent;color:var(--pri2);border:1.5px solid var(--line)}
.btn-block{display:flex;width:100%}
.btn-lg{padding:16px 20px;font-size:1.08rem;border-radius:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:140px}
.topic-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topic-head .t-name{font-weight:800;font-size:1.08rem}
.topic-head .t-pages{font-size:.78rem;color:var(--ink2)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.bar-note{font-size:.8rem;color:var(--ink2)}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:1rem;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--pri2)}
.opt:disabled{cursor:default}
.opt.sel-ok{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.opt.sel-bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.reveal-ok{border-color:var(--ok);border-style:dashed}
.feedback{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback .exp{margin-top:6px}
.hintbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem}
.lesson p,.lesson li{font-size:1rem}
.lesson ul,.lesson ol{padding-right:20px;margin:.3em 0}
.lesson li{margin:.25em 0}
.mistake{background:var(--warn-soft);border-right:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.93rem}
.example{background:var(--pri-soft);border-right:4px solid var(--pri2);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.95rem}
table.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:center}
table.tbl th{background:var(--pri-soft);color:var(--pri2)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;background:var(--chip);color:var(--pri2);border-radius:12px;padding:6px 14px}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 2px}
.qprog{font-size:.85rem;color:var(--ink2);font-weight:600}
.small{font-size:.85rem;color:var(--ink2)}
.center{text-align:center}
.res-big{font-size:2.4rem;font-weight:800;margin:6px 0}
.res-big.ok{color:var(--ok)}
.res-big.mid{color:var(--warn)}
.res-big.bad{color:var(--bad)}
.footer-note{text-align:center;font-size:.78rem;color:var(--ink2);margin-top:22px}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.inst-box{background:var(--pri-soft);border:1px dashed var(--pri2);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.92rem}
summary{cursor:pointer;font-weight:700;color:var(--pri2);padding:6px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mitem{display:block;width:100%;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;font-size:.95rem;cursor:pointer;color:var(--ink);min-height:52px}
.mitem.sel{border-color:var(--pri2);background:var(--pri-soft);font-weight:700}
.mitem.done{background:var(--ok-soft);border-color:var(--ok);opacity:.8;cursor:default}
.mitem.err{border-color:var(--bad);background:var(--bad-soft)}
.mhead{font-size:.82rem;font-weight:700;color:var(--ink2);text-align:center;margin-bottom:2px}
.open-area{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:1rem;background:var(--card);color:var(--ink);resize:vertical}
.self-grade{display:flex;gap:10px;margin-top:10px}
.self-grade .btn{flex:1}
input[type=date]{font-family:inherit;font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
@media (max-width:420px){.wrap{padding:10px 10px 80px}.btn{padding:12px 14px}}
</style>
</head>

<script>
"use strict";
/* ============ נתוני לימוד — לפי רשימת הנושאים הרשמית למבחן במדע וטכנולוגיה מחצית א' תשפ"ז (כיתה ו') ============ */
const TOPICS=[
{id:'t1',name:'🌱 מרכיבי הסביבה ומאפייני החיים',tag:'מרכיבים חיים ודוממים · מאפייני החיים · צורכי קיום',pages:'עמודים 206, 221',lessons:[
{title:'מרכיבי סביבה חיים ודוממים',body:
 '<p>ה<b>סביבה</b> היא כל מה שמקיף את היצור החי ומשפיע עליו. מחלקים את מרכיבי הסביבה לשני סוגים:</p>'
 +'<ul><li><b>מרכיבים חיים (ביוטיים):</b> בעלי חיים, צמחים והאדם (וגם פטריות וחיידקים).</li>'
 +'<li><b>מרכיבים דוממים (א-ביוטיים):</b> אור, מים, אוויר וטמפרטורה מתאימה (וגם קרקע).</li></ul>'
 +'<div class="example"><b>דוגמה — ביער:</b> העצים, הציפורים והאיילים הם מרכיבים חיים. אור השמש, מי הגשם והאוויר הם מרכיבים דוממים.</div>'
 +'<div class="mistake"><b>טעות נפוצה:</b> גם אם משהו זז — הוא לא בהכרח חי! רוח היא אוויר בתנועה: מרכיב דומם.</div>'},
{title:'מאפייני החיים וצורכי הקיום',body:
 '<p><b>מאפייני החיים</b> — משותפים לכל היצורים החיים, גם לצמחים: גדילה והתפתחות, רבייה (צאצאים), נשימה (חילוף גזים), תזונה, הפרשת פסולת ותגובה לגירויים ולשינויים מהסביבה.</p>'
 +'<p><b>צורכי הקיום</b> — בלעדיהם אין חיים: <b>מזון, מים, אוויר, מקום מחיה וטמפרטורה מתאימה</b>.</p>'
 +'<div class="example"><b>בדיקה מהירה:</b> כדי לדעת אם משהו חי, שואלים: הוא גדל? מתרבה? מגיב לסביבה? אם כן — הוא חי.</div>'}]},
{id:'t2',name:'☀️ אור ופוטוסינתזה',tag:'חשיבות האור · החומרים והתוצרים · התאמות למחסור באור',pages:'עמודים 244, 251',lessons:[
{title:'למה אור כל כך חשוב?',body:
 '<p>אור הוא מרכיב סביבה נחוץ לקיומם של יצורים חיים, והוא משפיע עליהם <b>בצורה ישירה או עקיפה</b>.</p>'
 +'<p>בעזרת האור מתקיימים צמחים, והצמחים הם <b>היצרנים</b> — הבסיס לכל היצורים החיים. לכן: <b>ללא אור — אין חיים</b>.</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> גם בעל חיים שלא אוכל צמחים תלוי באור — כי בתחילת כל שרשרת מזון עומד צמח.</div>'},
{title:'מהי פוטוסינתזה?',body:
 '<p><b>פוטוסינתזה</b> הוא התהליך שבו הצמח מייצר לעצמו מזון. הוא מתרחש בעיקר <b>בעלים</b>.</p>'
 +'<p><b>החומרים הדרושים לתהליך:</b> אור, מים מהקרקע ופחמן דו-חמצני מהאוויר (שבעלי החיים פולטים בנשימה).</p>'
 +'<p><b>התוצרים:</b> חומרי מזון לצמח, ו<b>חמצן</b> שהצמח פולט לסביבה — ובזכותו כל היצורים החיים מתקיימים על פני כדור הארץ.</p>'
 +'<div class="example"><b>לזכור בקל:</b> נכנס — אור + מים + פחמן דו-חמצני. יוצא — מזון + חמצן.</div>'},
{title:'התאמות של צמחים למחסור באור',body:
 '<p>כשיש מחסור באור, צמחים מתמודדים בדרכים שונות. דוגמה: <b>צמחים מטפסים</b> — צמחים בעלי "יכולת לטפס", שמטפסים על גבי צמחים אחרים או על גבי עצמם כדי להגיע אל האור, כי הצמח זקוק לאור כדי שתהליך הפוטוסינתזה יעבוד.</p>'}]},
{id:'t3',name:'🦎 התאמות לסביבה',tag:'מהי התאמה · התאמות במבנה הגוף ובהתנהגות',pages:'עמוד 210',lessons:[
{title:'מהי התאמה?',body:
 '<p>יצור חי יוכל לחיות בסביבה מסוימת רק אם הוא <b>מותאם</b> אליה — מבחינת מבנה גופו והתנהגותו — כך שיוכל להשיג את הצרכים החיוניים שלו.</p>'
 +'<p><b>שני סוגי התאמות:</b></p>'
 +'<ul><li><b>התאמות במבנה הגוף:</b> אורך רגליים, צבע פרווה, גודל עלים.</li>'
 +'<li><b>התאמות התנהגותיות:</b> הנעת הזנב של הטווס, שעות הפעילות (למשל פעילות בלילה).</li></ul>'
 +'<div class="mistake"><b>טעות נפוצה:</b> שואלים "איזה סוג התאמה?" — צבע פרווה הוא מבנה גוף, ושעות פעילות הן התנהגות. אל תתבלבלו!</div>'}]},
{id:'t4',name:'🌵 התאמות צמחים ליובש',tag:'צמצום פליטת מים · קליטה יעילה · אגירת מים',pages:'עמודים 208–214',lessons:[
{title:'איך צמחים שורדים בלי הרבה מים?',body:
 '<p>ישנם צמחים החיים בתנאים של טמפרטורה גבוהה ויובש, והם שורדים בשלוש דרכים עיקריות:</p>'
 +'<ol><li><b>צמצום פליטה של מים:</b> עלים המכוסים שכבה מבריקה ושומנית, או מעטה צפוף ורך של שערות — כך הצמח כמעט לא פולט מים לסביבה ושומר על המים בגופו.</li>'
 +'<li><b>קליטה יעילה יותר של מים:</b> שורשים המסתעפים ומתפשטים לרוחב, קרוב לפני הקרקע — קולטים את מי הגשמים; ושורשים מעמיקים — מגיעים אל מי התהום.</li>'
 +'<li><b>אגירה של מים:</b> צמחים האוגרים מים בעלים, בגבעולים ובשורשים (כמו בצל) — וכך ניצלים מן היובש.</li></ol>'}]},
{id:'t5',name:'🐪 התאמות בעלי חיים ליובש',tag:'קליטה ופליטה של מים · הגמל · הגרביל',pages:'עמודים 215–218',lessons:[
{title:'איך בעלי חיים שורדים בלי הרבה מים?',body:
 '<p>בעלי החיים <b>קולטים</b> מים בשתייה או מתוך המזון, ו<b>פולטים</b> מים דרך מערכת ההפרשה (שתן וזיעה) וגם דרך הנשיפה.</p>'
 +'<p><b>התאמות במבנה הגוף — הגמל:</b> הגמל גבוה מפני הקרקע, וכך גופו מתרחק מחום המדבר. דבשתו מכילה שומנים, ובשעת הצורך גופו משחרר כמות שומנים שמספיקה לו לשרוד עד שיוכל לשתות ולאכול.</p>'
 +'<p><b>התאמות בהתנהגות — הגרביל:</b> הגרביל הוא מכרסם החי באזורים צחיחים ויבשים. את רוב שעות החום הוא מבלה ישן במחילתו, ובשעות הלילה, כשקריר, הוא יוצא לחפש אוכל — כך הוא מאבד פחות נוזלים.</p>'
 +'<div class="example"><b>כלל:</b> כל בעל חיים שחי בסביבה מסוימת — מעיד שהוא מותאם אליה במבנה גופו או בהתנהגותו (או בשניהם).</div>'}]},
{id:'t6',name:'🌍 כדור הארץ המיוחד',tag:'אטמוספרה · מים נוזלים · מיקום במערכת השמש · שכבת האוזון',pages:'עמודים 234–236',lessons:[
{title:'מה מיוחד בכדור הארץ שמתקיימים עליו חיים?',body:
 '<ol><li><b>אטמוספרה</b> — לאטמוספרה של כדור הארץ קוראים אוויר. האוויר מורכב מחנקן (כ-78%), חמצן (כ-21%), ארגון (כ-1%), פחמן דו-חמצני (כ-0.04%) וגזים אחרים בכמות מועטה מאוד.</li>'
 +'<li><b>מים במצב צבירה נוזל</b> — כ-70% מפני כדור הארץ מכוסים במים נוזלים. כל היצורים החיים זקוקים למים כדי לפעול.</li>'
 +'<li><b>מיקום יחסי במערכת השמש</b> — כדור הארץ הוא השלישי במרחקו מהשמש: אזור שבו הטמפרטורות מתאימות לקיום חיים.</li>'
 +'<li><b>שכבת האוזון</b> — במרומי האטמוספרה נמצאת שכבה עשירה בגז אוזון, הבולמת את מרבית הקרינה המסוכנת.</li></ol>'
 +'<div class="mistake"><b>טעות נפוצה:</b> הגז הנפוץ ביותר באוויר הוא החנקן (78%) — לא החמצן!</div>'}]},
{id:'t7',name:'🦉 יחסי גומלין ושרשרת מזון',tag:'תחרות · הזנה · הדדיות · טפילות · שרשרת ומארג מזון · מושגים',pages:'עמודים 241–253',lessons:[
{title:'ארבעה קשרי גומלין',body:
 '<p>קשרי גומלין הם קשרי קיום בין יצורים חיים בסביבתם:</p>'
 +'<ol><li><b>תחרות:</b> מתקיימת כאשר שני יצורים חיים או יותר זקוקים לאותו משאב — אור, מים, מזון, חמצן, מקום קינון או מחבוא. התחרות משפיעה על כל אחד מהיצורים (כנראה שה"מרווח" שורד וה"מפסיד" לא).</li>'
 +'<li><b>הזנה:</b> טורף ניזון מנטרף. הקשר מבטא גם את מעבר החומרים והאנרגיה מהיצור הנטרף אל הטורף — כפי שרואים בשרשרת המזון ובמארג המזון.</li>'
 +'<li><b>הדדיות:</b> יצור חי מתקיים הודות לקיומו של מין אחר. צד אחד "מרוויח", והצד השני לא "מרוויח" ולא "מפסיד" (לא ניזוק). דוגמה: דג השושנון ושושנת הים.</li>'
 +'<li><b>טפילות:</b> רק צד אחד "מרוויח" והצד השני "מפסיד". יצור אחד (הטפיל) נטפל ליצור אחר (הפונדקאי) וחי בזכותו ועל חשבונו. הטפיל יכול לגרום נזק רב לפונדקאי, והטפילים אינם יכולים להתקיים ללא הפונדקאים שלהם.</li></ol>'},
{title:'שרשרת מזון, מארג מזון והמושגים',body:

 '<p><b>שאלת חקר</b> היא שאלה שאנו רוצים לבדוק ולמצוא לה תשובה באמצעות ניסוי או תצפית. שאלת חקר טובה בודקת כיצד גורם אחד משפיע על גורם אחר.</p>'

{title:'מהי השערה?',body:

{id:'t9',name:'🧪 תכנון ניסוי',tag:'גורמים קבועים · גורם שונה · קבוצת ביקורת · חזרות',pages:'חלק ב׳ — אוריינות מדעית',lessons:[
{title:'איך מתכננים ניסוי הוגן?',body:

 +'<li><b>גורם שונה:</b> הגורם שמשנים בכוונה במהלך הניסוי, כדי לבדוק כיצד הוא משפיע על התוצאה (הגורם המשפיע).</li>'

{id:'t10',name:'📊 תוצאות ומסקנות',tag:'קריאת ממצאים מטבלה · ניתוח · הסקת מסקנות',pages:'חלק ב׳ — אוריינות מדעית',lessons:[

{id:'t3q4',topic:'t3',ty:'tf',q:'יצור חי יכול לחיות בכל סביבה, גם אם הוא לא מותאם אליה.',o:['נכון','לא נכון'],a:1,h1:'מה קורה לדג מחוץ למים?',e:'לא נכון. יצור חי יוכל לחיות בסביבה מסוימת רק אם הוא מותאם אליה במבנה גופו ובהתנהגותו.'},
{id:'t3q5',topic:'t3',ty:'open',q:'תנו דוגמה אחת להתאמה במבנה הגוף ודוגמה אחת להתאמה התנהגותית.',e:'תשובה לדוגמה: מבנה גוף — פרווה עבה של דוב / אורך רגליים / צבע פרווה. התנהגותית — הנעת הזנב של הטווס / פעילות של הגרביל בשעות הלילה.'},
/* --- נושא 4: התאמות צמחים ליובש --- */
{id:'t4q1',topic:'t4',ty:'mc',q:'כיצד עוזרת לצמח שכבה מבריקה ושומנית (או מעטה שערות) על העלים?',o:['מצמצמת את פליטת המים לסביבה','קולטת יותר אור','מושכת חרקים','מחממת את הצמח'],a:0,h1:'הבעיה ביובש היא איבוד מים.',e:'השכבה השומנית או מעטה השערות גורמים לכך שהצמח כמעט לא פולט מים לסביבה ושומר על המים בגופו.'},
{id:'t4q2',topic:'t4',ty:'mc',q:'שורשים המסתעפים ומתפשטים לרוחב, קרוב לפני הקרקע, מאפשרים לצמח:',o:['לקלוט את מי הגשמים','להגיע למי תהום','לאגור מים בעלים','לטפס על צמחים אחרים'],a:0,h1:'מי גשמים נשפכים על פני הקרקע.',h2:'מי תהום עמוקים — לשם צריך שורשים מעמיקים.',e:'שורשים המסתעפים לרוחב קרוב לפני הקרקע קולטים את מי הגשמים. את מי התהום קולטים שורשים מעמיקים.'},
{id:'t4q3',topic:'t4',ty:'mc',q:'איזה צמח נתון כדוגמה לצמח האוגר מים?',o:['בצל','ורד','דשא','חיטה'],a:0,h1:'צמח מהמטבח עם שכבות.',e:'ישנם צמחים האוגרים מים בעלים, בגבעולים ובשורשים — כמו הבצל — וכך הם ניצלים מן היובש.'},
{id:'t4q4',topic:'t4',ty:'match',q:'התאימו כל התאמה של צמח למטרה שלה:',pairs:[['שכבה שומנית או שערות על העלים','צמצום פליטת מים'],['שורשים מסתעפים לרוחב','קליטת מי גשמים'],['שורשים מעמיקים','הגעה למי תהום'],['אגירת מים בעלים, גבעולים ושורשים','מקור מים לימי היובש']],e:'שלוש דרכי צמחים ביובש: צמצום פליטת מים, קליטה יעילה של מים ואגירת מים.'},
{id:'t4q5',topic:'t4',ty:'tf',q:'צמחים החיים בתנאי יובש פולטים כמות גדולה של מים לסביבה.',o:['נכון','לא נכון'],a:1,h1:'מה יקרה לצמח שמאבד מים במדבר?',e:'לא נכון. צמחים ביובש דווקא שומרים על המים בגופם — למשל בעזרת שכבה שומנית או שערות על העלים.'},
{id:'t4q6',topic:'t4',ty:'open',q:'תארו שתי דרכים שבהן צמחים שורדים בתנאי מחסור במים.',e:'תשובה לדוגמה (כל שתיים מהשלוש): 1) צמצום פליטת מים בעזרת שכבה שומנית או שערות על העלים. 2) קליטה יעילה של מים בעזרת שורשים מסתעפים לרוחב או שורשים מעמיקים. 3) אגירת מים בעלים, בגבעולים ובשורשים, כמו בצל.'},
/* --- נושא 5: התאמות בעלי חיים ליובש --- */
{id:'t5q1',topic:'t5',ty:'mc',q:'באילו דרכים בעלי חיים פולטים מים מהגוף?',o:['שתן, זיעה וגם נשיפה','רק שתן','רק זיעה','רק שתייה'],a:0,h1:'שתי דרכים במערכת ההפרשה ועוד דרך אחת.',h2:'שתייה היא קליטה, לא פליטה.',e:'בעלי חיים פולטים מים דרך מערכת ההפרשה (שתן וזיעה) וגם דרך הנשיפה.'},
{id:'t5q2',topic:'t5',ty:'mc',q:'מה נכון לגבי הגמל?',o:['הוא גבוה מהקרקע ומרוחק מחום המדבר, והדבשת שלו מכילה שומנים לשעת הצורך','יש לו פרווה לבנה להסוואה','הוא פעיל רק בלילה','הוא אוגר מים בזנבו'],a:0,h1:'חשבו על מבנה הגוף של הגמל.',e:'הגמל גבוה מפני הקרקע כך שגופו מתרחק מחום המדבר, ודבשתו מכילה שומנים שמספיקים לו לשרוד עד שיוכל לשתות ולאכול.'},
{id:'t5q3',topic:'t5',ty:'mc',q:'מדוע הגרביל פעיל בלילה?',o:['כי אז קריר והוא מאבד פחות נוזלים','כי בלילה יש יותר טורפים','כי הוא לא רואה באור','כי ביום הוא אוכל'],a:0,h1:'במה שונה הלילה מהיום במדבר?',e:'הגרביל מבלה את רוב שעות החום ישן במחילתו, ובלילה, כשקריר, הוא יוצא לחפש אוכל — כך הוא מאבד פחות נוזלים.'},
{id:'t5q4',topic:'t5',ty:'tf',q:'בעלי חיים קולטים מים רק באמצעות שתייה.',o:['נכון','לא נכון'],a:1,h1:'יש עוד מקור למים חוץ מהשתייה.',e:'לא נכון. בעלי חיים קולטים מים גם בשתייה וגם מתוך המזון שלהם.'},
{id:'t5q5',topic:'t5',ty:'mc',q:'הפעילות של הגרביל בשעות הלילה היא התאמה מסוג:',o:['התאמה התנהגותית','התאמה במבנה הגוף','התאמה במבנה העלים','אין פה התאמה בכלל'],a:0,h1:'פעילות = משהו שהחי עושה.',e:'שעות פעילות הן דוגמה להתאמה התנהגותית — הגרביל משנה את התנהגותו כדי לשרוד ביובש.'},
{id:'t5q6',topic:'t5',ty:'open',q:'הסבירו כיצד הגמל מותאם לחיים במדבר — ציינו שתי התאמות במבנה גופו.',e:'תשובה לדוגמה: הגמל גבוה מפני הקרקע, כך שגופו מתרחק מחום המדבר. בנוסף, דבשתו מכילה שומנים, ובשעת הצורך גופו משחרר כמות שומנים שמספיקה לו לשרוד עד שיוכל לשתות ולאכול.'},
/* --- נושא 6: כדור הארץ המיוחד --- */
{id:'t6q1',topic:'t6',ty:'mc',q:'מהו הגז הנפוץ ביותר באוויר?',o:['חנקן','חמצן','ארגון','פחמן דו-חמצני'],a:0,h1:'הוא מהווה כ-78% מהאוויר.',h2:'לא החמצן!',e:'האוויר מורכב מחנקן (כ-78%), חמצן (כ-21%), ארגון (כ-1%) ופחמן דו-חמצני (כ-0.04%).'},
{id:'t6q2',topic:'t6',ty:'match',q:'התאימו כל גז לחלקו באוויר:',pairs:[['חנקן','כ-78%'],['חמצן','כ-21%'],['ארגון','כ-1%'],['פחמן דו-חמצני','כ-0.04%']],e:'האוויר: חנקן 78%, חמצן 21%, ארגון 1%, פחמן דו-חמצני 0.04%, וגזים אחרים בכמות מועטה מאוד.'},
{id:'t6q3',topic:'t6',ty:'mc',q:'כמה אחוז מפני כדור הארץ מכוסים במים נוזלים?',o:['כ-70%','כ-50%','כ-30%','כ-90%'],a:0,h1:'יותר ממחצית, פחות מהכול.',e:'כ-70% מפני כדור הארץ מכוסים במים במצב צבירה נוזל. כל היצורים החיים זקוקים למים כדי לפעול.'},
{id:'t6q4',topic:'t6',ty:'mc',q:'באיזה מקום נמצא כדור הארץ במרחקו מהשמש?',o:['שלישי','ראשון','שני','רביעי'],a:0,h1:'לא קרוב מדי ולא רחוק מדי.',e:'כדור הארץ הוא השלישי במרחקו מהשמש — אזור שבו הטמפרטורות מתאימות לקיום חיים.'},
{id:'t6q5',topic:'t6',ty:'mc',q:'מה תפקידה של שכבת האוזון?',o:['בולמת את מרבית הקרינה המסוכנת','מייצרת חמצן','גורמת לגשם לרדת','מחממת את כדור הארץ'],a:0,h1:'היא מגינה עלינו מלמעלה.',e:'במרומי האטמוספרה נמצאת שכבה עשירה בגז אוזון, הבולמת את מרבית הקרינה המסוכנת.'},
{id:'t6q6',topic:'t6',ty:'tf',q:'כל היצורים החיים זקוקים למים כדי לפעול.',o:['נכון','לא נכון'],a:0,h1:'בלי מים — ?',e:'נכון. בלי מים אין חיים — כל היצורים החיים זקוקים למים כדי לפעול.'},
{id:'t6q7',topic:'t6',ty:'open',q:'מנו את ארבעת הדברים שהופכים את כדור הארץ למיוחד, כך שמתקיימים עליו חיים.',e:'1) האטמוספרה (אוויר: חנקן 78%, חמצן 21%, ארגון 1%, פחמן דו-חמצני 0.04%). 2) מים נוזלים (כ-70% מפני הכדור). 3) מיקום שלישי מהשמש — טמפרטורות מתאימות. 4) שכבת האוזון הבולמת את מרבית הקרינה המסוכנת.'},
/* --- נושא 7: יחסי גומלין --- */
{id:'t7q1',topic:'t7',ty:'mc',q:'שני יצורים חיים זקוקים לאותו מקום קינון. איזה קשר גומלין קיים ביניהם?',o:['תחרות','טפילות','הדדיות','הזנה'],a:0,h1:'שניהם רוצים את אותו דבר.',e:'תחרות מתקיימת כאשר שני יצורים או יותר זקוקים לאותו משאב — אור, מים, מזון, חמצן, מקום קינון או מחבוא.'},
{id:'t7q2',topic:'t7',ty:'mc',q:'דג השושנון חי בתוך שושנת הים: הוא מרוויח, והשושנה לא מרוויחה ולא ניזוקת. איזה קשר זה?',o:['הדדיות','טפילות','תחרות','הזנה'],a:0,h1:'אף צד לא מפסיד.',e:'זהו קשר הדדיות: צד אחד מרוויח, והצד השני לא מרוויח ולא מפסיד (לא ניזוק).'},
{id:'t7q3',topic:'t7',ty:'mc',q:'מה נכון לגבי קשר הטפילות?',o:['צד אחד מרוויח והצד השני מפסיד','שני הצדדים מרוויחים','אף צד לא מרוויח','שני הצדדים מתחרים'],a:0,h1:'הטפיל חי "על חשבון" מישהו אחר.',e:'בקשר הטפילות רק צד אחד מרוויח (הטפיל) והצד השני מפסיד (הפונדקאי). הטפיל חי בזכות הפונדקאי ועל חשבונו.'},
{id:'t7q4',topic:'t7',ty:'tf',q:'טפילים אינם יכולים להתקיים ללא הפונדקאים שלהם.',o:['נכון','לא נכון'],a:0,h1:'ממה חי הטפיל?',e:'נכון. הטפיל נטפל לפונדקאי וחי בזכותו ועל חשבונו — ללא הפונדקאי הוא לא יכול להתקיים.'},
{id:'t7q5',topic:'t7',ty:'mc',q:'מיהו היצרן בשרשרת מזון?',o:['הצמח','הזאב','הצבי','החיידק'],a:0,h1:'מי מייצר את מזונו בעצמו?',h2:'באיזה תהליך?',e:'היצרנים הם הצמחים — הם מייצרים את מזונם בפוטוסינתזה ומהווים בסיס לשרשרת המזון.'},
{id:'t7q6',topic:'t7',ty:'mc',q:'מהו "מארג מזון"?',o:['חיבור של מספר שרשרות מזון באותה סביבה','שרשרת מזון אחת ארוכה מאוד','רשימת מזונות של בעל חיים','סוג של טפילות'],a:0,h1:'"מארג" = משהו שמחבר הרבה חלקים.',e:'מארג מזון הוא חיבור של מספר שרשרות מזון באותה סביבת חיים.'},
{id:'t7q7',topic:'t7',ty:'tf',q:'בקשר ההזנה עוברים חומרים ואנרגיה מהיצור הנטרף אל הטורף.',o:['נכון','לא נכון'],a:0,h1:'מה קורה למזון אחרי שהנטרף נאכל?',e:'נכון. קשר ההזנה מבטא את מעבר החומרים והאנרגיה מהנטרף אל הטורף — כמו בשרשרת המזון.'},
{id:'t7q8',topic:'t7',ty:'tf',q:'טורפי על הם בעלי חיים צמחוניים.',o:['נכון','לא נכון'],a:1,h1:'"טורף" = צד.',e:'לא נכון. טורפי על הם טורפים שאין מי שיטור אותם — הם ניזונים מבעלי חיים אחרים, לא מצמחים.'},
{id:'t7q9',topic:'t7',ty:'mc',q:'מה מסמן החץ בשרשרת מזון?',o:['מעבר המזון והאנרגיה מהנאכל אל האוכל','מי חזק יותר','מי גדול יותר','מי מהיר יותר'],a:0,h1:'לכיוון מי זורמת האנרגיה?',e:'החץ בשרשרת מזון מצביע מהנאכל אל האוכל — לכיוון מעבר החומרים והאנרגיה.'},
{id:'t7q10',topic:'t7',ty:'match',q:'התאימו כל קשר גומלין לתיאור שלו:',pairs:[['תחרות','שני יצורים זקוקים לאותו משאב'],['הזנה','טורף ניזון מנטרף'],['הדדיות','אחד מרוויח, השני לא ניזוק'],['טפילות','אחד מרוויח על חשבון השני']],e:'תחרות — מאבק על משאב. הזנה — מעבר חומרים ואנרגיה מהנטרף לטורף. הדדיות — אחד מרוויח והשני לא ניזוק. טפילות — אחד מרוויח והשני מפסיד.'},
{id:'t7q11',topic:'t7',ty:'mc',q:'מי הם אוכלי השיירים והמפרקים?',o:['יצורים הניזונים משיירי יצורים אחרים ומפרקים אותם','צמחים הירוקים ביותר','טורפי על','רק ציפורים'],a:0,h1:'הם עושים "ניקיון" בטבע.',e:'אוכלי שיירים ומפרקים ניזונים משיירי יצורים ומפרקים אותם — כך החומרים חוזרים לסביבה.'},
{id:'t7q12',topic:'t7',ty:'open',q:'כתבו שרשרת מזון אחת בת שלוש חוליות לפחות (אפשר להשתמש ב: עשב, צבי, זאב).',e:'תשובה לדוגמה: עשב ← צבי ← זאב. החץ מצביע מהנאכל אל האוכל. העשב הוא היצרן, הצבי צרכן צמחוני, והזאב טורף.'},
/* --- נושא 8: שאלת חקר והשערה --- */

/* --- התקדמות מקומית --- */
function blankP(){const t={};TOPICS.forEach(function(x){t[x.id]={a:0,c:0}});return{v:1,topics:t,wrong:{},exams:[],days:{},lessons:{}}}
function loadP(){try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&p.v===1)return p}catch(e){}return blankP()}
function saveP(p){localStorage.setItem(PKEY,JSON.stringify(p))}
let P=loadP();
function dayKey(){return new Date().toISOString().slice(0,10)}
function touchDay(qs){const d=dayKey();if(!P.days[d])P.days[d]={q:0,sessions:0};P.days[d].q+=qs||0;saveP(P)}
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(P.days[k]&&P.days[k].q>0){n++;d.setDate(d.getDate()-1)}else{if(k===dayKey()){d.setDate(d.getDate()-1);continue}break}}return n}
function acc(t){const x=P.topics[t];return x&&x.a?Math.round(100*x.c/x.a):null}
function topicById(id){return TOPICS.find(function(t){return t.id===id})}
function qById(id){return QUESTIONS.find(function(q){return q.id===id})}
function prepQ(q){if(q.ty==='mc'&&!q._opts){const idx=shuffle([0,1,2,3]);q._opts=idx.map(function(i){return q.o[i]});q._a=idx.indexOf(q.a)}else if(q.ty==='tf'){q._opts=q.o;q._a=q.a}return q}

function applyTheme(){const t=localStorage.getItem(TKEY)||'';if(t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme')}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme')==='dark';localStorage.setItem(TKEY,cur?'light':'dark');applyTheme();render()}
applyTheme();

/* --- תאריך מבחן (מוזן במכשיר) --- */
function examDate(){return localStorage.getItem(DKEY)||''}
function setExamDate(d){if(d)localStorage.setItem(DKEY,d);else localStorage.removeItem(DKEY);render()}
function daysToExam(){const ed=examDate();if(!ed)return null;const now=new Date();now.setHours(0,0,0,0);const ex=new Date(ed+'T00:00:00');return Math.round((ex-now)/86400000)}
function pickExamDate(){
 const cur=examDate();
 const v=prompt('מתי המבחן? כתבו תאריך בצורה שנה-חודש-יום, למשל 2026-11-24'+(cur?' (עכשיו: '+cur+')':''),cur);
 if(v===null)return;
 const t=v.trim();
 if(t===''){setExamDate('');return}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(t)){alert('התאריך צריך להיות בצורה 2026-11-24');return}
 setExamDate(t);
}

function topicCard(t){
 const a=acc(t.id);const x=P.topics[t.id];
 const done=(t.lessons||[]).filter(function(l,i){return P.lessons[t.id+':'+i]}).length;
 return '<div class="card"><div class="topic-head"><span class="t-name">'+t.name+'</span><span class="t-pages">'+t.pages+'</span></div>'

function drawMatch(q){
 let grid='<div class="match-grid"><div><div class="mhead">מושג</div>';
 q.pairs.forEach(function(p,i){
  const st=M.doneL&&M.doneL[i]?' done':(M.selL===i?' sel':'');
  grid+='<button class="mitem'+st+'" data-l="'+i+'" onclick="pickL('+i+')">'+p[0]+'</button>';
 });
 grid+='</div><div><div class="mhead">התאמה</div>';
 M.right.forEach(function(pi){
  const st=M.doneR&&M.doneR[pi]?' done':(M.errR===pi?' err':'');
  grid+='<button class="mitem'+st+'" data-r="'+pi+'" onclick="pickR('+pi+')">'+q.pairs[pi][1]+'</button>';
 });
 grid+='</div></div>';

 $('#matchzone').innerHTML=grid;
}
function pickL(i){if(M.doneL&&M.doneL[i])return;M.selL=i;drawMatch(S.qs[S.i])}
function pickR(pi){
 if(M.doneR&&M.doneR[pi])return;
 if(M.selL===null){$('#matchmsg').textContent='קודם בחרו מושג מהטור הימני ☝️';return}
 const q=S.qs[S.i];
 if(M.selL===pi){
  M.doneL=M.doneL||{};M.doneR=M.doneR||{};
  M.doneL[M.selL]=1;M.doneR[pi]=1;M.done++;M.selL=null;
  drawMatch(q);
  if(M.done===q.pairs.length){
   const good=M.mist===0;S.answered=true;
   recordAnswer(q,good);
   $('#fb').innerHTML='<div class="feedback '+(good?'ok':'bad')+'"><b>'+(good?'✅ כל ההתאמות נכונות!':'❌ סיימת, עם '+M.mist+' ניסיונות שגויים בדרך.')+'</b><div class="exp">'+q.e+'</div></div>'
   +'<button class="btn btn-pri btn-block" onclick="nextQ()">'+(S.i<S.qs.length-1?'השאלה הבאה ←':'סיכום ←')+'</button>';
   window.scrollTo(0,document.body.scrollHeight);
  }
 } else {
  M.mist++;M.errR=pi;M.selL=null;
  drawMatch(q);
  $('#matchmsg').textContent='לא בדיוק — נסו התאמה אחרת 💪';

 }
}

 +'<div class="card"><h3>מבחנים קודמים</h3><table class="tbl"><tr><th>תאריך</th><th>ציון</th></tr>'+hist+'</table></div>'
 +'<div class="card"><h3>העתקה, גיבוי ותאריך מבחן</h3>'
 +'<p class="small">ההתקדמות נשמרת אוטומטית במכשיר הזה.'+(hasBackupCode?' גיבוי ענן יומי פעיל (לאותו גיליון פרטי של ההורה, כמו באפליקציות המתמטיקה).':'')+'</p>'
 +'<div class="row"><button class="btn btn-ghost" onclick="exportP()">⬇️ ייצוא</button><button class="btn btn-ghost" onclick="importP()">⬆️ ייבוא</button><button class="btn btn-ghost" onclick="cbRestore()">☁️ שחזור מגיבוי</button><button class="btn btn-ghost" onclick="pickExamDate()">📅 תאריך מבחן</button></div></div>'
 +installBox();
 mountTrackToggle();
}
function exportP(){
 const blob=new Blob([JSON.stringify(P,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ecologica-progress.json';a.click();
}
function importP(){
 const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
 inp.onchange=function(){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){try{const p=JSON.parse(r.result);if(p&&p.v===1&&p.topics){P=p;saveP(P);alert('הייבוא הצליח!');scrProgress()}else alert('קובץ לא מתאים')}catch(e){alert('שגיאה בקובץ')}};
  r.readAsText(f)};
 inp.click();
}
/* --- גיבוי ענן יומי — אותו חוזה מוכח כמו אלגבריקה/גאומטריקה/מדעיקה, מרחב ecologica --- */
const CB_URL='https://script.google.com/macros/s/AKfycbxmxolfKtSSXUY6ORmRDmK5VxjI6-Px5gNDDNA9fnhQ5-5ta6_NZQvaWj6jXjA46eja/exec';
const CB_APP='ecologica',CB_KEYS=[PKEY,TKEY,DKEY];
async function cbBackup(force){
 try{
  const code=(localStorage.getItem(TKEY_TRACK)||'').trim();if(code.length!==32)return;
  const today=dayKey();
  if(!force&&localStorage.getItem('cb_last_'+CB_APP)===today)return;
  const ls={};CB_KEYS.forEach(function(k){const v=localStorage.getItem(k);if(v!==null)ls[k]=v});
  const r=await fetch(CB_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({code:code,app:CB_APP,payload:{format:'shared-backup-v1',app:CB_APP,savedAt:new Date().toISOString(),localStorage:ls}})});
  const j=await r.json();if(j&&j.ok)localStorage.setItem('cb_last_'+CB_APP,today);
 }catch(e){}
}
let _backed=false;
function maybeAutoBackup(){if(_backed)return;_backed=true;cbBackup(false)}
async function cbRestore(){
 try{
  const code=(prompt('קוד הגיבוי (32 תווים, אותו קוד כמו באלגבריקה):')||'').trim();
  if(!code)return;
  if(code.length!==32){alert('הקוד צריך להיות 32 תווים');return}
  const j=await(await fetch(CB_URL+'?code='+encodeURIComponent(code)+'&app='+encodeURIComponent(CB_APP))).json();
  if(!j.ok||!j.payload){alert('לא נמצא גיבוי ענן לאקולוגיקה'+(j.error?': '+j.error:''));return}
  const p=j.payload;
  if(p.format!=='shared-backup-v1'||!p.localStorage){alert('קובץ הגיבוי לא במבנה המוכר');return}
  if(!confirm('לשחזר את הגיבוי מ-'+(p.savedAt||'?')+'? המידע הנוכחי באפליקציה יוחלף.'))return;
  Object.entries(p.localStorage).forEach(function(kv){localStorage.setItem(kv[0],kv[1])});
  alert('השחזור הושלם. האפליקציה נטענת מחדש.');location.hash='';location.reload();
 }catch(e){alert('השחזור נכשל: '+e.message)}
}
/* --- מעקב לימוד (רק אם קוד ההסכמה כבר פעיל במכשיר — אותו גיליון פרטי, בלי הרחבת גילוי) --- */
const TRACK_URL='https://script.google.com/macros/s/AKfycbwlq3_queCzhjr_tVXN7BlsHR1_IK94c3BKra-G2mbI2TbJMhqNYXwZFSPj-kiNpT1NdQ/exec';
const TRACK_APP='אקולוגיקה';
function trackCode(){return localStorage.getItem(TKEY_TRACK)||''}
function trackOn(){return /^[a-f0-9]{32}$/i.test(trackCode())}
function trackPost(e){
 if(!trackOn())return;
 const payload=JSON.stringify({v:1,code:trackCode(),app:TRACK_APP,at:new Date().toISOString(),id:Date.now().toString(36)+Math.random().toString(36).slice(2,10),...e});
 try{if(navigator.sendBeacon&&navigator.sendBeacon(TRACK_URL,new Blob([payload],{type:'text/plain'})))return;
 fetch(TRACK_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:payload}).catch(function(){})}catch(_){}
}
let _tmode={mode:'other',topic:'',since:Date.now(),started:false};
function trackFlush(){if(!trackOn())return;const now=Date.now();const sec=Math.min(300,Math.max(0,Math.round((now-_tmode.since)/1000)));if(sec>0&&_tmode.started)trackPost({type:'time',mode:_tmode.mode,topic:_tmode.topic,seconds:sec});_tmode.since=now}
function trackMode(m,t){if(!trackOn())return;if(!_tmode.started){_tmode.started=true;trackPost({type:'session_open'})}trackFlush();_tmode.mode=m;_tmode.topic=t||'';_tmode.since=Date.now()}
function trackMilestone(type,detail){if(!trackOn())return;if(!_tmode.started){_tmode.started=true;trackPost({type:'session_open'})}trackPost({type:type,...(detail||{})})}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(_tmode.started){trackFlush();trackPost({type:'session_close'});_tmode.started=false}}
 else if(_tmode.started){_tmode.since=Date.now()}
});
window.addEventListener('pagehide',function(){if(_tmode.started){trackFlush();trackPost({type:'session_close'});_tmode.started=false}});
setInterval(function(){if(!document.hidden&&_tmode.started)trackFlush()},60000);
function mountTrackToggle(){
 var btn=document.createElement('button');btn.type='button';btn.id='trackingToggle';
 btn.textContent=trackOn()?'מעקב לגלעד: פעיל · לחצו לכיבוי':'הפעלת מעקב לימוד לגלעד';
 btn.style.cssText='display:block;margin:14px auto 0;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:600 12px Heebo,Arial;opacity:.92;cursor:pointer';
 btn.title='הנתונים על שימוש, זמן וציונים נשלחים לגיליון הפרטי של מיקי בחשבון Google שלו';
 btn.onclick=function(){
  if(trackOn()){if(confirm('לכבות מעקב במכשיר זה?')){if(_tmode.started){trackPost({type:'session_close'});_tmode.started=false}localStorage.removeItem(TKEY_TRACK);btn.textContent='הפעלת מעקב לימוד לגלעד'}}
  else if(confirm('להפעיל מעקב במכשיר של גלעד? זמני שימוש לפי מצב, נושאים וציונים יישלחו לגיליון הפרטי של מיקי ב-Google. אין להפעיל במכשיר אחר.')){
   var entered=prompt('קוד ההפעלה מופיע בלשונית הסבר בגיליון הפרטי של מיקי:');
   if(!entered||!/^[a-f0-9]{32}$/i.test(entered.trim()))return;
   localStorage.setItem(TKEY_TRACK,entered.trim());btn.textContent='מעקב לגלעד: פעיל · לחצו לכיבוי';
  }};
 app.appendChild(btn);
}
/* --- הוספה למסך הבית (PWA) --- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(location.hash===''||location.hash==='#/progress')render()});
function installBox(){
 const dismissed=localStorage.getItem(IKEY);
 if(dismissed&&!deferredInstall)return '';
 let inner='';
 if(deferredInstall)inner='<button class="btn btn-pri btn-block" onclick="doInstall()">📲 הוסף לדף הבית — כמו אפליקציה</button>';
 else inner='<div class="inst-box">📲 <b>להוספה למסך הבית:</b> מתפריט הדפדפן (⋮) בחרו "הוספה למסך הבית" / "התקנת אפליקציה" — והאתר יישב במסך הבית כמו אפליקציה רגילה.</div><button class="btn btn-ghost btn-block" onclick="localStorage.setItem(\'ecologica-install-hint-v1\',\'1\');render()">הבנתי, אל תציג שוב</button>';
 return '<div class="card">'+inner+'</div>';
}
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;localStorage.setItem(IKEY,'1');render()}
/* --- שחזור דרך #restore --- */
if(location.hash==='#restore'){location.hash='';setTimeout(cbRestore,400)}
render();
</script>
