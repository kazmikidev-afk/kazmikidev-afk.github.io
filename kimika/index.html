<style>
:root{
  --bg:#f0f7fa; --card:#ffffff; --ink:#0f2233; --ink2:#3f5462; --line:#d3e4ec;
  --pri:#0e7490; --pri2:#0c93b4; --pri-soft:#d9f1f7; --ok:#0f8a5f; --ok-soft:#e3f6ee;
  --bad:#c73e4e; --bad-soft:#fbe7ea; --warn:#a86408; --warn-soft:#fdf1dd;
  --chip:#d9f1f7; --shadow:0 2px 10px rgba(20,38,28,.07);
}
[data-theme="dark"]{
  --bg:#0b1a22; --card:#12242e; --ink:#eaf6fa; --ink2:#9dbcc9; --line:#22414f;
  --pri:#22b8d8; --pri2:#5ad4ec; --pri-soft:#123a47; --ok:#3ecf96; --ok-soft:#12352a;
  --bad:#ff8291; --bad-soft:#451f26; --warn:#f2b45c; --warn-soft:#3d2f14;
  --chip:#123a47; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Heebo,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:1.45rem;margin:.2em 0 .35em;font-weight:800}
h2{font-size:1.15rem;margin:1.1em 0 .4em;font-weight:700}
h3{font-size:1.02rem;margin:.9em 0 .3em;font-weight:700}
p{margin:.35em 0}
a{color:var(--pri2)}
button{font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#155e75,#0e9ec2);color:#fff;border:none}
.hero h1{color:#fff}
.hero .sub{opacity:.92;font-size:.95rem}
.chip{display:inline-block;background:var(--chip);color:var(--pri2);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:600;margin:2px 4px 2px 0}
.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri2{background:var(--pri-soft);color:var(--pri2)}
.btn-ghost{background:transparent;color:var(--pri2);border:1.5px solid var(--line)}
.btn-block{display:flex;width:100%}
.btn-lg{padding:16px 20px;font-size:1.08rem;border-radius:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:140px}
.topic-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topic-head .t-name{font-weight:800;font-size:1.08rem}
.topic-head .t-pages{font-size:.78rem;color:var(--ink2)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.bar-note{font-size:.8rem;color:var(--ink2)}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:1rem;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--pri2)}
.opt:disabled{cursor:default}
.opt.sel-ok{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.opt.sel-bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.reveal-ok{border-color:var(--ok);border-style:dashed}
.feedback{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback .exp{margin-top:6px}
.hintbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem}
.lesson p,.lesson li{font-size:1rem}
.lesson ul,.lesson ol{padding-right:20px;margin:.3em 0}
.lesson li{margin:.25em 0}
.mistake{background:var(--warn-soft);border-right:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.93rem}
.example{background:var(--pri-soft);border-right:4px solid var(--pri2);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.95rem}
table.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:center}
table.tbl th{background:var(--pri-soft);color:var(--pri2)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;background:var(--chip);color:var(--pri2);border-radius:12px;padding:6px 14px}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 2px}
.qprog{font-size:.85rem;color:var(--ink2);font-weight:600}
.small{font-size:.85rem;color:var(--ink2)}
.center{text-align:center}
.res-big{font-size:2.4rem;font-weight:800;margin:6px 0}
.res-big.ok{color:var(--ok)}
.res-big.mid{color:var(--warn)}
.res-big.bad{color:var(--bad)}
.footer-note{text-align:center;font-size:.78rem;color:var(--ink2);margin-top:22px}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.inst-box{background:var(--pri-soft);border:1px dashed var(--pri2);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.92rem}
summary{cursor:pointer;font-weight:700;color:var(--pri2);padding:6px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mitem{display:block;width:100%;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;font-size:.95rem;cursor:pointer;color:var(--ink);min-height:52px}
.mitem.sel{border-color:var(--pri2);background:var(--pri-soft);font-weight:700}
.mitem.done{background:var(--ok-soft);border-color:var(--ok);opacity:.8;cursor:default}
.mitem.err{border-color:var(--bad);background:var(--bad-soft)}
.mhead{font-size:.82rem;font-weight:700;color:var(--ink2);text-align:center;margin-bottom:2px}
.open-area{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:1rem;background:var(--card);color:var(--ink);resize:vertical}
.self-grade{display:flex;gap:10px;margin-top:10px}
.self-grade .btn{flex:1}
input[type=date]{font-family:inherit;font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
@media (max-width:420px){.wrap{padding:10px 10px 80px}.btn{padding:12px 14px}}

.form-card{border:2px solid var(--pri)}
.form-card .btn{text-decoration:none}
</style>
</head>

<script>
"use strict";
/* ============ נתוני לימוד — לפי רשימת הנושאים הרשמית למבחן במדעים כיתה ח׳ (ב׳ 16.11.2026) ============ */
const TOPICS=[
{id:'t1',name:'🧱 חלקיקי החומר — אטומים ומולקולות',tag:'חלקיקי החומר · אטום · מולקולה',pages:"עמ' 15-18",lessons:[
{title:'החומר בנוי מחלקיקים',body:
 '<p>כל החומרים שסביבנו — נוזלים, מוצקים וגזים, חיים ודוממים — בנויים מ<b>חלקיקים</b> זעירים.</p>'
 +'<p>החלקיק הקטן ביותר של יסוד הוא ה<b>אטום</b>. <b>מולקולה</b> היא שני אטומים או יותר הקשורים זה לזה.</p>'
 +'<div class="example"><b>דוגמה:</b> מים בנויים ממולקולות מים. בכל מולקולת מים שני אטומי מימן ואטום חמצן אחד.</div>'
 +'<div class="mistake"><b>טעות נפוצה:</b> אטום ומולקולה הם לא אותו דבר — אטום הוא חלקיק בודד, ומולקולה בנויה משני אטומים לפחות.</div>'},
{title:'מולקולה של יסוד ומולקולה של תרכובת',body:
 '<p>מולקולה של <b>יסוד</b> בנויה מאטומים <b>זהים</b> הקשורים זה לזה. למשל: מולקולת חמצן O₂ (שני אטומי חמצן), מולקולת אוזון O₃, מולקולת גופרית S₈.</p>'
 +'<p>מולקולה של <b>תרכובת</b> בנויה מאטומים מ<b>סוגים שונים</b>. למשל: מולקולת מים H₂O (מימן וחמצן), מולקולת פחמן דו-חמצני CO₂.</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> חומר שכל המולקולות בו זהות הוא לא בהכרח יסוד — אם בכל מולקולה יש אטומים מסוגים שונים (כמו מים), זו תרכובת.</div>'}]},
{id:'t2',name:'⚛️ יסודות — אטום, מולקולה, גביש וסימול כימי',tag:'מהו יסוד · גביש · כללי הסימול הכימי',pages:"עמ' 19-20, 22",lessons:[
{title:'מהו יסוד?',body:
 '<p><b>יסוד</b> הוא חומר הבנוי מסוג <b>אחד</b> של אטומים. אי אפשר לפרק יסוד לחומרים אחרים בתגובה כימית, וגם אי אפשר ליצור אותו מחומרים אחרים בתגובה כימית.</p>'
 +'<p><b>כל החומרים בטבע בנויים מהיסודות הכימיים</b> — גם הגופים הדוממים וגם היצורים החיים בנויים מאותם יסודות (למשל חמצן נמצא גם במים, גם בסוכר בגוף וגם בגרגרי חול).</p>'
 +'<div class="example"><b>דוגמה:</b> מים הם לא יסוד — אפשר לפרק מים ליסודות מימן וחמצן. לכן מים הם תרכובת.</div>'},
{title:'גביש',body:
 '<p><b>גביש</b> הוא מבנה מסודר וחוזר של חלקיקים (אטומים, מולקולות או יונים). למשל: יהלום וגרפיט הם גבישים של אטומי פחמן, ומלח בישול הוא גביש של יוני נתרן וכלור.</p>'
 +'<p>יהלום, גרפיט ופחם בנויים כולם מאטומי פחמן בלבד — ההבדל ביניהם הוא בארגון האטומים במבנה.</p>'},
{title:'הסימול הכימי',body:
 '<p>לכל יסוד יש <b>סימול כימי</b> מוסכם: אות אחת <b>גדולה</b> (H מימן, O חמצן, C פחמן), או <b>אות גדולה ואחריה אות קטנה</b> (Ne ניאון, Na נתרן, Fe ברזל, Ca סידן).</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> הכתיבות NE, ne ו-nE כולן שגויות — תמיד האות הראשונה גדולה, והשנייה (אם יש) קטנה.</div>'}]},
{id:'t3',name:'🔬 מבנה האטום, סדרי גודל ומטען חשמלי',tag:'גרעין · פרוטונים · נייטרונים · אלקטרונים · יונים',pages:"עמ' 23-25",lessons:[
{title:'מבנה האטום',body:
 '<p>במרכז האטום נמצא ה<b>גרעין</b>, ובו <b>פרוטונים</b> (בעלי מטען חשמלי <b>חיובי</b>) ו<b>נייטרונים</b> (נייטרליים, בלי מטען). סביב הגרעין נעים ה<b>אלקטרונים</b> (בעלי מטען <b>שלילי</b>).</p>'
 +'<p>אטום <b>נייטרלי</b> — מספר הפרוטונים שווה למספר האלקטרונים, ולכן המטען הכולל שלו אפס. האטום נייטרלי אבל החלקיקים שבו טעונים!</p>'
 +'<div class="example"><b>דוגמה:</b> באטום של יסוד עם מספר אטומי 18 יש 18 פרוטונים ו-18 אלקטרונים.</div>'},
{title:'סדרי גודל',body:
 '<p>האטום קטן מאוד — <b>אי אפשר לראות אטום במיקרוסקופ אור רגיל</b> (כן אפשר לראות תאים, שיער וגרגרים).</p>'
 +'<p>סדר מהקטן לגדול: אטום ← מולקולת חלבון ← תא דם ← רקמת שריר ← איבר (לב) ← אדם.</p>'},
{title:'מטען חשמלי ויונים',body:
 '<p>בשפשוף גופים (למשל בלון על בגד, או מוט פלסטיק במטלית צמר) <b>אלקטרונים נתלשים מגוף אחד ועוברים לגוף אחר</b>. גוף נייטרלי שאיבד מטענים שליליים נטען <b>חיובי</b>, וגוף שקיבל מטענים שליליים נטען <b>שלילי</b>.</p>'
 +'<p>מטענים <b>מנוגדים נמשכים</b> (לכן שיער נמשך לבלון משופשף) ומטענים <b>זהים נדחים</b> (שני מוטות זהים ששופשפו באותה מטלית יידחו זה מזה).</p>'
 +'<p><b>יון</b> הוא אטום שבו מספר האלקטרונים שונה ממספר הפרוטונים: יון <b>חיובי</b> נוצר כשהאטום <b>מאבד</b> אלקטרונים (Na⁺), ויון <b>שלילי</b> נוצר כשהאטום <b>מקבל</b> אלקטרונים (O²⁻). מספר הפרוטונים לא משתנה!</p>'
 +'<p><b>מוליך חשמלית</b> — חומר שמטענים חשמליים יכולים לעבור דרכו; <b>מבודד</b> — חומר שלא מאפשר זאת.</p>'}]},
{id:'t4',name:'🔢 מספר אטומי',tag:'מספר פרוטונים · זהות היסוד · יונים',pages:"עמ' 28",lessons:[
{title:'מהו מספר אטומי?',body:
 '<p><b>מספר אטומי</b> של יסוד הוא <b>מספר הפרוטונים בגרעין</b> של אטום היסוד.</p>'
 +'<p>לכל יסוד מספר אטומי משלו — <b>אי אפשר ששני יסודות שונים יחלקו אותו מספר אטומי</b>, כי לכל יסוד מספר פרוטונים שונה. המספר האטומי הוא ה"תעודת זהות" של היסוד.</p>'
 +'<p>באטום <b>נייטרלי</b>: מספר האלקטרונים = מספר הפרוטונים = המספר האטומי. ביון מספר האלקטרונים שונה, אבל מספר הפרוטונים (ולכן גם המספר האטומי) נשאר אותו דבר.</p>'
 +'<div class="example"><b>דוגמה:</b> ליון Cs⁺ של צזיום (מספר אטומי 55) יש 55 פרוטונים אבל רק 54 אלקטרונים.</div>'}]},
{id:'t5',name:'🗂️ הטבלה המחזורית',tag:'מיון לפי מספר אטומי · טורים ומשפחות · קריאת תא',pages:"עמ' 31-33",lessons:[
{title:'איך הטבלה בנויה?',body:
 '<p>היסודות בטבלה המחזורית מסודרים לפי <b>מספר אטומי עולה</b>. מימן הוא היסוד הראשון בטבלה — כי יש לו את המספר האטומי הקטן ביותר (1).</p>'
 +'<p>בכל תא בטבלה רשומים סמל היסוד ומספרו האטומי. מהמספר האטומי אפשר לדעת כמה פרוטונים יש בגרעין, וכמה אלקטרונים יש באטום הנייטרלי.</p>'
 +'<div class="example"><b>דוגמה:</b> חמצן עם מספר אטומי 8: באטום חמצן יש 8 פרוטונים בגרעין ו-8 אלקטרונים, והוא שייך לאל-מתכות.</div>'},
{title:'טורים, מחזורים ואזורים',body:
 '<p>ה<b>טורים</b> בטבלה הם ה<b>משפחות הכימיות</b> — ליסודות באותו טור תכונות דומות.</p>'
 +'<p>ברובה הגדול של הטבלה (צד שמאל ואמצע) נמצאות ה<b>מתכות</b>, ובצד ימין ה<b>אל-מתכות</b>. יסוד שנמצא באזור השמאלי של הטבלה (כמו צזיום) הוא מתכת — מוליך חשמל ובעל ברק מתכתי.</p>'}]},
{id:'t6',name:'🔩 מתכות ואל-מתכות',tag:'מוליכות · ברק מתכתי · ריקוע · אלקטרונים חופשיים',pages:"עמ' 34-36",lessons:[
{title:'תכונות המתכות',body:
 '<p>המתכות מוליכות <b>זרם חשמלי</b> וגם <b>חום</b>, בעלות <b>ברק מתכתי</b> בדרך כלל, רובן מוצקות בטמפרטורת החדר, והמוצקות ניתנות <b>לריקוע</b> (אפשר לשטח אותן בלי שיתפוררו).</p>'
 +'<p><b>למה מתכות מוליכות חשמל?</b> במתכות קיימים <b>אלקטרונים חופשיים</b>, הנמשכים בחולשה לגרעיני האטומים. זרם חשמלי במתכת הוא תנועה של אלקטרונים חופשיים אלה בכיוון אחד.</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> מצב צבירה לא מבדיל בין מתכת לאל-מתכת — כספית היא מתכת נוזלית בטמפרטורת החדר! התכונה שתמיד מבדילה היא הולכת זרם חשמלי.</div>'},
{title:'אל-מתכות',body:
 '<p>אל-מתכות <b>אינן מוליכות</b> זרם חשמלי, לרוב אינן מבריקות, ויש ביניהן חומרים נוזליים, מוצקים וגזים בטמפרטורת החדר. המוצקים שבהן <b>מתפוררים</b> ולא ניתנים לריקוע.</p>'
 +'<div class="example"><b>דוגמה:</b> ברזל, זהב, כספית, סידן, אשלגן וליתיום הם מתכות; גופרית, חמצן, חנקן, כלור ומימן הם אל-מתכות.</div>'}]},
{id:'t7',name:'👨‍👩‍👧 משפחות כימיות',tag:'מתכות אלקליות · הלוגנים · גזים אצילים',pages:"עמ' 37-41",lessons:[
{title:'מהי משפחה כימית?',body:
 '<p><b>משפחה כימית</b> היא טור בטבלה המחזורית. יסודות השייכים לאותה משפחה (אותו טור) דומים בתכונותיהם — יש להם <b>תכונות כימיות דומות</b>.</p>'},
{title:'שלוש משפחות לדעת',body:
 '<p><b>מתכות אלקליות</b> — טור 1 (הטור הראשון משמאל): ליתיום, נתרן, אשלגן. מתכות מוצקות המוליכות היטב חשמל וחום.</p>'
 +'<p><b>הלוגנים</b> — טור 7 מצד ימין: פלואור, כלור, ברום, יוד. יוצרים תרכובות עם מתכות.</p>'
 +'<p><b>גזים אצילים</b> — טור 8 (הטור הימני ביותר): הליום, ניאון, ארגון. כולם גזים בטמפרטורת החדר, בנויים מאטומים בודדים וכמעט לא נוטים ליצור תרכובות עם יסודות אחרים.</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> אל תתבלבלו בין המשפחות — אשלגן הוא מתכה אלקלית (לא הלוגן), וארגון הוא גז אציל (לא הלוגן).</div>'}]},
{id:'t8',name:'🧪 תרכובות מולקולריות — השפה הכימית',tag:'נוסחה כימית · אינדקס · מקדם · ספירת אטומים',pages:"עמ' 47-50",lessons:[
{title:'מהי תרכובת?',body:
 '<p><b>תרכובת</b> היא חומר הבנוי מאטומים של שני יסודות או יותר, הקשורים זה לזה. אפשר לפרק תרכובת ליסודות בתגובה כימית. <b>תרכובת מולקולרית</b> בנויה ממולקולות (כמו מים או פחמן דו-חמצני).</p>'
 +'<p>כשתרכובת נוצרת מיסודות, תכונות היסודות <b>אינן נשמרות</b> — לתרכובת תכונות שונות מהיסודות שהרכיבו אותה.</p>'
 +'<div class="example"><b>דוגמה:</b> מימן וחמצן הם גזים בטמפרטורת החדר — המימן נפיץ והחמצן מעודד בעירה — אבל המים (התרכובת שלהם) הם נוזל שאינו דליק.</div>'},
{title:'קוראים נוסחה כימית',body:
 '<p><b>נוסחה כימית</b> מראה אילו יסודות יש בחומר וכמה אטומים מכל סוג: המספר הקטן (<b>אינדקס</b>) ליד הסמל אומר כמה אטומים מסוג זה יש במולקולה. אין מספר? יש אטום אחד.</p>'
 +'<div class="example"><b>דוגמה:</b> H₂O — מולקולה עם 2 אטומי מימן ואטום חמצן אחד. C₆H₁₂O₆ (גלוקוז) — 3 סוגי יסודות (פחמן, מימן, חמצן) ובסך הכול 24 אטומים במולקולה.</div>'},
{title:'מקדמים: אטומים בודדים מול מולקולות',body:
 '<p>מספר <b>גדול לפני</b> הסמל או הנוסחה (<b>מקדם</b>) אומר כמה אטומים בודדים או כמה מולקולות יש: 2H הם שני אטומי מימן <b>נפרדים</b>, ואילו H₂ היא מולקולה <b>אחת</b> דו-אטומית. 2H₂O הן שתי מולקולות מים.</p>'
 +'<p>אותיות קטנות בסוגריים מסמנות מצב צבירה: (s) מוצק, (l) נוזל, (g) גז. שימו לב: (l) לא אומר שהחומר הוא תמיסה — זה רק מצב הצבירה.</p>'
 +'<div class="example"><b>כותבים בשפת הכימאים:</b> אטום חמצן — O · מולקולת חנקן — N₂ · 3 מולקולות יוד — 3I₂ · 8 אטומי צורן — 8Si · 4 מולקולות מים — 4H₂O · 4 מולקולות מי חמצן — 4H₂O₂.</div>'
 +'<div class="mistake"><b>טעות נפוצה:</b> NO₂ ו-N₂O₅ מכילות את אותם יסודות אבל בכמויות שונות — הן חומרים שונים. חומרים שונים בהרכב המולקולות שונים בתכונותיהם.</div>'}]},
{id:'t9',name:'🥤 תערובות ותמיסות',tag:'תערובת · אחידה ובלתי-אחידה · ממס ומומס',pages:"עמ' 65-72",lessons:[
{title:'תערובת וחומר טהור',body:
 '<p><b>חומר טהור</b> הוא יסוד או תרכובת — בנוי מסוג אחד של חלקיקים (מים מזוקקים בנויים רק ממולקולות מים). <b>תערובת</b> מכילה שני חומרים או יותר שלא נקשרו ביניהם כימית (אוויר, חלב, מי ברז, יין).</p>'
 +'<div class="example"><b>דוגמה:</b> חלב הוא לא חומר טהור — הוא תערובת של מים, חלבונים, סוכרים, שומנים וויטמינים.</div>'},
{title:'תערובות אחידות ובלתי-אחידות',body:
 '<p><b>תערובת אחידה</b> — הרכבה זהה בכל חלקיה, ואי אפשר להבחין בעין במרכיביה (אוויר, מי מלח אחרי ערבוב מלא, תה). <b>תערובת בלתי-אחידה</b> — אפשר להבחין במרכיבים השונים (חול במים, שמן ומים, סלט, מיץ עם עיסה).</p>'
 +'<p><b>תמיסה</b> היא תערובת אחידה: <b>ממס</b> (החומר שממיס, למשל מים) + <b>מומס</b> (החומר שמומס, למשל מלח או סוכר). מים מלוחים = תמיסה של מלח במים.</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> תמיסה שקופה לא אומרת שיש בה רק מים — המומס מפוזר באופן אחיד ולא נראה לעין.</div>'}]},
{id:'t10',name:'🧲 הפרדת תערובות',tag:'סינון · שקיעה · אידוי · זיקוק · מגנט · משפך הפרדה',pages:"עמ' 78-82",lessons:[
{title:'איך מפרידים תערובות?',body:
 '<p>את מרכיבי תערובת מפרידים בשיטות <b>פיזיקליות</b>, לפי תכונות המרכיבים — בלי ליצור חומרים חדשים:</p>'
 +'<ul><li><b>הפרדה מגנטית:</b> מפרידה חומרים המתמגנטים (כמו ברזל) משאר התערובת — למשל ברזל מחול.</li>'
 +'<li><b>שקיעה וסינון:</b> מוצק בלתי-מסיס בנוזל שוקע או נתפס על נייר סינון — למשל חול ממים.</li>'
 +'<li><b>משפך הפרדה:</b> מפריד שני נוזלים בלתי-נתערבבים — למשל שמן ומים.</li></ul>'},
{title:'אידוי וזיקוק',body:
 '<p><b>אידוי:</b> מחממים תמיסה עד שהממס (המים) מתאדה — וכך מקבלים בחזרה את ה<b>מומס</b> (מלח ממי מלח).</p>'
 +'<p><b>זיקוק:</b> מאדים את התמיסה, מקררים את האדים ומרכיבים מחדש נוזל — כך מקבלים בחזרה את ה<b>ממס</b> (מים מזוקקים ממי ים). מים מזוקקים הם חומר טהור.</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> אידוי מחזיר את המומס, זיקוק מחזיר את הממס. באידוי הממס "בורח" לאוויר, ובזיקוק אוספים אותו.</div>'}]},
{id:'t11',name:'🔥 תהליכים כימיים ופיזיקליים',tag:'הרכבה · בעירה · פירוק · אנדו/אקסותרמי · שימור המסה',pages:"עמ' 88-93, 96-99, 104-105, 108-112",lessons:[
{title:'תהליך פיזיקלי מול תהליך כימי',body:
 '<p><b>תהליך פיזיקלי</b> — החומר נשאר אותו חומר, משתנה רק מראהו או מצב צבירתו: התכת קרח, אידוי מים, הקפאה, ניסור עץ, ריקוע נחושת, המסת סוכר במים.</p>'
 +'<p><b>תהליך כימי (תגובה כימית)</b> — נוצר בו חומר <b>חדש</b> בעל תכונות חדשות: שריפת נייר, חלודה, בישול ביצה.</p>'
 +'<div class="mistake"><b>טעות נפוצה:</b> התכה של קרח היא תהליך פיזיקלי — נוצרו מים נוזליים, אבל זה עדיין אותו חומר (H₂O).</div>'},
{title:'הרכבה, בעירה ופירוק',body:
 '<p><b>הרכבה:</b> שני חומרים (או יותר) מתחברים לחומר אחד — למשל ברזל מגיב עם גופרית לתרכובת ברזל גופריתית.</p>'
 +'<p><b>בעירה (שריפה):</b> תגובה עם חמצן שפולטת אנרגיה — אור וחום. שריפת סרט מגנזיום יוצרת מגנזיום חמצני — תרכובת של מגנזיום וחמצן (אבקה לבנה — לא יסוד ולא מתכת!).</p>'
 +'<p><b>פירוק:</b> תרכובת אחת מתפרקת לכמה חומרים — למשל פירוק מים ליסודות מימן וחמצן.</p>'},
{title:'אנרגיה וחוק שימור המסה',body:
 '<p><b>תהליך אקסותרמי</b> פולט אנרגיה לסביבה — הסביבה מתחממת (בעירה). <b>תהליך אנדותרמי</b> בולע אנרגיה מהסביבה — הסביבה מתקררת.</p>'
 +'<p><b>חוק שימור המסה:</b> בתהליך כימי המסה הכוללת נשמרת — אטומים לא נעלמים ולא נוצרים, רק מתארגנים מחדש.</p>'
 +'<div class="example"><b>דוגמה:</b> במערכת סגורה עם 110 גרם חומרים, גם אחרי שהתרחשה תגובה כימית המאזניים יראו 110 גרם. ואם שרפים 15 גרם אבקת ברזל, התוצר ישקול <b>יותר</b> מ-15 גרם — כי התחמוצת מכילה גם את אטומי הברזל וגם אטומי חמצן שהצטרפו מהאוויר.</div>'}]}
];

{id:'t1q5',topic:'t1',ty:'open',q:'חומר מסוים בנוי ממולקולות זהות, ובכל מולקולה יש אטומים משני סוגים שונים. האם החומר הוא יסוד או תרכובת? נמקו והביאו דוגמה.',e:'תרכובת. גם אם כל המולקולות זהות, אם בכל מולקולה יש אטומים מסוגים שונים — זו תרכובת. דוגמה: מים — כל המולקולות זהות (H₂O), ובכל אחת אטומי מימן וחמצן. יסוד היה בנוי מאטומים זהים בלבד.'},

/* --- התקדמות מקומית --- */
function blankP(){const t={};TOPICS.forEach(function(x){t[x.id]={a:0,c:0}});return{v:1,topics:t,wrong:{},exams:[],days:{},lessons:{}}}
function loadP(){try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&p.v===1)return p}catch(e){}return blankP()}
function saveP(p){localStorage.setItem(PKEY,JSON.stringify(p))}
let P=loadP();
function dayKey(){return new Date().toISOString().slice(0,10)}
function touchDay(qs){const d=dayKey();if(!P.days[d])P.days[d]={q:0,sessions:0};P.days[d].q+=qs||0;saveP(P)}
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(P.days[k]&&P.days[k].q>0){n++;d.setDate(d.getDate()-1)}else{if(k===dayKey()){d.setDate(d.getDate()-1);continue}break}}return n}
function acc(t){const x=P.topics[t];return x&&x.a?Math.round(100*x.c/x.a):null}
function topicById(id){return TOPICS.find(function(t){return t.id===id})}
function qById(id){return QUESTIONS.find(function(q){return q.id===id})}
function prepQ(q){if(q.ty==='mc'&&!q._opts){const idx=shuffle([0,1,2,3]);q._opts=idx.map(function(i){return q.o[i]});q._a=idx.indexOf(q.a)}else if(q.ty==='tf'){q._opts=q.o;q._a=q.a}return q}

let S=null;
let LAST_ROUTE='';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function pickPractice(mode){
 let pool=[];
 if(mode==='all')pool=QUESTIONS.slice();
 else if(mode==='weak'){
  const wrongIds=Object.keys(P.wrong).filter(function(id){return P.wrong[id]>0});
  pool=wrongIds.map(qById).filter(Boolean);
  const weak=TOPICS.slice().sort(function(a,b){return (acc(a.id)===null?0:acc(a.id))-(acc(b.id)===null?0:acc(b.id))})[0];
  pool=pool.concat(QUESTIONS.filter(function(q){return q.topic===weak.id&&pool.indexOf(q)<0}));
 } else pool=QUESTIONS.filter(function(q){return q.topic===mode});
 const fresh=pool.filter(function(q){return !P.wrong[q.id]});
 return shuffle(pool.filter(function(q){return P.wrong[q.id]})).concat(shuffle(fresh)).slice(0,10);
}
function scrPractice(mode){
 const qs=pickPractice(mode);
 if(!qs.length){app.innerHTML=topActions()+'<div class="card center"><p>אין עדיין שאלות לתרגול כאן — קודם כל, כל הכבוד, אין חולשות רשומות! 👏</p><button class="btn btn-pri" onclick="nav(\'\')">חזרה</button></div>';return}
 qs.forEach(prepQ);
 const names={all:'תרגול מעורב',weak:'תרגול חולשות'};
 S={kind:'practice',qs:qs,i:0,ok:0,hint:0,answered:false,title:names[mode]||('תרגול: '+topicById(mode).name)};
 LAST_ROUTE='#/practice/'+mode;
 drawQ();
 trackMode('practice',S.title);
}
function recordAnswer(q,good){
 if(S.kind!=='exam'){
  if(good)S.ok++;
  P.topics[q.topic].a++;if(good)P.topics[q.topic].c++;
  if(!good)P.wrong[q.id]=(P.wrong[q.id]||0)+1;else if(P.wrong[q.id])P.wrong[q.id]=Math.max(0,P.wrong[q.id]-1);
  touchDay(1);
 }
 trackMilestone('practice_answer',{correct:good?1:0,topic:q.topic});
}
function drawQ(){
 const q=S.qs[S.i],tot=S.qs.length;
 let html=topActions()
 +'<div class="card"><div class="topbar"><span class="qprog">'+S.title+' · שאלה '+(S.i+1)+'/'+tot+'</span><span class="qprog">✅ '+S.ok+'</span></div>'
 +'<div class="bar"><i style="width:'+Math.round(100*S.i/tot)+'%"></i></div>'
 +'<h2 style="margin-top:10px">'+q.q+'</h2>'
 +(q.tbl?tblHTML(q.tbl):'');
 if(q.ty==='match'){html+='<div id="matchzone"></div><div id="fb"></div></div>';app.innerHTML=html;initMatch(q);window.scrollTo(0,0);return}
 if(q.ty==='open'){html+='<textarea class="open-area" id="openans" placeholder="אפשר לכתוב כאן את התשובה... או פשוט לחשוב עליה בעל פה"></textarea>'
  +'<button class="btn btn-pri2 btn-block" style="margin-top:10px" onclick="revealOpen()">הצגת תשובה לדוגמה 👀</button>'
  +'<div id="fb"></div></div>';app.innerHTML=html;window.scrollTo(0,0);return}
 html+='<div id="opts">'+q._opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" onclick="answerQ('+i+')">'+o+'</button>'}).join('')+'</div>'
 +'<div id="hintzone">'
 +(!S.answered&&q.h1?'<button class="btn btn-ghost" id="hintbtn" onclick="showHint()">💡 רמז'+(S.hint===0?'':' נוסף')+'</button>':'')
 +(S.hint>0?'<div class="hintbox">💡 '+q.h1+'</div>':'')
 +(S.hint>1&&q.h2?'<div class="hintbox">💡💡 '+q.h2+'</div>':'')
 +'</div><div id="fb"></div></div>';
 app.innerHTML=html;
 window.scrollTo(0,0);
}
function tblHTML(rows){
 let h='<table class="tbl">';
 rows.forEach(function(r,i){const cells=r.split('|');h+='<tr>'+cells.map(function(c){return i===0?'<th>'+c+'</th>':'<td>'+c+'</td>'}).join('')+'</tr>'});
 return h+'</table>';
}
/* שאלה פתוחה עם בדיקה עצמית */
function revealOpen(){
 const q=S.qs[S.i];
 $('#fb').innerHTML='<div class="feedback ok"><b>תשובה לדוגמה:</b><div class="exp">'+q.e+'</div></div>'
 +'<p class="small"><b>השוו לתשובה שלך — איך יצא לך?</b></p>'
 +'<div class="self-grade"><button class="btn btn-pri" onclick="gradeOpen(true)">✅ צדקתי</button><button class="btn btn-ghost" onclick="gradeOpen(false)">❌ טעיתי</button></div>';
 window.scrollTo(0,document.body.scrollHeight);
}
function gradeOpen(good){
 const q=S.qs[S.i];S.answered=true;
 recordAnswer(q,good);
 $('#fb').innerHTML='<div class="feedback '+(good?'ok':'bad')+'"><b>'+(good?'✅ יופי! רשמתי לך הצלחה.':'❌ נרשם — השאלה תחזור בתרגול חולשות.')+'</b></div>'
 +'<button class="btn btn-pri btn-block" onclick="nextQ()">'+(S.i<S.qs.length-1?'השאלה הבאה ←':'סיכום ←')+'</button>';
 window.scrollTo(0,document.body.scrollHeight);
}
/* שאלת התאמה */
let M=null;
function initMatch(q){
 M={pairs:q.pairs,right:shuffle(q.pairs.map(function(p,i){return i})),selL:null,done:0,mist:0};
 drawMatch(q);
}
function drawMatch(q){
 let grid='<div class="match-grid"><div><div class="mhead">מושג</div>';
 q.pairs.forEach(function(p,i){
  const st=M.doneL&&M.doneL[i]?' done':(M.selL===i?' sel':'');
  grid+='<button class="mitem'+st+'" data-l="'+i+'" onclick="pickL('+i+')">'+p[0]+'</button>';
 });
 grid+='</div><div><div class="mhead">התאמה</div>';
 M.right.forEach(function(pi){
  const st=M.doneR&&M.doneR[pi]?' done':(M.errR===pi?' err':'');
  grid+='<button class="mitem'+st+'" data-r="'+pi+'" onclick="pickR('+pi+')">'+q.pairs[pi][1]+'</button>';
 });
 grid+='</div></div>';
 grid+='<div class="small center" id="matchmsg">בחרו מושג מימין ואז את ההתאמה שלו משמאל</div>';
 $('#matchzone').innerHTML=grid;
}
function pickL(i){if(M.doneL&&M.doneL[i])return;M.selL=i;drawMatch(S.qs[S.i])}
function pickR(pi){
 if(M.doneR&&M.doneR[pi])return;
 if(M.selL===null){$('#matchmsg').textContent='קודם בחרו מושג מהטור הימני ☝️';return}
 const q=S.qs[S.i];
 if(M.selL===pi){
  M.doneL=M.doneL||{};M.doneR=M.doneR||{};
  M.doneL[M.selL]=1;M.doneR[pi]=1;M.done++;M.selL=null;
  drawMatch(q);
  if(M.done===q.pairs.length){
   const good=M.mist===0;S.answered=true;
   recordAnswer(q,good);
   $('#fb').innerHTML='<div class="feedback '+(good?'ok':'bad')+'"><b>'+(good?'✅ כל ההתאמות נכונות!':'❌ סיימת, עם '+M.mist+' ניסיונות שגויים בדרך.')+'</b><div class="exp">'+q.e+'</div></div>'
   +'<button class="btn btn-pri btn-block" onclick="nextQ()">'+(S.i<S.qs.length-1?'השאלה הבאה ←':'סיכום ←')+'</button>';
   window.scrollTo(0,document.body.scrollHeight);
  }
 } else {
  M.mist++;M.errR=pi;M.selL=null;
  drawMatch(q);
  $('#matchmsg').textContent='לא בדיוק — נסו התאמה אחרת 💪';
  setTimeout(function(){M.errR=null;if($('#matchzone'))drawMatch(q)},700);
 }
}
function showHint(){
 S.hint=Math.min(2,S.hint+1);
 const q=S.qs[S.i];
 let hz='<div class="hintbox">💡 '+q.h1+'</div>';
 if(S.hint>1&&q.h2)hz+='<div class="hintbox">💡💡 '+q.h2+'</div>';
 if(S.hint<2&&q.h2)hz+='<button class="btn btn-ghost" onclick="showHint()">💡 רמז נוסף</button>';
 $('#hintzone').innerHTML=hz;
}
function answerQ(i){
 if(S.answered)return;S.answered=true;
 const q=S.qs[S.i],good=i===q._a;
 if(S.kind==='exam'){S.res[S.i]=i;markExam(i);return}
 recordAnswer(q,good);
 document.querySelectorAll('.opt').forEach(function(b){
  const bi=+b.getAttribute('data-i');b.disabled=true;
  if(bi===i)b.classList.add(good?'sel-ok':'sel-bad');
  if(!good&&bi===q._a)b.classList.add('reveal-ok');
 });
 $('#hintzone').innerHTML='';
 $('#fb').innerHTML='<div class="feedback '+(good?'ok':'bad')+'"><b>'+(good?'✅ נכון!':'❌ לא בדיוק.')+'</b>'
  +'<div class="exp">'+q.e+'</div>'
  +(!good?'<div class="exp small">התשובה הנכונה: <b>'+q._opts[q._a]+'</b></div>':'')
  +'</div>'
  +'<button class="btn btn-pri btn-block" onclick="nextQ()">'+(S.i<S.qs.length-1?'השאלה הבאה ←':'סיכום ←')+'</button>';
 window.scrollTo(0,document.body.scrollHeight);
}
function nextQ(){
 if(S.kind==='exam'){if(S.i<S.qs.length-1){S.i++;S.answered=false;drawExam()}else finishExam(false);return}
 if(S.i<S.qs.length-1){S.i++;S.hint=0;S.answered=false;drawQ()}
 else endSession();
}
function endSession(){
 const tot=S.qs.length,pct=Math.round(100*S.ok/tot);
 const cls=pct>=80?'ok':(pct>=60?'mid':'bad');
 app.innerHTML=topActions()
 +'<div class="card center"><h2>סיימת את '+S.title+'</h2>'
 +'<div class="res-big '+cls+'">'+S.ok+'/'+tot+'</div>'
 +'<p>'+(pct>=80?'כל הכבוד! 👏':pct>=60?'יפה — עוד תרגול קטן וזה יושב 💪':'שווה לחזור על הלימוד ולנסות שוב 📖')+'</p></div>'
 +'<div class="row"><button class="btn btn-pri2" onclick="nav(\'\')">🏠 בית</button><button class="btn btn-pri" onclick="nav(LAST_ROUTE)">עוד סיבוב</button></div>';
 trackMilestone('practice_complete',{title:S.title,correct:S.ok,total:tot});
}
/* --- מבחן לדוגמה: 20 שאלות · 30 דקות · בלי רמזים --- */
const EXAM_Q=20,EXAM_MIN=40;
function examPick(){
 const gradable=QUESTIONS.filter(function(q){return q.ty==='mc'||q.ty==='tf'});
 const per={t1:2,t2:2,t3:2,t4:1,t5:2,t6:2,t7:2,t8:2,t9:2,t10:1,t11:2}; /* 20 שאלות על 11 נושאים */
 let out=[];
 Object.keys(per).forEach(function(tid){
  const pool=shuffle(gradable.filter(function(q){return q.topic===tid}));
  out=out.concat(pool.slice(0,per[tid]));
 });
 if(out.length<EXAM_Q){const rest=shuffle(gradable.filter(function(q){return out.indexOf(q)<0}));out=out.concat(rest.slice(0,EXAM_Q-out.length))}
 const fin=shuffle(out).slice(0,EXAM_Q);fin.forEach(prepQ);return fin;
}
function scrExamSetup(){
 app.innerHTML=topActions()
 +'<div class="card"><h2>📝 מבחן לדוגמה — מדעים כיתה ח׳</h2>'
 +'<ul><li><b>'+EXAM_Q+' שאלות</b> מכל נושאי המיקוד למבחן.</li>'
 +'<li><b>'+EXAM_MIN+' דקות</b> — שעון רץ. נגמר הזמן? המבחן נעול אוטומטית.</li>'
 +'<li>בלי רמזים ובלי משוב באמצע — בדיוק כמו בכיתה.</li>'
 +'<li>בוחרים תשובה ועוברים הלאה — אי אפשר לחזור אחורה, כמו במבחן אמיתי.</li></ul>'
 +'<button class="btn btn-pri btn-block btn-lg" onclick="startExam()">מתחילים ▶</button>'
 +'<a class="btn btn-ghost btn-block" style="margin-top:8px;text-decoration:none" href="'+FORM_URL+'" target="_blank" rel="noopener">🧑‍🏫 קודם לטופס התרגול של המורה ↗</a>'
 +'<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="nav(\'\')">עוד לא</button></div>';
}
function startExam(){
 S={kind:'exam',qs:examPick(),i:0,res:[],left:EXAM_MIN*60,answered:false};
 location.hash='#/exam-run';
 drawExam();
 examTimer=setInterval(function(){
  S.left--;
  const el=$('#timer');if(el){el.textContent='⏱ '+fmtT(S.left);if(S.left<=300)el.classList.add('low')}
  if(S.left<=0)finishExam(true);
 },1000);
 trackMode('exam','מבחן לדוגמה');
}
function stopExamTimer(){if(examTimer){clearInterval(examTimer);examTimer=null}}
function drawExam(){
 const q=S.qs[S.i],tot=S.qs.length;
 app.innerHTML='<div class="topbar"><span class="qprog">מבחן לדוגמה · שאלה '+(S.i+1)+'/'+tot+'</span><span class="timer" id="timer">⏱ '+fmtT(S.left)+'</span></div>'
 +'<div class="card"><div class="bar"><i style="width:'+Math.round(100*S.i/tot)+'%"></i></div>'
 +'<h2 style="margin-top:10px">'+q.q+'</h2>'
 +(q.tbl?tblHTML(q.tbl):'')
 +'<div id="opts">'+q._opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" onclick="answerQ('+i+')">'+o+'</button>'}).join('')+'</div>'
 +'<div id="fb"></div></div>';
 window.scrollTo(0,0);
}
function markExam(i){
 document.querySelectorAll('.opt').forEach(function(b){const bi=+b.getAttribute('data-i');b.disabled=true;if(bi===i)b.classList.add('sel-ok')});
 $('#fb').innerHTML='<button class="btn btn-pri btn-block" onclick="nextQ()">'+(S.i<S.qs.length-1?'השאלה הבאה ←':'סיום המבחן ←')+'</button>';
}
function finishExam(timedOut){
 stopExamTimer();
 let ok=0;const per={};
 TOPICS.forEach(function(t){per[t.id]=[0,0]});
 S.qs.forEach(function(q,i){
  per[q.topic][1]++;
  const good=S.res[i]===q._a;if(good){ok++;per[q.topic][0]++}
  P.topics[q.topic].a++;if(good)P.topics[q.topic].c++;
  if(!good)P.wrong[q.id]=(P.wrong[q.id]||0)+1;else if(P.wrong[q.id])P.wrong[q.id]=Math.max(0,P.wrong[q.id]-1);
 });
 touchDay(EXAM_Q);
 const rec={d:new Date().toISOString().slice(0,10),score:ok,total:S.qs.length};
 P.exams.push(rec);if(P.exams.length>10)P.exams=P.exams.slice(-10);
 saveP(P);
 const pct=Math.round(100*ok/S.qs.length);
 const cls=pct>=80?'ok':(pct>=60?'mid':'bad');
 const weakT=TOPICS.filter(function(t){const p=per[t.id];return p[1]>0&&100*p[0]/p[1]<70});
 let perHtml='<table class="tbl"><tr><th>נושא</th><th>נכון</th></tr>';
 TOPICS.forEach(function(t){const p=per[t.id];if(p[1]>0)perHtml+='<tr><td>'+t.name+'</td><td>'+p[0]+'/'+p[1]+'</td></tr>'});
 perHtml+='</table>';
 let review='<details><summary>📋 צפייה בכל השאלות והתשובות</summary><div style="margin-top:8px">';
 S.qs.forEach(function(q,i){
  const good=S.res[i]===q._a;
  review+='<div class="feedback '+(good?'ok':'bad')+'"><b>שאלה '+(i+1)+':</b> '+q.q
  +'<div class="exp">'+(good?'✅ ענית נכון':'❌ ענית: '+(S.res[i]!==undefined?q._opts[S.res[i]]:'לא נענתה'))+'<br><b>התשובה הנכונה:</b> '+q._opts[q._a]+'<br>'+q.e+'</div></div>';
 });
 review+='</div></details>';
 app.innerHTML=topActions()
 +'<div class="card center"><h2>'+(timedOut?'⏱ נגמר הזמן — המבחן נעול':'סיימת את המבחן!')+'</h2>'
 +'<div class="res-big '+cls+'">'+ok+'/'+S.qs.length+'</div>'
 +'<p>'+(pct>=80?'מצוין! אתה מוכן 💪':pct>=60?'בכיוון הנכון — עוד קצת תרגול':'כדאי לחזור על הלימוד לפני המבחן')+'</p></div>'
 +'<div class="card"><h3>פירוט לפי נושא</h3>'+perHtml
 +(weakT.length?'<p class="small">🔎 לחיזוק לפני המבחן: <b>'+weakT.map(function(t){return t.name}).join(' · ')+'</b></p>':'<p class="small">כל הנושאים בדיוק של 70% ומעלה 👏</p>')
 +'</div>'+review
 +'<div class="row">'
 +(weakT.length?'<button class="btn btn-pri" onclick="nav(\'#/practice/'+weakT[0].id+'\')">✏️ תרגול: '+weakT[0].name+'</button>':'')
 +'<button class="btn btn-pri2" onclick="nav(\'#/exam\')">🔄 מבחן נוסף</button>'
 +'<button class="btn btn-ghost" onclick="nav(\'\')">🏠 בית</button></div>';
 trackMilestone('exam_complete',{score:ok,total:S.qs.length});
 window.scrollTo(0,0);
}

function exportP(){
 const blob=new Blob([JSON.stringify(P,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kimika-progress.json';a.click();
}
function importP(){
 const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
 inp.onchange=function(){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){try{const p=JSON.parse(r.result);if(p&&p.v===1&&p.topics){P=p;saveP(P);alert('הייבוא הצליח!');scrProgress()}else alert('קובץ לא מתאים')}catch(e){alert('שגיאה בקובץ')}};
  r.readAsText(f)};
 inp.click();
}
/* --- גיבוי ענן יומי — אותו חוזה מוכח כמו אלגבריקה/גאומטריקה/מדעיקה/אקולוגיקה, מרחב kimika --- */
const CB_URL='https://script.google.com/macros/s/AKfycbxmxolfKtSSXUY6ORmRDmK5VxjI6-Px5gNDDNA9fnhQ5-5ta6_NZQvaWj6jXjA46eja/exec';
const CB_APP='kimika',CB_KEYS=[PKEY,TKEY];
async function cbBackup(force){
 try{
  const code=(localStorage.getItem(TKEY_TRACK)||'').trim();if(code.length!==32)return;
  const today=dayKey();
  if(!force&&localStorage.getItem('cb_last_'+CB_APP)===today)return;
  const ls={};CB_KEYS.forEach(function(k){const v=localStorage.getItem(k);if(v!==null)ls[k]=v});
  const r=await fetch(CB_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({code:code,app:CB_APP,payload:{format:'shared-backup-v1',app:CB_APP,savedAt:new Date().toISOString(),localStorage:ls}})});
  const j=await r.json();if(j&&j.ok)localStorage.setItem('cb_last_'+CB_APP,today);
 }catch(e){}
}
let _backed=false;
function maybeAutoBackup(){if(_backed)return;_backed=true;cbBackup(false)}
async function cbRestore(){
 try{
  const code=(prompt('קוד הגיבוי (32 תווים, אותו קוד כמו באלגבריקה):')||'').trim();
  if(!code)return;
  if(code.length!==32){alert('הקוד צריך להיות 32 תווים');return}
  const j=await(await fetch(CB_URL+'?code='+encodeURIComponent(code)+'&app='+encodeURIComponent(CB_APP))).json();
  if(!j.ok||!j.payload){alert('לא נמצא גיבוי ענן לכימיקה'+(j.error?': '+j.error:''));return}
  const p=j.payload;
  if(p.format!=='shared-backup-v1'||!p.localStorage){alert('קובץ הגיבוי לא במבנה המוכר');return}
  if(!confirm('לשחזר את הגיבוי מ-'+(p.savedAt||'?')+'? המידע הנוכחי באפליקציה יוחלף.'))return;
  Object.entries(p.localStorage).forEach(function(kv){localStorage.setItem(kv[0],kv[1])});
  alert('השחזור הושלם. האפליקציה נטענת מחדש.');location.hash='';location.reload();
 }catch(e){alert('השחזור נכשל: '+e.message)}
}
/* --- מעקב לימוד (רק אם קוד ההסכמה כבר פעיל במכשיר — אותו גיליון פרטי, בלי הרחבת גילוי) --- */
const TRACK_URL='https://script.google.com/macros/s/AKfycbwlq3_queCzhjr_tVXN7BlsHR1_IK94c3BKra-G2mbI2TbJMhqNYXwZFSPj-kiNpT1NdQ/exec';
const TRACK_APP='כימיקה';
function trackCode(){return localStorage.getItem(TKEY_TRACK)||''}
function trackOn(){return /^[a-f0-9]{32}$/i.test(trackCode())}
function trackPost(e){
 if(!trackOn())return;
 const payload=JSON.stringify({v:1,code:trackCode(),app:TRACK_APP,at:new Date().toISOString(),id:Date.now().toString(36)+Math.random().toString(36).slice(2,10),...e});
 try{if(navigator.sendBeacon&&navigator.sendBeacon(TRACK_URL,new Blob([payload],{type:'text/plain'})))return;
 fetch(TRACK_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:payload}).catch(function(){})}catch(_){}
}
let _tmode={mode:'other',topic:'',since:Date.now(),started:false};
function trackFlush(){if(!trackOn())return;const now=Date.now();const sec=Math.min(300,Math.max(0,Math.round((now-_tmode.since)/1000)));if(sec>0&&_tmode.started)trackPost({type:'time',mode:_tmode.mode,topic:_tmode.topic,seconds:sec});_tmode.since=now}
function trackMode(m,t){if(!trackOn())return;if(!_tmode.started){_tmode.started=true;trackPost({type:'session_open'})}trackFlush();_tmode.mode=m;_tmode.topic=t||'';_tmode.since=Date.now()}
function trackMilestone(type,detail){if(!trackOn())return;if(!_tmode.started){_tmode.started=true;trackPost({type:'session_open'})}trackPost({type:type,...(detail||{})})}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(_tmode.started){trackFlush();trackPost({type:'session_close'});_tmode.started=false}}
 else if(_tmode.started){_tmode.since=Date.now()}
});
window.addEventListener('pagehide',function(){if(_tmode.started){trackFlush();trackPost({type:'session_close'});_tmode.started=false}});
setInterval(function(){if(!document.hidden&&_tmode.started)trackFlush()},60000);
function mountTrackToggle(){
 var btn=document.createElement('button');btn.type='button';btn.id='trackingToggle';
 btn.textContent=trackOn()?'מעקב לאביחי: פעיל · לחצו לכיבוי':'הפעלת מעקב לימוד לאביחי';
 btn.style.cssText='display:block;margin:14px auto 0;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:600 12px Heebo,Arial;opacity:.92;cursor:pointer';
 btn.title='הנתונים על שימוש, זמן וציונים נשלחים לגיליון הפרטי של מיקי בחשבון Google שלו';
 btn.onclick=function(){
  if(trackOn()){if(confirm('לכבות מעקב במכשיר זה?')){if(_tmode.started){trackPost({type:'session_close'});_tmode.started=false}localStorage.removeItem(TKEY_TRACK);btn.textContent='הפעלת מעקב לימוד לאביחי'}}
  else if(confirm('להפעיל מעקב במכשיר של אביחי? זמני שימוש לפי מצב, נושאים וציונים יישלחו לגיליון הפרטי של מיקי ב-Google. אין להפעיל במכשיר אחר.')){
   var entered=prompt('קוד ההפעלה מופיע בלשונית הסבר בגיליון הפרטי של מיקי:');
   if(!entered||!/^[a-f0-9]{32}$/i.test(entered.trim()))return;
   localStorage.setItem(TKEY_TRACK,entered.trim());btn.textContent='מעקב לאביחי: פעיל · לחצו לכיבוי';
  }};
 app.appendChild(btn);
}
/* --- הוספה למסך הבית (PWA) --- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(location.hash===''||location.hash==='#/progress')render()});
function installBox(){
 const dismissed=localStorage.getItem(IKEY);
 if(dismissed&&!deferredInstall)return '';
 let inner='';
 if(deferredInstall)inner='<button class="btn btn-pri btn-block" onclick="doInstall()">📲 הוסף לדף הבית — כמו אפליקציה</button>';
 else inner='<div class="inst-box">📲 <b>להוספה למסך הבית:</b> מתפריט הדפדפן (⋮) בחרו "הוספה למסך הבית" / "התקנת אפליקציה" — והאתר יישב במסך הבית כמו אפליקציה רגילה.</div><button class="btn btn-ghost btn-block" onclick="localStorage.setItem(\'kimika-install-hint-v1\',\'1\');render()">הבנתי, אל תציג שוב</button>';
 return '<div class="card">'+inner+'</div>';
}
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;localStorage.setItem(IKEY,'1');render()}
/* --- שחזור דרך #restore --- */
if(location.hash==='#restore'){location.hash='';setTimeout(cbRestore,400)}
render();
</script>
