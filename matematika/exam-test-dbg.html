<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מבחן מעורב | מתמטיקה בקצב שלך</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Secular+One&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#087f78"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/shell.css"><link rel="stylesheet" href="shared/pages.css">
<style>
.opt{display:block;width:100%;text-align:right;background:#fff;border:1.5px solid #d7e4e0;border-radius:12px;padding:12px 14px;font-size:15px;margin:8px 0;cursor:pointer;font-family:'Heebo';line-height:1.4}
.opt:hover{border-color:#087f78}
.opt.ok{background:#e7f6ee;border-color:#1f7a5c;color:#14532d;font-weight:700}
.opt.no{background:#fdeaea;border-color:#d1495b;color:#8c2f3b}
.opt.sel{background:#e8f3f2;border-color:#087f78;font-weight:600}
.opt:disabled{cursor:default;opacity:.75}
.opt.ok:disabled,.opt.no:disabled{opacity:1}
.fb{border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.6;margin-top:10px;display:none}
.fb.show{display:block}
.fb.good{background:#e7f6ee;color:#14532d}
.fb.hint{background:#fdf6ec;color:#7a5b12}
.qtext{font-size:17px;font-weight:600;line-height:1.65;margin:10px 0 4px}
.qmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:#617371;margin-bottom:2px;flex-wrap:wrap}
.sumrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef3f1;font-size:13.5px}
.sumrow:last-child{border-bottom:none}
.sumrow .nm{flex:1}
.timer{font-family:'Secular One';font-size:18px;color:#17302e;background:#fdf6ec;border:1.5px solid #f4c95d;border-radius:10px;padding:3px 12px}
.timer.low{background:#fdeaea;border-color:#d1495b;color:#8c2f3b}
.topicgroup{margin-bottom:8px}
.topicgroup>summary{cursor:pointer;font-weight:700;font-size:14.5px;padding:6px 2px;list-style:none}
.topicgroup>summary::before{content:'◂ ';color:#087f78}
.topicgroup[open]>summary::before{content:'▾ '}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:4px 0 8px}
.tgrid label{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 2px;cursor:pointer}
.tgrid input{accent-color:#087f78}
.revw{font-size:13px;color:#617371;line-height:1.6;padding:6px 0;border-bottom:1px solid #eef3f1}
.revw:last-child{border-bottom:none}
</style></head><body class="pad">
<div class="wrap" id="app"></div>
<script src="shared/alg-qmap.js"></script>
<script src="shared/mixed-bank.js"></script>
<script src="shared/mixed.js"></script>
<script src="shared/telemetry.js"></script>
<script src="shared/shell.js" data-subject="home" data-prefix=""></script>
<script>
(function(){
MIXED.startGameClock();
MIXED_TRACK.mountToggle();
var B=window.MIXED_BANK;
var topicTitle={};B.algTopics.forEach(function(t){topicTitle['alg:'+t.id]=t.title});B.geoTopics.forEach(function(t){topicTitle['geo:'+t.id]=t.title});
var subjName={alg:'אלגברה',geo:'גאומטריה'},subjColor={alg:'#087f78',geo:'#278c63'};
var params=new URLSearchParams(location.search),mode=params.get('mode')||'exam';
var app=document.getElementById('app');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function Mx(s){return esc(s).replace(/([0-9A-Za-z∠≌△⊥∥°²³√π¼½¾+*\/=×÷·^%().,:−–±≤≥≠-]+\s*)+/g,function(m){return /^[0-9A-Za-z(]/.test(m)?'<bdi dir="ltr">'+m+'</bdi>':m})}
function seenSet(sid){
 if(sid==='alg'){var st=MIXED.rd('algebrika-v3',null)||{};return new Set(Object.keys(st.first||{}))}
 var gs=MIXED.rd('geometrika-progress-v2',null)||{};return new Set(Object.keys(gs.answers||{}));
}
function pickSubject(sid,n,weakIds,topicFilter){
 var pool=B.questions.filter(function(q){return q.sid===sid&&(!topicFilter||topicFilter.has(q.topic))});
 var seen=seenSet(sid);
 var byTopic={};pool.forEach(function(q){(byTopic[q.topic]=byTopic[q.topic]||[]).push(q)});
 var topics=Object.keys(byTopic);
 topics.sort(function(a,b){
  var aw=weakIds.indexOf(a)>=0?0:1,bw=weakIds.indexOf(b)>=0?0:1;if(aw!==bw)return aw-bw;
  var as=byTopic[a].filter(function(q){return seen.has(q.id)}).length/byTopic[a].length;
  var bs=byTopic[b].filter(function(q){return seen.has(q.id)}).length/byTopic[b].length;
  return as-bs||Math.random()-0.5});
 var chosen=[],used={},order=topics.slice();
 while(chosen.length<n&&order.length){
  var next=[];
  for(var i=0;i<order.length&&chosen.length<n;i++){
   var t=order[i],qs=byTopic[t].filter(function(q){return !used[q.id]});
   if(!qs.length)continue;
   qs.sort(function(a,b){return (seen.has(a.id)?1:0)-(seen.has(b.id)?1:0)||Math.random()-0.5});
   used[qs[0].id]=1;chosen.push(qs[0]);next.push(t);
  }
  order=next;
 }
 return chosen;
}
function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function hero(t,s){return '<div class="hero"><h1>'+(t||'מבחן מעורב')+'</h1><p>'+(s||'')+'</p></div>'}
/* ================= מסך הגדרה: בחירת נושאים + סוג מבחן ================= */
function renderSetup(){
 var grp=function(sid,title,color,topics){
  return '<details class="topicgroup" open><summary><span class="tag" style="background:'+color+'">'+title+'</span> '+topics.length+' נושאים</summary>'
   +'<div class="tgrid">'+topics.map(function(t){return '<label><input type="checkbox" class="tpick" data-sid="'+sid+'" value="'+t.id+'" checked> '+esc(t.title)+'</label>'}).join('')+'</div>'
   +'<div style="display:flex;gap:8px"><button class="btn ghost" data-all="'+sid+'" style="margin-top:2px;padding:5px 12px;font-size:12.5px">בחירת הכל</button><button class="btn ghost" data-none="'+sid+'" style="margin-top:2px;padding:5px 12px;font-size:12.5px">ניקוי</button></div></details>';
 };
 app.innerHTML=hero('מבחן מעורב','בוחרים נושאים מאלגברה וגאומטריה — ואז: מבחן אמיתי בקצב שעון, או תרגול רגוע עם משוב מיידי.')
 +'<div class="card"><h3>אילו נושאים במבחן?</h3>'
 +grp('alg','אלגברה','#087f78',B.algTopics)+grp('geo','גאומטריה','#278c63',B.geoTopics)
 +'</div>'
 +'<div class="card"><h3>איך מתמודדים?</h3>'
 +'<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">'
 +'<button class="btn" id="startTimed" style="font-size:15.5px;padding:13px 20px">◔ מבחן בקצב שעון — 20 שאלות · 20 דקות</button>'
 +'<button class="btn ghost" id="startPractice" style="font-size:15.5px;padding:13px 20px">✎ תרגול עם משוב מיידי — 12 שאלות</button>'
 +'</div><p style="margin-top:10px">במבחן בקצב שעון אין רמזים והמשוב רק בסוף — כמו במבחן אמיתי. בתרגול מקבלים רמז והסבר אחרי כל שאלה.</p></div>';
 document.querySelectorAll('[data-all]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tpick[data-sid="'+b.getAttribute('data-all')+'"]').forEach(function(c){c.checked=true})}});
 document.querySelectorAll('[data-none]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tpick[data-sid="'+b.getAttribute('data-none')+'"]').forEach(function(c){c.checked=false})}});
 function selected(){var s={alg:new Set(),geo:new Set()};document.querySelectorAll('.tpick:checked').forEach(function(c){s[c.getAttribute('data-sid')].add(c.value)});return s}
 document.getElementById('startTimed').onclick=function(){var s=selected();startExam(s,20,20*60,true)};
 document.getElementById('startPractice').onclick=function(){var s=selected();startExam(s,12,0,false)};
}
/* ================= מנוע מבחן/תרגול ================= */
var set=null,idx=0,wrongClicks=0,hintsUsed=0,perTopic={},perSubj=null,timed=false,deadline=0,timerIv=null,answers=null;
function topicOf(q){return q.sid+':'+q.topic}
function buildSet(sel,n){
 var weak=MIXED.weakTopics();
 var wAlg=weak.alg.map(function(w){return w.id}),wGeo=weak.geo.map(function(w){return w.id});
 var na=Math.ceil(n/2),ng=n-na;
 var a=pickSubject('alg',na,wAlg,sel.alg.size?sel.alg:null);
 var g=pickSubject('geo',ng,wGeo,sel.geo.size?sel.geo:null);
 if(a.length<n)g=pickSubject('geo',n-a.length,wGeo,sel.geo.size?sel.geo:null);
 if(g.length<n)a=pickSubject('alg',n-g.length,wAlg,sel.alg.size?sel.alg:null);
 return shuffled(a.concat(g));
}
function startExam(sel,n,seconds,isTimed){
 set=buildSet(sel,n);
 if(!set.length){app.innerHTML=hero()+'<div class="card"><h3>לא נבחרו נושאים</h3><p>סמנו לפחות נושא אחד כדי להתחיל.</p><button class="btn" id="bk">חזרה</button></div>';document.getElementById('bk').onclick=renderSetup;return}
 idx=0;timed=isTimed;answers=[];perSubj={alg:{f:0,t:0},geo:{f:0,t:0}};perTopic={};
 if(timed){deadline=Date.now()+seconds*1000;timerIv=setInterval(tickTimer,500)}
 renderQ();
}
function tickTimer(){
 var el=document.getElementById('tmr');if(!el)return;
 var left=Math.max(0,Math.round((deadline-Date.now())/1000));
 el.textContent='◔ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 el.classList.toggle('low',left<=120);
 if(left<=0){finishExam(true)}
}
function qHead(q,i){
 return '<div class="qmeta"><span class="tag" style="background:'+subjColor[q.sid]+'">'+subjName[q.sid]+'</span><span>'+esc(topicTitle[topicOf(q)]||q.topic)+'</span><span>·</span><span>'+esc(q.diff)+'</span>'
  +'<span style="margin-inline-start:auto;display:flex;gap:8px;align-items:center">'+(timed?'<span class="timer" id="tmr"></span>':'')+'שאלה '+(i+1)+' מתוך '+set.length+'</span></div>'
  +'<div class="bar"><i style="width:'+(i/set.length*100)+'%"></i></div>';
}
/* --- תרגול עם משוב מיידי --- */
function renderPracticeQ(){
 var q=set[idx];wrongClicks=0;hintsUsed=0;window.__correctIdx=q.correct;
 app.innerHTML=hero('תרגול מעורב','רמז והסבר אחרי כל שאלה')
  +'<div class="card">'+qHead(q,idx)
  +'<div class="qtext">'+Mx(q.q)+'</div>'
  +'<div>'+q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><bdi>'+esc(o)+'</bdi></button>'}).join('')+'</div>'
  +'<div class="fb" id="fb"></div>'
  +'<div style="margin-top:12px;text-align:left"><button class="btn" id="next" style="display:none">'+(idx+1<set.length?'השאלה הבאה':'לסיכום')+'</button></div>'
  +'</div>';
 MIXED_TRACK.mode(q.sid,'practice',topicTitle[topicOf(q)]||q.topic);
 var answered=false;
 Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
  b.onclick=function(){
   var i=+b.getAttribute('data-i');
   if(answered)return;
   if(i===q.correct){
    answered=true;b.classList.add('ok');
    var first=wrongClicks===0;
    recordAnswer(q,first,true,hintsUsed,wrongClicks);
    markStats(q,first);
    var fb=document.getElementById('fb');
    fb.className='fb show good';
    fb.innerHTML='<b>נכון!</b>'+(q.explain?'<br>'+Mx(q.explain):'');
    Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(x){x.disabled=true});
    document.getElementById('next').style.display='inline-block';
   }else{
    wrongClicks++;b.classList.add('no');b.disabled=true;
    if(q.sid==='alg'){MIXED.algFirst(q,false);MIXED.algWrong(q)}
    var fb=document.getElementById('fb'),hint=wrongClicks===1?q.h1:(wrongClicks===2?q.h2:'');
    if(hint){hintsUsed++;fb.className='fb show hint';fb.innerHTML='<b>עדיין לא.</b> רמז: '+Mx(hint)}
    else{fb.className='fb show hint';fb.innerHTML='<b>עדיין לא.</b> נסו שוב — שימו לב לפרטים הקטנים.'}
   }
  };
 });
 document.getElementById('next').onclick=function(){idx++;if(idx<set.length)renderPracticeQ();else finishExam(false)};
}
/* --- מבחן בקצב שעון --- */
function renderTimedQ(){
 var q=set[idx];window.__correctIdx=q.correct;
 app.innerHTML=hero('מבחן בקצב שעון','בלי רמזים — המשוב והסיכום בסוף')
  +'<div class="card">'+qHead(q,idx)
  +'<div class="qtext">'+Mx(q.q)+'</div>'
  +'<div>'+q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><bdi>'+esc(o)+'</bdi></button>'}).join('')+'</div>'
  +'</div>';
 MIXED_TRACK.mode(q.sid,'quiz',topicTitle[topicOf(q)]||q.topic);
 tickTimer();
 Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
  b.onclick=function(){
   var i=+b.getAttribute('data-i');
   answers[idx]={q:q,chosen:i,ok:i===q.correct};
   idx++;
   if(idx<set.length)renderTimedQ();else finishExam(false);
  };
 });
}
/* --- כתיבה למפתחות ילידיים --- */
function recordAnswer(q,firstTry,okFinal,hints,wrongs){
 if(q.sid==='alg'){
  MIXED.algFirst(q,firstTry);
  if(okFinal)MIXED.algRight(q);
  if(hints)MIXED.algHint(q,hints);
 }else{
  MIXED.geoFinish(q,wrongs,hints);
 }
}
function markStats(q,first){
 perSubj[q.sid].t++;if(first)perSubj[q.sid].f++;
 var k=topicOf(q);perTopic[k]=perTopic[k]||{f:0,t:0};perTopic[k].t++;if(first)perTopic[k].f++;
}
/* --- סיום וסיכום --- */
function finishExam(timedOut){
 if(timerIv){clearInterval(timerIv);timerIv=null}
 var total=set.length;
 if(timed){
  /* רישום התשובות שנענו בלבד */
  answers.forEach(function(a){
   if(!a)return;
   recordAnswer(a.q,a.ok,a.ok,0,a.ok?0:1);
   markStats(a.q,a.ok);
  });
  if(timedOut)for(var i=0;i<total;i++){if(!answers[i]){perTopic[topicOf(set[i])]=perTopic[topicOf(set[i])]||{f:0,t:0}}}
 }
 var firstTry=timed?answers.filter(function(a){return a&&a.ok}).length:(perSubj.alg.f+perSubj.geo.f);
 /* טלמטריה לפי תחום — אותם שמות אירועים כמו באפליקציות */
 ['alg','geo'].forEach(function(s){
  var d=perSubj[s];if(!d.t)return;
  var wrong={};Object.keys(perTopic).forEach(function(k){
   var parts=k.split(':');if(parts[0]!==s)return;
   var w=perTopic[k].t-perTopic[k].f;if(w>0)wrong[parts[1]]=w;
  });
  if(timed)MIXED_TRACK.milestone(s,'quiz_complete',{correct:d.f,total:d.t,wrongByTopic:wrong});
  else MIXED_TRACK.milestone(s,'practice_complete',{topic:'מעורב',set:mode==='daily'?'daily':mode==='boost'?'boost':'mixed',correct:d.f,total:d.t,wrongByTopic:wrong});
 });
 var rec={date:new Date().toISOString(),mode:mode,timed:timed,first:firstTry,total:total,bySubj:perSubj};
 MIXED.saveExam(rec);
 if(mode==='daily')MIXED.saveMission({done:true,first:firstTry,total:total});
 var pct=Math.round(firstTry/total*100);
 var weakSess=Object.keys(perTopic).filter(function(k){return perTopic[k].f<perTopic[k].t}).slice(0,5).map(function(k){return topicTitle[k]||k});
 var html=hero(timed?'סיכום מבחן':'סיכום תרגול','')
  +'<div class="card" style="text-align:center"><p style="font-size:14px;color:#617371">'+(timed?'תשובות נכונות':'בנסיון הראשון')+(timedOut?' · הסתיים הזמן':'')+'</p><div style="font-family:\'Secular One\';font-size:44px;color:#087f78"><bdi dir="ltr">'+firstTry+' / '+total+'</bdi></div>'
  +'<p style="font-size:14px;color:#617371">'+pct+'% · הנקודות והרצף מתעדכנים אוטומטית</p></div>'
  +'<div class="sect">דיוק לפי תחום</div><div class="card">'
  +['alg','geo'].map(function(s){var d=perSubj[s];var p=d.t?Math.round(d.f/d.t*100):0;
   return '<div class="sumrow"><span class="tag" style="background:'+subjColor[s]+'">'+subjName[s]+'</span><div class="nm"><div class="bar" style="margin:0"><i style="width:'+p+'%;background:'+subjColor[s]+'"></i></div></div><b><bdi dir="ltr">'+d.f+'/'+d.t+'</bdi></b></div>'}).join('')
  +'</div>';
 if(weakSess.length){
  html+='<div class="sect">כדאי לחזק</div><div class="card">'+weakSess.map(function(t){return '<div class="sumrow"><div class="nm">'+esc(t)+'</div></div>'}).join('')+'<a class="btn ghost" href="exam.html?mode=boost">חיזוק נקודתי עכשיו</a></div>';
 }
 if(timed){
  var review=answers.filter(function(a){return a&&!a.ok});
  if(review.length){
   html+='<div class="sect">מעבר על הטעויות</div><div class="card">'+review.map(function(a){
    return '<div class="revw"><b>'+Mx(a.q.q)+'</b><br>התשובה שלך: <bdi>'+esc(a.q.opts[a.chosen])+'</bdi> · הנכונה: <b style="color:#1f7a5c"><bdi>'+esc(a.q.opts[a.q.correct])+'</bdi></b>'+(a.q.explain?'<br>'+Mx(a.q.explain):'')+'</div>';
   }).join('')+'</div>';
  }
 }
 html+='<div class="card" style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="exam.html">מבחן נוסף</a><a class="btn ghost" href="progress.html">ההתקדמות שלי</a><a class="btn ghost" href="index.html">לבית</a></div>';
 app.innerHTML=html;
}
/* ================= נקודות כניסה ================= */
if(mode==='daily'||mode==='boost'){
 var direct={daily:{n:4,title:'המשימה היומית',sub:'4 שאלות קצרות משני התחומים. משלימים וממשיכים עם היום.'},boost:{n:8,title:'חיזוק אישי מעורב',sub:'8 שאלות מנקודות החולשה שלך בשני התחומים.'}}[mode];
 if(mode==='boost'){var w=MIXED.weakTopics();if(!w.alg.length&&!w.geo.length){
  app.innerHTML=hero(direct.title,direct.sub)+'<div class="card"><h3>עדיין אין נקודות חולשה</h3><p>אחרי עוד קצת תרגול בשני התחומים נדע בדיוק מה לחזק. בינתיים אפשר מבחן מעורב רגיל.</p><a class="btn" href="exam.html">מבחן מעורב</a></div>';
 }else{
  set=buildSet({alg:new Set(B.algTopics.map(function(t){return t.id})),geo:new Set(B.geoTopics.map(function(t){return t.id}))},direct.n);
  timed=false;perSubj={alg:{f:0,t:0},geo:{f:0,t:0}};perTopic={};idx=0;answers=null;
  app.innerHTML=hero(direct.title,direct.sub)+'<div class="card"><h3>מוכנים?</h3><p>'+set.length+' שאלות. בכל שאלה בוחרים תשובה; אם טועים מקבלים רמז ומנסים שוב. בסוף סיכום עם מה שכדאי לחזק.</p><button class="btn" id="go" style="font-size:16px;padding:12px 26px">התחלה</button></div>';
  document.getElementById('go').onclick=function(){renderPracticeQ()};
 }
 }else{
  set=buildSet({alg:new Set(B.algTopics.map(function(t){return t.id})),geo:new Set(B.geoTopics.map(function(t){return t.id}))},direct.n);
  timed=false;perSubj={alg:{f:0,t:0},geo:{f:0,t:0}};perTopic={};idx=0;answers=null;
  app.innerHTML=hero(direct.title,direct.sub)+'<div class="card"><h3>מוכנים?</h3><p>'+set.length+' שאלות. בכל שאלה בוחרים תשובה; אם טועים מקבלים רמז ומנסים שוב.</p><button class="btn" id="go" style="font-size:16px;padding:12px 26px">התחלה</button></div>';
  document.getElementById('go').onclick=function(){renderPracticeQ()};
 }
}else{
 renderSetup();
}
})();
</script>
<script>
window.onerror=function(m,src,l,c){document.title="JSERR "+m+" @"+l+":"+c};
window.addEventListener("load",function(){setTimeout(function(){
try{
var btn=document.getElementById("startTimed");
document.title="BTN "+(btn?"found":"missing");
if(!btn)return;
btn.click();
document.title="CLICKED";
var iv=setInterval(function(){
var opts=document.querySelectorAll(".opt");
if(opts.length){opts[0].click();return}
clearInterval(iv);document.title="ENDED";
},250);
}catch(e){document.title="ERR "+e.message}
},700)});
</script></body></html>
