function tab(name){if(run&&!run.finished&&!confirm('לצאת מהתרגול? התשובות שכבר נבדקו נשמרו, אבל התרגול הנוכחי יסתיים.'))return;clearInterval(interval);run=null;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));render(name)}
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
function render(name){const v=$('#view');if(name==='home'){let n=Object.values(state.stats).reduce((a,x)=>a+x.tries,0);v.innerHTML=`<div class="card hero"><span>צעד קטן בכל יום</span><h2>קודם מבינים.<br>אחר כך מנסים לבד.</h2><p>תרגול קצר, הסבר כשצריך, ומבדק בלי רמזים.</p><div class="row">${b('בדיקת פתיחה · 12 שאלות',"start('diagnostic')",'primary')}${b('לימוד קצר',"tab('learn')")}</div></div><div class="note"><b>המבדק הקרוב: 23.11.2026</b> · נוספו 58 שאלות תרגול ומבדק לדוגמה 2 (21.11)<br>לפי לוח המבחנים המצורף האחרון של ו2. הכנה להווה פשוט, יחיד ורבים והמילים הכחולות. רשימת יוצאי הדופן המדויקת מהכיתה עדיין חסרה.</div><div class="grid" style="margin-top:16px"><div class="card"><h3>15 דקות של תרגול</h3><p>10 שאלות מעורבות. מנסים לבד, מקבלים הסבר ומתקדמים.</p>${b('מתחילים',"start('mixed')",'primary')}</div><div class="card"><h3>מבדק לדוגמה</h3><p>20 שאלות · 30 דקות · בלי רמזים ובלי בדיקה באמצע.</p>${b('אני מוכן למבדק',"start('mock')")}</div><div class="card"><h3>מבדק לדוגמה 2 · חדש</h3><p>עוד 20 שאלות · 30 דקות · אותם כללים, תרגול נוסף.</p>${b('אני מוכן למבדק 2',"start('mock2')")}</div></div><div class="card"><b>${n} תשובות כבר תורגלו</b><p>כל ניסיון עוזר לגלות על מה כדאי לחזור.</p>${b('חיזוק מה שצריך',"start('weak')")}</div>`}
if(name==='learn')v.innerHTML=`<div class="card"><h2>לומדים לפני שמנסים</h2><p>בחרו נושא. קראו את הכלל ואת הדוגמה, ואז פתרו תרגול קצר.</p></div>`+DATA.lessons.map((l,i)=>`<article class="card"><span class="badge">${i+1} / 6</span><h2>${l[0]}</h2><p>${l[1]}</p><div class="example en" lang="en">${l[2]}</div><p>${l[3]}</p>${b('תרגול בנושא הזה',`start('topic',${i})`,'primary')}</article>`).join('');
if(name==='practice')v.innerHTML=`<div class="card"><h2>איך נתרגל היום?</h2><div class="row">${b('10 שאלות מעורבות',"start('mixed')",'primary')}${b('חיזוק אישי',"start('weak')")}${b('מבדק · 30 דקות',"start('mock')")}</div></div><div class="grid">`+labels.map((l,i)=>`<div class="card"><h3>${l}</h3>${b('תרגול קצר',`start('topic',${i})`)}</div>`).join('')+`</div>`;
if(name==='words')v.innerHTML=`<div class="card"><h2>21 המילים הכחולות</h2><p>לפי צילומי REMEMBER שנבחרו ב־7.11. קראו, כסו, כתבו ובדקו.</p>${b('בדיקת כתיב',"start('topic',5)",'primary')}</div><div class="vocab">`+DATA.vocab.map(([a,h])=>`<div class="word"><b lang="en">${a.replace('|',' / ')}</b><span>${h}</span></div>`).join('')+`</div>`;
if(name==='parent')parentView();}
function promptHTML(q){const k=q.p.indexOf(': ');if(k<0)return '<div class="en" lang="en">'+esc(q.p)+'</div>';return '<div>'+esc(q.p.slice(0,k))+':</div><div class="en" lang="en">'+esc(q.p.slice(k+2))+'</div>'}function start(mode,t){clearInterval(interval);let pool=DATA.q,arr;if(mode==='mock'||mode==='mock2'){const mids=mode==='mock'?DATA.mockids:DATA.mockids2;arr=mids.map(id=>pool.find(q=>q.id===id))}else if(mode==='diagnostic')arr=labels.flatMap((_,i)=>shuffle(pool.filter(q=>q.t===i)).slice(0,2));else if(mode==='topic')arr=shuffle(pool.filter(q=>q.t===t));else if(mode==='weak'){arr=pool.filter(q=>state.stats[q.id]&&state.stats[q.id].wrong>0);if(!arr.length){alert('עדיין אין שאלות לחיזוק. נתחיל בסט מעורב.');arr=pool}arr=shuffle(arr).slice(0,10)}else arr=shuffle(pool).slice(0,10);run={mode,arr,at:0,answers:[],start:Date.now(),finished:false};if(mode==='mock'||mode==='mock2'){run.deadline=Date.now()+30*60*1000;interval=setInterval(()=>{if(!run||run.finished)return;if(Date.now()>=run.deadline){capture(false);finish();return}const el=$('#timer');if(el)el.textContent=timeLeft()},1000)}showQ();window.scrollTo(0,0)}
function timeLeft(){let s=Math.max(0,Math.ceil((run.deadline-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function showQ(){let q=run.arr[run.at];$('#view').innerHTML=`<div class="card"><div class="row"><span class="badge">${labels[q.t]}</span><span>שאלה ${run.at+1} מתוך ${run.arr.length}</span>${(run.mode==='mock'||run.mode==='mock2')?'<span id="timer" class="timer" aria-label="זמן שנותר">'+timeLeft()+'</span>':''}</div><div class="progress"><span style="width:${100*run.at/run.arr.length}%"></span></div><h2>מנסים לבד</h2><div class="qtext">${promptHTML(q)}</div><label for="answer">התשובה באנגלית</label><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en"><div id="feedback" aria-live="polite"></div><div class="row" id="controls">${(run.mode==='mock'||run.mode==='mock2')?b('שמור והמשך',"nextMock()",'primary'):b('בדיקת תשובה',"check()",'primary')}${(run.mode!=='mock'&&run.mode!=='mock2')?b('רמז',"hint()"):''}${b('דלג',"skip()")}</div></div>`;$('#answer').onkeydown=e=>{if(e.key==='Enter')run.mode==='mock'?nextMock():check()};}
function hint(){$('#feedback').innerHTML=`<div class="example">${run.arr[run.at].h}</div>`}
function capture(record=true){if(run.answers[run.at])return;const q=run.arr[run.at],value=$('#answer')?.value||'';let ok=q.a.some(a=>norm(a)===norm(value));run.answers[run.at]={value,ok};if(record&&run.mode!=='mock'&&run.mode!=='mock2')recordOne(q,ok)}
function recordOne(q,ok){let s=state.stats[q.id]||{tries:0,right:0,wrong:0};s.tries++;if(ok){s.right++;s.wrong=Math.max(0,s.wrong-1)}else s.wrong++;state.stats[q.id]=s;save()}
function check(){if(!$('#answer')||run.answers[run.at])return;capture();let q=run.arr[run.at],a=run.answers[run.at];$('#answer').disabled=true;$('#feedback').innerHTML=`<div class="example ${a.ok?'good':'retry'}"><b>${a.ok?'נכון, יפה!':'כדאי לבדוק שוב את המבנה והכתיב'}</b><p>תשובה לדוגמה:</p><div class="en">${esc(q.a[0])}</div><p>${q.e}</p>${!a.ok?'<small>ניסוח אחר יכול להיות נכון. בסיכום אפשר לבדוק יחד עם הורה.</small>':''}</div>`;$('#controls').innerHTML=b('ממשיכים',"advance()",'primary')}
function nextMock(){capture(false);advance()}function skip(){if(run.mode==='mock'||run.mode==='mock2')capture(false);else capture();advance()}
function advance(){run.at++;if(run.at>=run.arr.length)finish();else{showQ();window.scrollTo(0,0)}}
function finish(){if(!run||run.finished)return;clearInterval(interval);run.finished=true;run.arr.forEach((q,i)=>{if(!run.answers[i])run.answers[i]={value:'',ok:false};if(run.mode==='mock'||run.mode==='mock2')recordOne(q,run.answers[i].ok)});const right=run.answers.filter(a=>a.ok).length;state.sessions.push({date:new Date().toISOString(),mode:run.mode,right,total:run.arr.length});state.sessions=state.sessions.slice(-30);save();$('#view').innerHTML=`<div class="card hero"><h2>סיימת, כל הכבוד על ההתמדה.</h2><p>${right} מתוך ${run.arr.length} תשובות תואמות למפתח.</p><p>השלב הבא: לבחור שני דברים לחיזוק, לא הכול בבת אחת.</p></div><div class="card"><h3>לפי נושאים</h3>`+labels.map((l,t)=>{let ids=run.arr.map((q,i)=>q.t===t?i:-1).filter(i=>i>=0);return ids.length?`<p>${l}: ${ids.filter(i=>run.answers[i].ok).length} / ${ids.length}</p>`:''}).join('')+`<p class="sub">הבדיקה אוטומטית ומקבלת כמה ניסוחים. תשובה מלאה אחרת יכולה להיות נכונה. בדקו אותה עם הורה לפני שמסיקים שיש קושי.</p></div>`+run.arr.map((q,i)=>`<details class="card"><summary>${i+1}. ${labels[q.t]} · ${run.answers[i].ok?'תואם למפתח':'לחזרה ובדיקה'}</summary><p dir="auto">${promptHTML(q)}</p><p>התשובה שלך:</p><div class="en">${esc(run.answers[i].value||'(לא נענתה)')}</div><p>תשובה לדוגמה:</p><div class="en">${esc(q.a.join(' / '))}</div><p>${q.e}</p></details>`).join('')+`<div class="row">${b('חזרה להתחלה',"tab('home')",'primary')}${b('חיזוק אישי',"start('weak')")}</div>`;window.scrollTo(0,0)}
function parentView(){$('#view').innerHTML=`<div class="card"><h2>להורה ולהדפסה</h2><p>החומר מבוסס על לוח המבחנים של ו2 ועל 21 המילים הכחולות שנשלחו ב־7.11. התאריך בלוח האחרון: <b>23.11</b>.</p><div class="note">לא הכנה מלאה עדיין: חסרה הרשימה המדויקת של שמות העצם יוצאי הדופן שחולקה בכיתה. לא הוספנו רשימה משוערת למבדק. in/on/at וזמנים אחרים לא נכללו כי אינם במיקוד הזה.</div><p>סדר מומלץ: בדיקת פתיחה, לימוד לפי הקשיים, 10 שאלות ליום, ולבסוף מבדק בלי רמזים. תרגול מענה מלא דורש גם בדיקה אנושית אם הניסוח שונה.</p><h3>מוכן לנייר</h3><p>A4, שחור־לבן, 100%. שני דפי תלמיד ללא פתרונות: מבדק לדוגמה, מבדק לדוגמה 2 וכל 21 פריטי המילים. מפתח למבדק 1 נמסר להורה בנפרד; הפתרונות של מבדק 2 מופיעים באפליקציה בסיכום.</p><div class="row">${b('הדפסת דף תלמיד 1',"printSheet()",'primary')}${b('הדפסת דף תלמיד 2',"printSheet2()")}</div><h3>גיבוי ההתקדמות</h3><p>ההתקדמות נשמרת רק במכשיר ובדפדפן הזה. לא מוחקים נתוני אתר כדי לעדכן. ייצוא שומר את התוצאות בקובץ מקומי.</p><div class="row">${b('ייצוא גיבוי',"exportData()")}${b('ייבוא גיבוי',"document.getElementById('restore').click()")}</div><input id="restore" class="hidden" type="file" accept="application/json" onchange="importData(this)"><h3>המבדקים האחרונים</h3>`+(state.sessions.slice(-5).reverse().map(s=>`<p>${new Date(s.date).toLocaleDateString('he-IL')}: ${s.right}/${s.total} · ${(s.mode==='mock'||s.mode==='mock2')?'מבדק':s.mode==='diagnostic'?'בדיקת פתיחה':'תרגול'}</p>`).join('')||'<p>טרם הושלם תרגול במכשיר הזה.</p>')+`<details><summary>מקורות וגבולות</summary><p>לוח מבחנים מחצית א׳ שכבת ו׳, מצורף לסיכום השבועי מ־13.11; ההנחיות לדקדוק בסיכום 6.11; צילומי REMEMBER שנבחרו ב־7.11. התרגילים כאן חדשים, אינם שאלות בית הספר. לא נוספו נושאים סמוכים שלא הופיעו במיקוד.</p></details></div>`}
function printSheet(){const qs=DATA.mockids.map(id=>DATA.q.find(q=>q.id===id));let parts=[];for(let j=0;j<3;j++)parts.push(`<div class="printpage"><h1>אנגליקה · תרגול למבדק</h1><p>כיתה ו׳ | שם: __________ | תאריך: __________</p><p>${j===0?'20 שאלות, בלי רמזים. כתבו תשובה באנגלית. סימולציה: 30 דקות.':''}</p>`+qs.slice(j*7,j*7+7).map((q,i)=>`<div class="printq"><div><b>${j*7+i+1}.</b> ${promptHTML(q)}</div><div class="answerline"></div></div>`).join('')+`<small>רשימת יוצאי הדופן מהכיתה חסרה ואינה נבדקת כאן.</small></div>`);parts.push(`<div class="printpage"><h1>המילים הכחולות · כתיב</h1><p>כתבו את המילה באנגלית, בלי מילון. בסוף בדקו עם הורה.</p><div class="printgrid">`+DATA.vocab.map(([a,h],i)=>`<div class="printq">${i+1}. ${h}<div class="answerline"></div></div>`).join('')+`</div></div>`);$('#printArea').innerHTML=parts.join('');window.print()}
function printSheet2(){const qs=DATA.mockids2.map(id=>DATA.q.find(q=>q.id===id));let parts=[];for(let j=0;j<3;j++)parts.push(`<div class="printpage"><h1>אנגליקה · תרגול למבדק 2</h1><p>כיתה ו׳ | שם: __________ | תאריך: __________</p><p>${j===0?'20 שאלות, בלי רמזים. כתבו תשובה באנגלית. סימולציה: 30 דקות.':''}</p>`+qs.slice(j*7,j*7+7).map((q,i)=>`<div class="printq"><div><b>${j*7+i+1}.</b> ${promptHTML(q)}</div><div class="answerline"></div></div>`).join('')+`<small>רשימת יוצאי הדופן מהכיתה חסרה ואינה נבדקת כאן.</small></div>`);$('#printArea').innerHTML=parts.join('');window.print()}
function exportData(){const blob=new Blob([JSON.stringify({app:KEY,data:state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='anglika-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(el){try{let j=JSON.parse(await el.files[0].text());if(j.app!==KEY||!j.data||!Array.isArray(j.data.sessions)||typeof j.data.stats!=='object'||j.data.stats===null)throw Error();if(!confirm('להחליף רק את התקדמות אנגליקה בגיבוי שנבחר?'))return;state=j.data;save();parentView();alert('הגיבוי נטען.')}catch(e){alert('הקובץ אינו גיבוי אנגליקה תקין. שום דבר לא הוחלף.')}}
