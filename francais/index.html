<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>צרפתית — תרגול לבוחן · כיתה ח׳</title>
<meta name="description" content="תרגול צרפתית לפי דף המורה: ברכות ונימוס, הצגה עצמית, מה שלומך, שאלות ותשובות ומספרים 0 עד 20.">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#14213a;--ink2:#4a5a78;--line:#d6e0f0;--pri:#1d4ed8;--pri2:#2f66ea;--soft:#e2ebfd;--ok:#0f8a5f;--oks:#e3f6ee;--bad:#c73e4e;--bads:#fbe7ea;--shadow:0 2px 10px rgba(20,33,58,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Heebo,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.45rem;margin:6px 0 2px}h2{font-size:1.15rem;margin:4px 0 8px}
.small{font-size:.85rem;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 16px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;margin:8px 0;font-family:inherit}
.btn:active{transform:scale(.98)}
.pri{background:var(--pri);color:#fff}.sec{background:var(--soft);color:var(--pri)}.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}
.btn.sm{width:auto;display:inline-flex;padding:6px 12px;font-size:.85rem;margin:2px}
.fr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700;color:var(--pri)}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:1rem;cursor:pointer;color:var(--ink);font-family:inherit}
.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.bad{background:var(--bads);border-color:var(--bad)}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 10px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 12px}.bar>i{display:block;height:100%;background:var(--pri)}
.tok{display:inline-block;direction:ltr;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;margin:4px;font-size:1.05rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.tok.used{opacity:.25;pointer-events:none}
.built{direction:ltr;min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:6px;margin:8px 0;text-align:left}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}.fb.ok{background:var(--oks);color:var(--ok)}.fb.bad{background:var(--bads);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
table{width:100%;border-collapse:collapse}td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.flip{background:var(--soft);border-radius:14px;padding:16px;text-align:center;font-size:1.2rem;cursor:pointer;margin:8px 0;min-height:76px}
input.txt{width:100%;direction:ltr;text-align:left;font-size:1.1rem;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit}
.chip{display:inline-block;background:var(--soft);color:var(--pri);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.nav{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
/* ===== תוכן: רק מדף המורה (סילבי עמסלם) — "אוצר מילים והמספרים" כיתות ח׳ 1/2/3/4/7 ===== */
const TOPICS=[
{id:'g',name:'ברכות ונימוס',items:[
['Salut / Coucou','היי'],['Bonjour / Bonsoir','שלום או בוקר טוב / ערב טוב'],['Bonne journée / Bonne année','יום נעים / שנה טובה'],['Au revoir / À bientôt','להתראות / נתראה בקרוב'],['À plus / À plus tard','נתראה אחר כך'],['Pardon / Excuse-moi','סליחה'],['Je suis désolé(e)','אני מצטער/ת'],['Cher / Chère','יקר / יקרה']]},
{id:'s',name:'הצגה עצמית ומה שלומך',items:[
['Le nom / Le prénom','שם המשפחה / השם הפרטי'],['Les amis / Les amies','החברים / החברות'],['Ça va très bien / Super bien','טוב מאוד / ממש טוב'],['Ça va bien / Ça va','טוב / בסדר'],['Ça va moyen / Comme ci, comme ça / Bof','ככה ככה'],['Pas tellement / Ça va mal / Ça va très mal','לא כל כך / לא טוב / ממש לא טוב']]},
{id:'q',name:'שאלות ותשובות',items:[
['Comment tu t’appelles ?','איך קוראים לך?','Je m’appelle David, et toi ?'],
['Comment ça va ?','מה שלומך?','Ça va bien, et toi ?'],
['Où tu habites ?','איפה את גרה? / איפה אתה גר?','Moi, j’habite à Rehovot, et toi ?'],
['Qui est-ce ?','מי זה? / מי זאת?','C’est David. / C’est moi.'],
['Tu parles français ?','האם את מדברת או אתה מדבר צרפתית?','Oui, je parle un peu français et je parle très bien hébreu.'],
['Où tu étudies ?','איפה את לומדת או אתה לומד?','J’étudie au collège De Shalit.'],
['Tu es professeur ?','האם את/ה מורה?','Non, je suis élève.']]},
{id:'n',name:'מספרים 0 עד 20',items:[]}
];
const NUMS=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'];
TOPICS[3].items=NUMS.map(function(w,i){return[w,String(i)]});
const TIPS={
g:['Bonjour משמש ביום, Bonsoir בערב. Salut ו-Coucou הן דרכים חברתיות, בין חברים.','Au revoir היא הפרידה הרגילה. À bientôt = נתראה בקרוב, À plus = נתראה אחר כך (קיצור של À plus tard).','Pardon ו-Excuse-moi = סליחה. Je suis désolé(e) = אני מצטער/ת: בסוף יש e כשמי שמדבר היא בת.','Cher לזכר ו-Chère לנקבה, למשל בראש מכתב.'],
s:['Le prénom = השם הפרטי, Le nom = שם המשפחה.','סולם "מה שלומך" מהטוב לרע: Super bien, Ça va bien, Ça va moyen / Comme ci, comme ça / Bof, Pas tellement, Ça va mal, Ça va très mal.','כלל זיכרון: "très" = מאוד. Ça va très bien חזק מ-Ça va bien, Ça va très mal חזק מ-Ça va mal.'],
q:['כל שאלה כאן נענית במשפט שלם. אחרי התשובה אפשר להחזיר את השאלה: et toi ? = ואתה/ואת?','Je m’appelle = קוראים לי. J’habite à = אני גר/ה ב... J’étudie = אני לומד/ת.','Qui est-ce ? נענית ב-C’est ... = זה/זאת ... Tu parles français ? נענית ב-Oui, je parle... או Non, ...','Tu es professeur ? תשובה לדוגמה: Non, je suis élève (תלמיד/ה).'],
n:['11 עד 16 נגמרים ב-ze: onze, douze, treize, quatorze, quinze, seize.','17, 18, 19 בנויים כמו עשר ועוד מספר: dix-sept, dix-huit, dix-neuf.','זכרו את הקבוצות: 0 עד 10 אחד אחד, 11 עד 16 בנפרד, 17 עד 19 עשר ועוד, 20 = vingt.','שימו לב לשני מספרים שדומים באנגלית ובעברית בצליל: six ו-dix נשמעות כמו "סיס" ו"דיס".']
};
const PKEY='francais-progress-v1',IKEY='francais-install-hint-v1';
const $=function(s){return document.querySelector(s)};const app=$('#app');
function topicById(id){return TOPICS.filter(function(t){return t.id===id})[0]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function F(s){return'<span class="fr" lang="fr">'+s+'</span>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
/* ===== התקדמות מקומית ===== */
function blankP(){const t={};TOPICS.forEach(function(x){t[x.id]={a:0,c:0}});t.b={a:0,c:0};return{v:1,topics:t,wrong:{},quizzes:[],days:{}}}
function loadP(){try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&p.v===1){if(!p.topics.b)p.topics.b={a:0,c:0};return p}}catch(e){}return blankP()}
function saveP(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}}
let P=loadP();
function dayKey(){return new Date().toISOString().slice(0,10)}
function noteAnswer(topic,ok,key){if(ok)P.xp=(P.xp||0)+10;const t=P.topics[topic]||(P.topics[topic]={a:0,c:0});t.a++;if(ok)t.c++;const d=P.days[dayKey()]||(P.days[dayKey()]={q:0});d.q++;if(!ok)P.wrong[key]=(P.wrong[key]||0)+1;else if(P.wrong[key]>0)P.wrong[key]--;saveP()}
function topicName(id){return id==='b'?'בונוס איות':topicById(id).name}
/* ===== יצירת שאלות ===== */
function expand(items){const out=[];items.forEach(function(it){const f=it[0].split(' / '),h=it[1].split(' / ');
 if(f.length===1)out.push(it);else if(h.length===f.length)f.forEach(function(x,i){out.push([x,h[i]])});else f.forEach(function(x){out.push([x,it[1]])})});return out}
const EXP={};
function pool(topic){if(topic==='g'||topic==='s'){return EXP[topic]||(EXP[topic]=expand(topicById(topic).items))}return topicById(topic).items}
function distract(topic,idx,col,n){/* מסיחים מאותו נושא, שונים בטקסט */
 const cor=pool(topic)[idx][col];const me=pool(topic)[idx][1-col];let others=shuffle(pool(topic).filter(function(x){return x[1-col]!==me}).map(function(x){return x[col]}).filter(function(v,i,a){return v!==cor&&a.indexOf(v)===i}));
 if(others.length<n){const extra=shuffle([].concat.apply([],['g','s','q','n'].map(function(t){return pool(t).filter(function(x){return x[1-col]!==me}).map(function(x){return x[col]})})).filter(function(v){return v!==cor&&others.indexOf(v)<0}));others=others.concat(extra)}
 return others.slice(0,n)}
function mc(topic,key,prompt,correct,wrongs,explain,frOpts){
 const opts=shuffle([correct].concat(wrongs));return{kind:'mc',topic:topic,key:key,prompt:prompt,opts:opts,ans:opts.indexOf(correct),explain:explain,frOpts:!!frOpts}}
function qFr2He(topic,i){const it=pool(topic)[i];if(topic==='n'){return mc(topic,'n2d'+i,'איזה מספר זה: '+F(it[0])+' ?',it[1],distract(topic,i,1,3),F(it[0])+' = '+it[1])}
 return mc(topic,'f2h'+topic+i,'מה פירוש: '+F(it[0])+' ?',it[1],distract(topic,i,1,3),F(it[0])+' = '+it[1])}
function qHe2Fr(topic,i){const it=pool(topic)[i];
 if(topic==='n')return mc(topic,'d2n'+i,'איך אומרים בצרפתית את המספר '+it[1]+'?',it[0],distract(topic,i,0,3),it[1]+' = '+F(it[0]),true);
 return mc(topic,'h2f'+topic+i,'איך אומרים בצרפתית: '+it[1],it[0],distract(topic,i,0,3),it[1]+' = '+F(it[0]),true)}
function qQA(i){const it=pool('q')[i];const wr=shuffle(pool('q').filter(function(x,j){return j!==i}).map(function(x){return x[2]})).slice(0,3);
 return mc('q','qa'+i,'בחרו את התשובה המתאימה לשאלה: '+F(it[0]),it[2],wr,F(it[0])+' → '+F(it[2]),true)}
function qOrder(i,ans){const it=pool('q')[i];const s=ans?it[2].split(' / ')[0]:it[0];return{kind:'order',topic:'q',key:'ord'+(ans?'a':'q')+i,prompt:ans?'סדרו את התשובה לשאלה:<br>'+F(it[0]):'סדרו את השאלה לפי המשמעות:<br>'+it[1].split(' / ')[0],tokens:s.split(' '),target:s,explain:F(s)}}
function qType(topic,i){const it=pool(topic)[i];const fr=it[0];return{kind:'type',topic:'b',key:'typ'+topic+i,prompt:topic==='n'?'כתבו בצרפתית את המספר '+it[1]+' :':'כתבו בצרפתית: '+it[1].split(' / ')[0],variants:pool(topic).filter(function(x){return x[1]===it[1]}).map(function(x){return x[0]}),explain:F(fr)}}
function builtFor(topic){const out=[];
 if(topic==='n'){pool('n').forEach(function(x,i){out.push(qFr2He('n',i));out.push(qHe2Fr('n',i))});return out}
 pool(topic).forEach(function(x,i){out.push(qFr2He(topic,i));out.push(qHe2Fr(topic,i))});
 if(topic==='q'){pool('q').forEach(function(x,i){out.push(qQA(i));out.push(qOrder(i,false));out.push(qOrder(i,true))})}
 return out}
function practiceSet(topic){return shuffle(builtFor(topic)).slice(0,12)}
function quizSet(){const per={g:5,s:4,q:7,n:6};let qs=[];
 Object.keys(per).forEach(function(t){qs=qs.concat(shuffle(builtFor(t)).slice(0,per[t]))});return shuffle(qs)}
function bonusSet(){let all=[];['g','s','q','n'].forEach(function(t){pool(t).forEach(function(x,i){all.push(qType(t,i))})});return shuffle(all).slice(0,10)}
/* ===== מצב ומסכים ===== */
let S=null;
function bar(){return'<div class="bar"><i style="width:'+Math.round(100*S.i/S.qs.length)+'%"></i></div>'}
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(P.days[k]&&P.days[k].q>0)n++;else if(n>0||k!==dayKey())break;d.setDate(d.getDate()-1);if(n>60)break}return n}
function level(){const x=P.xp||0;return x>=800?'מאסטר 🏆':x>=400?'מתקדם 🚀':x>=150?'לומד 📚':'מתחיל 🌱'}
function examCard(){const t=new Date();const d0=new Date(t.getFullYear(),t.getMonth(),t.getDate()),d1=new Date(2026,10,26);const n=Math.round((d1-d0)/86400000);
 const when=n>0?'עוד '+(n===1?'יום אחד':n+' ימים'):n===0?'היום!':'';
 return'<div class="card" style="border-color:var(--pri)"><b>📅 הבוחן בצרפתית: יום חמישי, 26.11</b> '+(when?'<span class="chip">'+when+'</span>':'')+'<div class="small">לפי הודעת המורה סילבי (נשלחה ב-20.11): אוצר מילים ומספרים עד 20, בלי חלק בעל פה. כתיבה נכונה היא בונוס.</div></div>'}
function pct(t){return t.a?Math.round(100*t.c/t.a)+'%':'—'}
function home(){
 trackMode('other','בית');
 let h='<h1>🇫🇷 צרפתית — תרגול לבוחן</h1><div class="small">לפי דף המורה סילבי: אוצר מילים, ברכות ונימוס, הצגה עצמית, שאלות ותשובות ומספרים 0 עד 20.</div>';
 h+='<div class="card"><h2>מה בבוחן?</h2><div class="small">זיהוי והבנה של אוצר המילים שנלמד בכיתה ושל המספרים 0 עד 20: סידור משפט, התאמת שאלה לתשובה ותרגום מילים וביטויים קצרים. איות צרפתי נכון הוא <b>בונוס בלבד</b>.</div></div>';
 h+='<div class="card" style="display:flex;justify-content:space-around;text-align:center"><div><b>'+(P.xp||0)+'</b><div class="small">⚡ נקודות</div></div><div><b>'+streak()+'</b><div class="small">🔥 ימים ברצף</div></div><div><b>'+level()+'</b><div class="small">רמה</div></div></div>';h+=examCard();h+=installBox();
 h+='<h2>למידה</h2>';
 TOPICS.forEach(function(t){h+='<button class="btn sec" onclick="location.hash=\'#/learn/'+t.id+'\'">📖 '+t.name+'</button>'});
 h+='<h2>תרגול לפי נושא</h2>';
 TOPICS.forEach(function(t){h+='<button class="btn ghost" onclick="location.hash=\'#/practice/'+t.id+'\'">✏️ '+t.name+' <span class="chip">'+pct(P.topics[t.id]||{a:0,c:0})+'</span></button>'});
 h+='<h2>בוחן לדוגמה</h2><button class="btn pri" onclick="location.hash=\'#/quiz\'">📝 בוחן של 22 שאלות מכל הנושאים</button>';
 h+='<h2>בונוס</h2><button class="btn ghost" onclick="location.hash=\'#/bonus\'">⭐ כתיבה נכונה בצרפתית (אופציונלי)</button>';
 h+='<button class="btn ghost" onclick="location.hash=\'#/progress\'">📊 ההתקדמות שלי</button>';
 app.innerHTML=h;mountTrackToggle()}
function learn(id){
 const t=topicById(id);trackMode('learn',t.name);trackMilestone('topic_open',{mode:'study',topic:t.name});
 let h='<div class="nav"><h1>'+t.name+'</h1><button class="btn sm ghost" onclick="location.hash=\'#/\'">חזרה</button></div>';
 h+='<div class="small">לחצו על שורה כדי לראות או להסתיר את התשובה.</div><div class="card"><table>';
 t.items.forEach(function(x,i){h+='<tr><td>'+F(x[0])+'</td><td><span id="rv'+i+'" style="display:none">'+x[1]+(x[2]?'<br>'+F(x[2]):'')+'</span><button class="btn sm sec" onclick="var e=document.getElementById(\'rv'+i+'\');e.style.display=e.style.display===\'none\'?\'inline\':\'none\'">הצג</button></td></tr>'});
 h+='</table></div><div class="card"><h2>💡 כדאי לדעת</h2><ul class="small" style="margin:0;padding-inline-start:20px">'+TIPS[id].map(function(x){return'<li style="margin:6px 0">'+x.replace(/([A-Za-zÀ-ÿ’\-\(\)\., ]*[A-Za-zÀ-ÿ\)][A-Za-zÀ-ÿ’\-\(\)]*)/g,function(m){return/^[A-Za-zÀ-ÿ’\-\(\)\., ]+$/.test(m)&&/[a-zà-ÿ]{2}/i.test(m)?F(m.trim())+(/\s$/.test(m)?' ':''):m})+'</li>'}).join('')+'</ul></div><button class="btn pri" onclick="location.hash=\'#/practice/'+id+'\'">עוברים לתרגול</button>';
 app.innerHTML=h}
function startSet(kind,topic,qs){S={kind:kind,topic:topic,qs:qs,i:0,ok:0,res:[],answered:false,byT:{}};
 trackMode(kind==='quiz'?'exam':'practice',kind==='quiz'?'בוחן לדוגמה':kind==='bonus'?'בונוס איות':topicById(topic).name);showQ()}
function showQ(){
 if(S.i>=S.qs.length)return finish();
 const q=S.qs[S.i];S.answered=false;S.picked=[];
 let h='<div class="nav"><span class="chip">'+(S.kind==='quiz'?'בוחן':S.kind==='bonus'?'בונוס':topicById(S.topic).name)+'</span><span class="small">שאלה '+(S.i+1)+' מתוך '+S.qs.length+'</span></div>'+bar()+'<div class="card"><div class="q">'+q.prompt+'</div><div id="ans">';
 if(q.kind==='mc'){q.opts.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'" onclick="pickMC('+i+')">'+(q.frOpts?F(o):esc(o))+'</button>'})}
 else if(q.kind==='order'){h+='<div class="built" id="built"></div><div id="pool">';shuffle(q.tokens.map(function(t,i){return[t,i]})).forEach(function(p){h+='<button class="tok" data-k="'+p[1]+'" onclick="pickTok('+p[1]+')">'+esc(p[0])+'</button>'});h+='</div><div class="row"><button class="btn ghost" onclick="undoTok()">↩️ מחיקה</button><button class="btn pri" onclick="checkOrder()">בדיקה</button></div>'}
 else{h+='<input class="txt" id="typ" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn pri" onclick="checkType()">בדיקה</button><div class="small">אם אין לכם את האותיות עם הסימנים, גם בלעדיהן זה בסדר.</div>'}
 h+='</div><div id="fb"></div></div><button class="btn ghost" onclick="if(confirm(\'לצאת מהתרגול?\')){location.hash=\'#/\'}">יציאה</button>';
 app.innerHTML=h}
function record(q,ok){S.answered=true;if(ok)S.ok++;S.res.push({q:q,ok:ok});const b=S.byT[q.topic]||(S.byT[q.topic]=[0,0]);b[1]++;if(ok)b[0]++;noteAnswer(q.topic,ok,q.key)}
function feedback(q,ok,extra){
 let h='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'נכון! ✔':'לא בדיוק.')+'</div>';
 if(!ok||q.kind!=='mc')h+='<div class="small">התשובה: '+q.explain+(extra||'')+'</div>';
 else h+='<div class="small">'+q.explain+'</div>';
 h+='<button class="btn pri" onclick="S.i++;showQ()">'+(S.i+1>=S.qs.length?'לסיום':'המשך')+'</button>';$('#fb').innerHTML=h}
function pickMC(i){if(S.answered)return;const q=S.qs[S.i];const ok=i===q.ans;record(q,ok);
 document.querySelectorAll('.opt').forEach(function(b,j){if(j===q.ans)b.classList.add('ok');else if(j===i)b.classList.add('bad');b.disabled=true});feedback(q,ok)}
function drawBuilt(){const q=S.qs[S.i];$('#built').innerHTML=S.picked.map(function(k){return'<span class="tok" style="cursor:default">'+esc(q.tokens[k])+'</span>'}).join('');
 document.querySelectorAll('#pool .tok').forEach(function(b){b.classList.toggle('used',S.picked.indexOf(+b.dataset.k)>=0)})}
function pickTok(k){if(S.answered||S.picked.indexOf(k)>=0)return;S.picked.push(k);drawBuilt()}
function undoTok(){if(S.answered)return;S.picked.pop();drawBuilt()}
function checkOrder(){if(S.answered)return;const q=S.qs[S.i];if(S.picked.length<q.tokens.length){$('#fb').innerHTML='<div class="small">צריך להשתמש בכל המילים.</div>';return}
 const got=S.picked.map(function(k){return q.tokens[k]}).join(' ');const ok=got===q.target;record(q,ok);feedback(q,ok,ok?'':'<br>הסדר שלכם: '+F(esc(got)))}
function norm(s,keepAcc){s=s.toLowerCase().replace(/\(e\)/g,'').replace(/[’']/g,'').replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();return keepAcc?s:s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function checkType(){if(S.answered)return;const q=S.qs[S.i];const v=$('#typ').value;if(!v.trim())return;
 const okLoose=q.variants.some(function(x){return norm(x)===norm(v)});const okExact=q.variants.some(function(x){return norm(x,1)===norm(v,1)});
 record(q,okLoose);feedback(q,okLoose,okLoose&&!okExact?'<br>כמעט מושלם: חסרים סימנים באותיות, לבונוס מלא כתבו בדיוק כך.':'')}
function finish(){
 const tot=S.qs.length,ok=S.ok;const wb={};S.res.forEach(function(r){if(!r.ok){const n=topicName(r.q.topic);wb[n]=(wb[n]||0)+1}});
 if(trackOn()){Object.keys(S.byT).forEach(function(k){const b=S.byT[k];trackMilestone('practice_complete',{mode:S.kind==='quiz'?'quiz':'practice',topic:topicName(k),correct:b[0],total:b[1]})});
  if(S.kind==='quiz')trackMilestone('quiz_complete',{mode:'quiz',topic:'בוחן לדוגמה',correct:ok,total:tot,wrongByTopic:wb})}
 if(S.kind==='quiz'){P.quizzes.push({d:new Date().toISOString(),ok:ok,tot:tot});saveP()}
 let h='<h1>סיום</h1><div class="card"><div class="q">'+ok+' תשובות נכונות מתוך '+tot+'</div><div class="bar"><i style="width:'+Math.round(100*ok/tot)+'%"></i></div>';
 const bad=S.res.filter(function(r){return!r.ok});
 if(!bad.length)h+='<div class="fb ok">אין טעויות. מצוין.</div>';
 else{h+='<div class="small">מה כדאי לחזור עליו:</div><ul>';Object.keys(wb).forEach(function(k){h+='<li>'+k+': '+wb[k]+' טעויות</li>'});h+='</ul><div class="small">הטעויות:</div><table>';bad.slice(0,15).forEach(function(r){h+='<tr><td>'+r.q.explain+'</td></tr>'});h+='</table>'}
 h+='</div><button class="btn pri" onclick="location.hash=\'#/\'">חזרה לבית</button>';app.innerHTML=h;S=null}
function progress(){
 trackMode('other','התקדמות');
 let h='<div class="nav"><h1>ההתקדמות שלי</h1><button class="btn sm ghost" onclick="location.hash=\'#/\'">חזרה</button></div><div class="card"><table>';
 TOPICS.concat([{id:'b',name:'בונוס איות'}]).forEach(function(t){const x=P.topics[t.id]||{a:0,c:0};h+='<tr><td>'+t.name+'</td><td>'+x.c+' נכונות מתוך '+x.a+'</td><td>'+pct(x)+'</td></tr>'});
 h+='</table></div>';
 const w=Object.keys(P.wrong).filter(function(k){return P.wrong[k]>0}).length;h+='<div class="card small">פריטים שעוד כדאי לחזור עליהם: '+w+'</div>';
 if(P.quizzes.length){h+='<div class="card"><h2>בחנים לדוגמה</h2>';P.quizzes.slice(-5).forEach(function(z){h+='<div class="small">'+z.d.slice(0,10)+': '+z.ok+' מתוך '+z.tot+'</div>'});h+='</div>'}
 app.innerHTML=h;mountTrackToggle()}
function route(){const h=location.hash||'#/';const m=h.split('/');
 if(h.indexOf('#/learn/')===0&&topicById(m[2]))return learn(m[2]);
 if(h.indexOf('#/practice/')===0&&topicById(m[2]))return startSet('practice',m[2],practiceSet(m[2]));
 if(h==='#/quiz')return startSet('quiz','',quizSet());
 if(h==='#/bonus')return startSet('bonus','b',bonusSet());
 if(h==='#/progress')return progress();
 home()}
/* ===== מעקב: אותו collector פרטי של מיקי, תווית "צרפתית". מפתח מכשיר מזווג או קוד ההסכמה של אביחי שכבר במכשיר ===== */
const TRACK_URL='https://script.google.com/macros/s/AKfycbwlq3_queCzhjr_tVXN7BlsHR1_IK94c3BKra-G2mbI2TbJMhqNYXwZFSPj-kiNpT1NdQ/exec';
const TRACK_APP='צרפתית',TKEY_FR='francais-track-v1',TKEY_AV='avichai-tracking-v1';
function trackCode(){try{const a=localStorage.getItem(TKEY_FR)||'';if(/^[0-9a-f]{32}$/.test(a))return a;const b=localStorage.getItem(TKEY_AV)||'';return /^[0-9a-f]{32}$/i.test(b)?b:''}catch(e){return''}}
function trackOn(){return trackCode()!==''}
const T_MODE={learn:'study',practice:'practice',exam:'quiz'};
function trackPost(e){if(!trackOn())return;
 const payload=JSON.stringify({v:1,code:trackCode(),app:TRACK_APP,at:new Date().toISOString(),id:Date.now().toString(36)+Math.random().toString(36).slice(2,10),...e});
 try{if(navigator.sendBeacon&&navigator.sendBeacon(TRACK_URL,new Blob([payload],{type:'text/plain'})))return;
 fetch(TRACK_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:payload}).catch(function(){})}catch(_){}}
let _tm={mode:'other',topic:'',since:Date.now(),started:false};
function trackFlush(){if(!trackOn())return;const now=Date.now();const sec=Math.min(300,Math.max(0,Math.round((now-_tm.since)/1000)));if(sec>0&&_tm.started)trackPost({type:'time',mode:(T_MODE[_tm.mode]||'other'),topic:_tm.topic,seconds:sec});_tm.since=now}
function trackMode(m,t){if(!trackOn())return;if(!_tm.started){_tm.started=true;trackPost({type:'session_open'})}trackFlush();_tm.mode=m;_tm.topic=t||'';_tm.since=Date.now()}
function trackMilestone(type,d){if(!trackOn())return;if(!_tm.started){_tm.started=true;trackPost({type:'session_open'})}trackPost(Object.assign({type:type},d||{}))}
document.addEventListener('visibilitychange',function(){if(document.hidden){if(_tm.started){trackFlush();trackPost({type:'session_close'});_tm.started=false}}else{_tm.since=Date.now()}});
window.addEventListener('pagehide',function(){if(_tm.started){trackFlush();trackPost({type:'session_close'});_tm.started=false}});
setInterval(function(){if(!document.hidden&&_tm.started)trackFlush()},60000);
async function trackFetch(o){const r=await fetch(TRACK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(o)});return r.json()}
function hex16(){return[...crypto.getRandomValues(new Uint8Array(16))].map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
let _pt=null;
async function pairStart(){if(trackOn())return;const dk=hex16(),p6=String(Math.floor(100000+Math.random()*900000));const box=function(){return document.getElementById('pairBox')};
 if(box())box().innerHTML='<p class="small">שולח בקשת חיבור...</p>';
 try{const r=await trackFetch({action:'pair_request',deviceKey:dk,pair:p6});if(!r||!r.ok)throw Error()}catch(e){if(box())box().innerHTML='<p class="small">לא הצלחתי לפנות לשרת. בודקים אינטרנט ומנסים שוב.</p>';return}
 if(box())box().innerHTML='<p>הקוד לחיבור: <b style="font-size:1.5em;letter-spacing:3px">'+p6+'</b></p><p class="small">מיקי מאשר את הקוד והמסך מתעדכן לבד. הקוד תקף לחצי שעה.</p>';
 clearInterval(_pt);_pt=setInterval(async function(){try{const s=await trackFetch({action:'pair_status',deviceKey:dk});if(s&&s.approved){clearInterval(_pt);try{localStorage.setItem(TKEY_FR,dk)}catch(e){}_tm.started=false;trackMode(_tm.mode,_tm.topic);if(box())box().innerHTML='<p>✅ מעקב פעיל</p>'}}catch(e){}},4000)}
function mountTrackToggle(){const w=document.createElement('div');w.id='trackingToggle';w.style.cssText='text-align:center;margin:14px 0 0';
 if(trackOn())w.innerHTML='<div class="small" style="opacity:.8">מעקב פעיל במכשיר הזה</div>';
 else w.innerHTML='<button type="button" class="btn sm ghost" onclick="pairStart()">חיבור מעקב להורה</button><div id="pairBox" style="margin-top:8px"></div>';
 app.appendChild(w)}
/* ===== הוספה למסך הבית ===== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if((location.hash||'#/')==='#/')route()});
function installBox(){const dis=localStorage.getItem(IKEY);if(dis&&!deferredInstall)return'';let inner='';
 if(deferredInstall)inner='<button class="btn pri" onclick="doInstall()">📲 הוסף לדף הבית, כמו אפליקציה</button>';
 else inner='<div class="small">📲 <b>להוספה למסך הבית:</b> מתפריט הדפדפן (⋮) בוחרים "הוספה למסך הבית" או "התקנת אפליקציה".</div><button class="btn ghost" onclick="localStorage.setItem(\''+IKEY+'\',\'1\');route()">הבנתי, אל תציג שוב</button>';
 return'<div class="card">'+inner+'</div>'}
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;localStorage.setItem(IKEY,'1');route()}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator){}
</script>
