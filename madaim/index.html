<script>
"use strict";
/* ============ נתוני לימוד — לפי המיקוד הרשמי לבוחן ח' מחצית א, מבנה החומר (28.10.2026) ============ */
const EXAM_DATE='2026-10-28';
const TOPICS=[
{
 id:'t1', name:'מבנה החומר', pages:"עמ' 15–22, 48–54",
 tag:'אטום · מולקולה · יסוד · תרכובת · חומר טהור · סמל ונוסחה כימית',
 lessons:[
  {title:'אטום ומולקולה', body:`
   <p><b>אטום</b> הוא החלקיק הקטן ביותר של <b>יסוד</b>, שעדיין שומר על תכונותיו של היסוד. אם נחלק גרגר זהב שוב ושוב, החלקיק האחרון שעדיין יהיה "זהב" הוא אטום זהב אחד.</p>
   <p><b>מולקולה</b> היא חלקיק הבנוי מ<b>שני אטומים או יותר</b> הקשורים זה לזה בקשר כימי.</p>
   <ul>
    <li>מולקולה מאטומים של <b>אותו יסוד</b>: <span class="sym">O₂</span> (מולקולת חמצן), <span class="sym">H₂</span> (מולקולת מימן).</li>
    <li>מולקולה מיסודות <b>שונים</b>: <span class="sym">H₂O</span> (מים), <span class="sym">CO₂</span> (פחמן דו-חמצני).</li>
   </ul>
   <p>הגזים האצילים (הליום, ניאון ועוד) מופיעים בטבע כ<b>אטומים בודדים</b> — אצלם האטום עצמו הוא החלקיק של החומר.</p>
   <div class="mistake"><b>טעות נפוצה:</b> לקרוא למולקולה כמו <span class="sym">O₂</span> "תרכובת". זו לא תרכובת — תרכובת חייבת להיות בנויה מיסודות <b>שונים</b>.</div>`},
  {title:'יסוד ותרכובת', body:`
   <p><b>יסוד</b> הוא חומר הבנוי מ<b>סוג אחד של אטומים</b>. לא ניתן לפרק יסוד לחומרים פשוטים ממנו בדרכים כימיות. ידועים כיום כ-118 יסודות. דוגמאות: מימן <span class="sym">H</span>, חמצן <span class="sym">O</span>, ברזל <span class="sym">Fe</span>, זהב <span class="sym">Au</span>.</p>
   <p><b>תרכובת</b> היא חומר הבנוי מ<b>שני יסודות או יותר</b>, המאוחדים ביניהם בקשרים כימיים <b>ביחס קבוע</b>. תרכובת ניתן לפרק ליסודותיה רק בתגובה כימית. דוגמאות: מים <span class="sym">H₂O</span>, מלח בישול <span class="sym">NaCl</span>, פחמן דו-חמצני <span class="sym">CO₂</span>.</p>
   <div class="example"><b>חשוב:</b> תכונות התרכובת <b>שונות</b> מתכונות היסודות המרכיבים אותה. נתרן (<span class="sym">Na</span>) הוא מתכת פעילה ומסוכנת, וכלור (<span class="sym">Cl₂</span>) הוא גז רעיל — אבל התרכובת שלהם, מלח הבישול <span class="sym">NaCl</span>, בטוחה לאכילה.</div>
   <div class="mistake"><b>טעות נפוצה:</b> שילוב פיזי של שני יסודות (תערובת) אינו תרכובת — בתרכובת האטומים <b>קשורים כימית</b> ביחס קבוע.</div>`},
  {title:'חומר טהור ותערובת', body:`
   <p><b>חומר טהור</b> בנוי מ<b>סוג אחד של חלקיקים</b> בלבד — יסוד או תרכובת. לחומר טהור תכונות קבועות: נקודת היתוך ונקודת רתיחה קבועות (מים טהורים רותחים ב-100°C בתנאים רגילים).</p>
   <p><b>תערובת</b> היא שילוב של שני חומרים או יותר <b>שלא נקשרו</b> ביניהם כימית. הרכב התערובת אינו קבוע, ואת רכיביה אפשר להפריד בדרכים פיזיקליות (סינון, זיקוק, אידוי). דוגמאות: אוויר, מי ים, מי מלח.</p>
   <div class="example"><b>בדיקה מעשית:</b> אם לחומר נקודת רתיחה קבועה — כנראה שהוא טהור. אם נקודת הרתיחה עולה בהדרגה בזמן החימום — זוהי תערובת.</div>`},
  {title:'סמל כימי', body:`
   <p><b>סמל כימי</b> הוא אות אחת או שתי אותיות המייצגות יסוד (וגם אטום אחד שלו).</p>
   <ul>
    <li>האות הראשונה תמיד <b>גדולה</b>, והשנייה (אם יש) תמיד <b>קטנה</b>: <span class="sym">Mg</span> נכון; <span class="sym">MG</span> ו-<span class="sym">mg</span> שגויים.</li>
    <li>חלק מהסמלים נגזרים מהשם <b>הלטיני</b> של היסוד, ולכן אינם תואמים את השם העברי.</li>
   </ul>
   <table class="tbl">
    <tr><th>יסוד</th><th>סמל</th><th>מקור הסמל</th></tr>
    <tr><td>נתרן</td><td class="sym">Na</td><td>natrium</td></tr>
    <tr><td>אשלגן</td><td class="sym">K</td><td>kalium</td></tr>
    <tr><td>ברזל</td><td class="sym">Fe</td><td>ferrum</td></tr>
    <tr><td>נחושת</td><td class="sym">Cu</td><td>cuprum</td></tr>
    <tr><td>כסף</td><td class="sym">Ag</td><td>argentum</td></tr>
    <tr><td>זהב</td><td class="sym">Au</td><td>aurum</td></tr>
    <tr><td>עופרת</td><td class="sym">Pb</td><td>plumbum</td></tr>
    <tr><td>כספית</td><td class="sym">Hg</td><td>hydrargyrum</td></tr>
   </table>
   <p>סמלים נוספים שכיחים: מימן <span class="sym">H</span>, פחמן <span class="sym">C</span>, חנקן <span class="sym">N</span>, חמצן <span class="sym">O</span>, מגנזיום <span class="sym">Mg</span>, סידן <span class="sym">Ca</span>, כלור <span class="sym">Cl</span>, גופרית <span class="sym">S</span>, זרחן <span class="sym">P</span>, אלומיניום <span class="sym">Al</span>, יוד <span class="sym">I</span>.</p>`},
  {title:'נוסחה כימית', body:`
   <p><b>נוסחה כימית</b> מייצגת תרכובת: אילו יסודות בה, וכמה אטומים מכל סוג. המספר הקטן (<b>אינדקס</b>) מתייחס ליסוד שהוא צמוד אליו: <span class="sym">H₂O</span> = שני אטומי מימן + אטום חמצן אחד (כשאין מספר, האטום אחד).</p>
   <div class="example"><b>ספירת אטומים:</b><br>
   <span class="sym">CO₂</span> — פחמן 1 + חמצן 2 = <b>3 אטומים</b><br>
   <span class="sym">CaCl₂</span> — סידן 1 + כלור 2 = <b>3 אטומים</b><br>
   <span class="sym">C₆H₁₂O₆</span> (גלוקוז) — 6 + 12 + 6 = <b>24 אטומים</b></div>
   <p><b>מקדם</b> (מספר רגיל לפני הנוסחה) מכפיל את <b>כל</b> המולקולה: <span class="sym">2H₂O</span> = שתי מולקולות מים = סה"כ 4 אטומי מימן ו-2 אטומי חמצן.</p>
   <div class="mistake"><b>טעות נפוצה:</b> לבלבל בין המקדם (מספר גדול לפני הנוסחה — כמה מולקולות) לאינדקס (מספר קטן בתוך הנוסחה — כמה אטומים מכל יסוד במולקולה אחת).</div>`}
 ]
},
{
 id:'t2', name:'מבנה האטום', pages:"עמ' 23–27",
 tag:'פרוטון · נויטרון · אלקטרון · כוחות באטום',
 lessons:[
  {title:'שלושת החלקיקים התת-אטומיים', body:`
   <p>האטום בן-חלוקה: הוא בנוי משלושה חלקיקים תת-אטומיים.</p>
   <table class="tbl">
    <tr><th>חלקיק</th><th>סימן</th><th>מטען</th><th>מסה (ימ"א)</th><th>מיקום</th></tr>
    <tr><td>פרוטון</td><td class="sym">p⁺</td><td>חיובי (+1)</td><td>1</td><td>גרעין</td></tr>
    <tr><td>נויטרון</td><td class="sym">n⁰</td><td>נייטרלי (0)</td><td>בקירוב 1</td><td>גרעין</td></tr>
    <tr><td>אלקטרון</td><td class="sym">e⁻</td><td>שלילי (−1)</td><td>זניחה (כמעט 0)</td><td>אזור חוץ-גרעיני</td></tr>
   </table>
   <p>ימ"א = יחידת מסה אטומית (1 ימ"א = 1 דלטון).</p>
   <div class="mistake"><b>טעות נפוצה:</b> לחשוב שהאלקטרונים נמצאים בגרעין. האלקטרונים נעים <b>סביב</b> הגרעין, באזור החוץ-גרעיני.</div>`},
  {title:'הגרעין — ולמה רוב האטום ריק', body:`
   <p>בניסוי רדיד הזהב גילה <b>רתרפורד</b> שרוב חלקיקי האלפא שירה עברו דרך הרדיד בלי לסטות, ורק מעטים נתקלו במשהו וסטו או חזרו. מכך הסיק:</p>
   <ul>
    <li><b>רוב נפח האטום ריק.</b></li>
    <li>במרכז האטום יש <b>גרעין</b> זעיר, שבו מרוכזת רוב המסה, ומטענו <b>חיובי</b>.</li>
   </ul>
   <p>בגרעין נמצאים הפרוטונים והנויטרונים; האלקטרונים נעים סביבו באזור החוץ-גרעיני העצום ביחס לגודל הגרעין.</p>`},
  {title:'כוחות משיכה ודחייה באטום', body:`
   <ul>
    <li>מטענים <b>מנוגדים</b> נמשכים: הפרוטונים החיוביים בגרעין <b>מושכים</b> את האלקטרונים השליליים — כך האלקטרונים נשארים סביב הגרעין.</li>
    <li>מטענים <b>זהים</b> נדחים: אלקטרון דוחה אלקטרון, פרוטון דוחה פרוטון.</li>
    <li>הנויטרון חסר מטען — הוא לא נמשך ולא נדחה לחלקיקים אחרים.</li>
   </ul>
   <div class="example"><b>למה האלקטרונים לא "נופלים" לגרעין?</b> הם נעים כל הזמן באזור החוץ-גרעיני; כוח המשיכה לגרעין משאיר אותם בקרבתו בלי שהם מתמזגים בו.</div>`},
  {title:'מספר אטומי ומספר מסה', body:`
   <p><b>מספר אטומי</b> = מספר ה<b>פרוטונים</b> בגרעין. המספר האטומי קובע את <b>זהות היסוד</b>: לכל אטום מימן פרוטון אחד, וכל אטום עם 17 פרוטונים הוא כלור.</p>
   <p><b>מספר מסה</b> = מספר הפרוטונים + מספר הנויטרונים בגרעין.</p>
   <p>באטום <b>נייטרלי</b>: מספר הפרוטונים = מספר האלקטרונים, ולכן המטען הכולל של אטום הוא תמיד אפס.</p>
   <div class="example"><b>דוגמה פתורה:</b> אטום כלור <span class="sym">³⁵₁₇Cl</span><br>
   מספר אטומי 17 → 17 פרוטונים, ובאטום נייטרלי גם 17 אלקטרונים.<br>
   מספר מסה 35 → נויטרונים: <span class="kbd-num">35 − 17 = 18</span>.</div>

{
 id:'t3', name:'הטבלה המחזורית', pages:"עמ' 31–44",
 tag:'מספר אטומי · משפחות כימיות · מתכות ואל-מתכות',
 lessons:[
  {title:'איך בנויה הטבלה המחזורית', body:`
   <p>הטבלה המחזורית מסודרת לפי <b>מספר אטומי עולה</b> (מספר הפרוטונים).</p>
   <ul>
    <li><b>טור (עמודה)</b> = <b>משפחה כימית</b>: ליסודות באותה משפחה יש תכונות כימיות <b>דומות</b>.</li>
    <li><b>שורה</b> = <b>מחזור</b>: מספר השורה מייצג את מספר רמות האנרגיה האלקטרוניות של האטום. בשורה הראשונה, למשל, נמצאים רק מימן והליום.</li>
   </ul>
   <p>בכל משבצת של יסוד מופיעים: <b>הסמל</b>, שם היסוד, <b>המספר האטומי</b> והמסה האטומית (הממוצעת).</p>
   <div class="example"><b>שימוש מהיר:</b> יסוד עם מספר אטומי 11 → 11 פרוטונים, ובאטום נייטרלי גם 11 אלקטרונים. מספר אטומי 11 הוא נתרן <span class="sym">Na</span>.</div>`},
  {title:'מתכות ואל-מתכות', body:`
   <p><b>מתכות</b> (רוב היסודות בטבלה): מבריקות, מוליכות חשמל וחום, ניתנות לריקוע ולעיבוד, ורובן מוצקות בטמפרטורת החדר.</p>
   <p><b>אל-מתכות</b>: אינן מבריקות, אינן מוליכות חשמל וחום (מבודדות), שבירות במצב מוצק, וחלקן גזים.</p>
   <p>ה<b>אלכסון האמפוטרי</b> מחלק את הטבלה למתכות (משמאלו ובמרכז) ואל-מתכות (מימינו). יסודות על גבול האלכסון מציגים התנהגות "דו-פנים" (אמפוטרית).</p>
   <div class="mistake"><b>טעות נפוצה:</b> מימן (<span class="sym">H</span>) נמצא בצד המתכות של הטבלה, אבל הוא <b>אל-מתכת</b> — חשוב לזכור!</div>`},
  {title:'ארבע משפחות שחייבים להכיר', body:`
   <table class="tbl">
    <tr><th>משפחה</th><th>טור</th><th>סוג</th><th>מאפיינים עיקריים</th></tr>
    <tr><td><b>מתכות אלקליות</b><br><span class="small">ליתיום, נתרן, אשלגן</span></td><td>1</td><td>מתכות</td><td>פעילות מאוד כימית, רכות (נחתכות בסכין), מבריקות, מוליכות, טמפ' היתוך נמוכה יחסית; בטבע מופיעות בתוך תרכובות; הפעילות <b>עולה</b> ככל שיורדים בטור</td></tr>
    <tr><td><b>מתכות אלקליות-עפרוריות</b><br><span class="small">מגנזיום, סידן</span></td><td>2</td><td>מתכות</td><td>פעילות כימית, רכות, מבריקות, מוליכות חשמל וחום; גם כן מופיעות בטבע בתרכובות</td></tr>
    <tr><td><b>הלוגנים</b><br><span class="small">פלואור, כלור, ברום, יוד</span></td><td>17</td><td>אל-מתכות</td><td>פעילים מאוד, רעילים ובעלי ריח חריף, משמשים כחומרי חיטוי; מצב צבירה משתנה במורד הטור: פלואור וכלור גזים, ברום נוזל, יוד מוצק; בטבע מופיעים בתרכובות</td></tr>
    <tr><td><b>גזים אצילים</b><br><span class="small">הליום, ניאון, ארגון</span></td><td>18</td><td>אל-מתכות</td><td>יציבים מאוד — כמעט ואינם מגיבים כימית; מופיעים כאטומים בודדים; גזים חסרי ריח וטעם</td></tr>
   </table>`},
  {title:'איך עובדים עם הטבלה בבוחן', body:`
   <ul>
    <li><b>נתון מספר אטומי</b> → זה מספר הפרוטונים; באטום נייטרלי גם מספר האלקטרונים.</li>
    <li><b>מספר מסה נתון</b> → נויטרונים = מספר מסה − מספר אטומי.</li>
    <li><b>מספר הטור</b> → המשפחה, וממנה מנבאים תכונות: טור 1 מתכת אלקלית פעילה; טור 17 הלוגן פעיל; טור 18 גז אציל יציב.</li>
    <li><b>מיקום ביחס לאלכסון האמפוטרי</b> → מתכת או אל-מתכת (וזכרו: מימן אל-מתכת!).</li>
   </ul>`}
 ]
}

{id:'t1q22',topic:'t1',d:1,board:true,q:'איזה כתיב חוקי של סמל כימי? (כמו בשאלת הלוח)',o:['Da','DA','da','dA'],a:0,h1:'אות אחת גדולה והשנייה?',h2:'ראשונה גדולה, שנייה קטנה.',e:'הכלל: האות הראשונה גדולה והשנייה קטנה. לכן Da נכון; DA, da ו-dA שגויים.'},
/* --- נושא 2: מבנה האטום --- */
{id:'t2q1',topic:'t2',d:1,q:'מה נכון לגבי הפרוטון?',o:['מטענו חיובי (+1), מסתו ימ"א אחת, והוא נמצא בגרעין','מטענו שלילי והוא נע סביב הגרעין','הוא חסר מטען ונמצא בגרעין','מסתו זניחה והוא נמצא מחוץ לגרעין'],a:0,h1:'הפרוטון הוא חלקיק "חיובי" — p מלשון positive.',h2:'שני החלקיקים הכבדים יושבים בגרעין.',e:'הפרוטון (p⁺): מטען חיובי +1, מסה 1 ימ"א, ממוקם בגרעין.'},
{id:'t2q2',topic:'t2',d:1,q:'מה נכון לגבי האלקטרון?',o:['מטענו שלילי (−1), מסתו זניחה, והוא נע באזור החוץ-גרעיני','מטענו חיובי והוא נמצא בגרעין','הוא חסר מטען ומסתו כמסת הפרוטון','הוא נמצא בגרעין יחד עם הנויטרונים'],a:0,h1:'האלקטרון הוא החלקיק הקל והנודד.',h2:'מטען נגדי לפרוטון.',e:'האלקטרון (e⁻): מטען שלילי −1, מסה זניחה ביחס לפרוטון, נע סביב הגרעין באזור החוץ-גרעיני.'},
{id:'t2q3',topic:'t2',d:1,q:'מה נכון לגבי הנויטרון?',o:['חסר מטען, מסתו בקירוב 1 ימ"א, נמצא בגרעין','מטענו חיובי והוא נמצא בגרעין','מטענו שלילי והוא נע סביב הגרעין','חסר מטען ומסתו זניחה'],a:0,h1:'neutral = נייטרלי.',h2:'הוא כבד כמו הפרוטון בערך.',e:'הנויטרון (n⁰): ללא מטען חשמלי, מסה בקירוב 1 ימ"א, ממוקם בגרעין לצד הפרוטונים.'},
{id:'t2q4',topic:'t2',d:1,q:'היכן מרוכזת רוב מסת האטום?',o:['בגרעין','באלקטרונים','באזור החוץ-גרעיני','המסה מפוזרת שווה בשווה'],a:0,h1:'אילו חלקיקים הכבדים?',h2:'פרוטון ונויטרון כבדים פי ~1840 מאלקטרון.',e:'הפרוטונים והנויטרונים — שמרכיבים כמעט את כל המסה — מרוכזים בגרעין הזעיר. מסת האלקטרונים זניחה.'},
{id:'t2q5',topic:'t2',d:2,q:'מה גילה רתרפורד בניסוי רדיד הזהב?',o:['שרוב נפח האטום ריק ושבמרכזו גרעין חיובי זעיר','שיש 2000 אטומים ברדיד הזהב','שהאטום בלתי חדיר לחלוטין','שהאלקטרונים נמצאים בגרעין'],a:0,h1:'רוב חלקיקי האלפא עברו בלי לסטות.',h2:'רק מעט חלקיקים נתקלו במשהו קטן וקשה.',e:'רוב החלקיקים עברו דרך הרדיד (רוב האטום ריק), ומעטים נדחו חזק — מכך הסיק רתרפורד שקיים גרעין זעיר, מסיבי וחיובי.'},
{id:'t2q6',topic:'t2',d:1,q:'מדוע האלקטרונים נשארים קרוב לגרעין?',o:['כי מטענים מנוגדים נמשכים — הגרעין החיובי מושך את האלקטרונים השליליים','כי הנויטרונים דוחפים אותם','כי אין עליהם שום כוח','כי הם חסרי מטען'],a:0,h1:'פלוס מושך מינוס.',h2:'אותו כוח כמו בין מטענים חשמליים אחרים.',e:'כוח המשיכה החשמלית בין המטען החיובי של הגרעין לשלילי של האלקטרונים שומר את האלקטרונים סביב הגרעין.'},
{id:'t2q7',topic:'t2',d:2,q:'בין איזה זוג חלקיקים פועל כוח דחייה?',o:['שני אלקטרונים','פרוטון ואלקטרון','נויטרון ופרוטון','נויטרון ואלקטרון'],a:0,h1:'דחייה = מטענים זהים.',h2:'שניהם שליליים.',e:'מטענים זהים דוחים זה את זה: אלקטרון-אלקטרון (שניהם שליליים) ופרוטון-פרוטון (שניהם חיוביים). נויטרון חסר מטען — לא נדחה ולא נמשך.'},
{id:'t2q8',topic:'t2',d:1,q:'מה נכון תמיד לגבי אטום נייטרלי?',o:['מספר הפרוטונים שווה למספר האלקטרונים','מספר הפרוטונים שווה למספר הנויטרונים','מספר האלקטרונים שווה למספר הנויטרונים','יש בו יותר פרוטונים מאלקטרונים'],a:0,h1:'המטען הכולל אפס.',h2:'פלוסים = מינוסים.',e:'באטום נייטרלי המטענים החיוביים (פרוטונים) מאזנים בדיוק את השליליים (אלקטרונים), ולכן מספרם שווה והמטען הכולל 0.'},
{id:'t2q9',topic:'t2',d:1,q:'מהו המספר האטומי?',o:['מספר הפרוטונים בגרעין','מספר הנויטרונים בגרעין','סכום הפרוטונים והנויטרונים','מספר האלקטרונים ברמה החיצונית'],a:0,h1:'הוא קובע את זהות היסוד.',h2:'פרוטונים = זהות.',e:'המספר האטומי = מספר הפרוטונים בגרעין. הוא המזהה של היסוד: 1 פרוטון = מימן תמיד; 17 פרוטונים = כלור תמיד.'},
{id:'t2q10',topic:'t2',d:1,q:'מהו מספר המסה?',o:['מספר הפרוטונים + מספר הנויטרונים','מספר הפרוטונים בלבד','מספר כל החלקיקים כולל אלקטרונים','מספר האלקטרונים'],a:0,h1:'אילו חלקיקים בעלי מסה משמעותית?',h2:'מסת האלקטרון זניחה.',e:'מספר המסה = פרוטונים + נויטרונים. האלקטרונים לא נספרים כי מסתם זניחה (כ-1/1840 ממסת פרוטון).'},
{id:'t2q11',topic:'t2',d:2,q:'לאטום מסוים 15 פרוטונים ו-16 נויטרונים. מהם המספר האטומי ומספר המסה?',o:['מספר אטומי 15, מספר מסה 31','מספר אטומי 15, מספר מסה 16','מספר אטומי 16, מספר מסה 31','מספר אטומי 31, מספר מסה 15'],a:0,h1:'אטומי = פרוטונים; מסה = פרוטונים + נויטרונים.',h2:'15 + 16 = ?',e:'מספר אטומי = מספר הפרוטונים = 15. מספר מסה = 15 + 16 = 31.'},
{id:'t2q12',topic:'t2',d:2,q:'כמה אלקטרונים יש באטום נייטרלי שמספרו האטומי 12?',o:['12','6','24','10'],a:0,h1:'באטום נייטרלי: פרוטונים = אלקטרונים.',h2:'מספר אטומי = מספר פרוטונים.',e:'מספר אטומי 12 → 12 פרוטונים. באטום נייטרלי מספר האלקטרונים שווה למספר הפרוטונים: 12.'},
{id:'t2q13',topic:'t2',d:2,q:'לאטום כלור מספר אטומי 17 ומספר מסה 35. כמה נויטרונים יש בגרעינו?',o:['18','17','35','52'],a:0,h1:'נויטרונים = מסה − אטומי.',h2:'35 − 17 = ?',e:'מספר הנויטרונים = מספר מסה − מספר אטומי = 35 − 17 = 18.'},
{id:'t2q14',topic:'t2',d:2,q:'מה קובע את זהות היסוד (איזה יסוד האטום)?',o:['מספר הפרוטונים','מספר הנויטרונים','מספר האלקטרונים בלבד','גודל האטום'],a:0,h1:'מהו המספר האטומי?',h2:'שינוי מספר הפרוטונים = יסוד אחר.',e:'מספר הפרוטונים (המספר האטומי) קובע את זהות היסוד. שני אטומים עם אותו מספר פרוטונים הם תמיד אותו יסוד.'},
{id:'t2q15',topic:'t2',d:1,q:'מהי מסת האלקטרון ביחס למסת הפרוטון?',o:['זניחה — כ-1/1840 ממסת הפרוטון','שווה למסת הפרוטון','גדולה פי שניים','מחצית ממסת הפרוטון'],a:0,h1:'לכן לא סופרים אלקטרונים במספר המסה.',h2:'האלקטרון הוא החלקיק הקל ביותר.',e:'מסת האלקטרון זניחה (בערך 1/1840 ממסת פרוטון), ולכן מספר המסה מחשב רק פרוטונים ונויטרונים.'},
{id:'t2q16',topic:'t2',d:1,q:'מהו המטען החשמלי הכולל של אטום?',o:['אפס — האטום נייטרלי','חיובי תמיד','שלילי תמיד','תלוי ביסוד'],a:0,h1:'פרוטונים = אלקטרונים.',h2:'פלוס ומינוס מאזנים.',e:'מספר הפרוטונים (+) שווה למספר האלקטרונים (−), ולכן המטען הכולל של האטום תמיד אפס.'},
{id:'t2q17',topic:'t2',d:2,board:true,svg:{p:4,n:5,e:4},q:'כמו בלוח: מצויר אטום. ספרו את החלקיקים החיוביים (+) בגרעין — איזה יסוד מצויר?',o:['בריליום (Be) — 4 פרוטונים','בור (B) — 5 פרוטונים','הליום (He) — 2 פרוטונים','פחמן (C) — 6 פרוטונים'],a:0,h1:'כל + בגרעין הוא פרוטון אחד.',h2:'מספר אטומי 4 — חפשו בטבלה מי זה.',e:'בגרעין 4 פרוטונים → מספר אטומי 4 → היסוד הוא בריליום (Be). מספר הפרוטונים קובע את זהות היסוד.'},
{id:'t2q18',topic:'t2',d:2,board:true,svg:{p:3,n:4,e:3},q:'מצויר אטום נוסף. ספרו את הפרוטונים (+) בגרעין — איזה יסוד?',o:['ליתיום (Li) — 3 פרוטונים','הליום (He) — 2 פרוטונים','בריליום (Be) — 4 פרוטונים','מימן (H) — פרוטון אחד'],a:0,h1:'ספרו רק את סימני ה-+.',h2:'מספר אטומי 3.',e:'3 פרוטונים בגרעין → מספר אטומי 3 → ליתיום (Li).'},
{id:'t2q19',topic:'t2',d:3,board:true,svg:{p:8,n:8,e:8},q:'ובאטום הזה — ספרו את הפרוטונים בגרעין וקבעו: איזה יסוד, וכמה אלקטרונים יש לו?',o:['חמצן (O) — 8 פרוטונים ו-8 אלקטרונים','חנקן (N) — 7 פרוטונים ו-7 אלקטרונים','פלואור (F) — 9 פרוטונים ו-9 אלקטרונים','ניאון (Ne) — 10 פרוטונים ו-10 אלקטרונים'],a:0,h1:'מספר אטומי = מספר ה-+ בגרעין.',h2:'באטום נייטרלי אלקטרונים = פרוטונים.',e:'8 פרוטונים → מספר אטומי 8 → חמצן (O). באטום נייטרלי מספר האלקטרונים שווה למספר הפרוטונים: 8.'},
/* --- נושא 3: הטבלה המחזורית --- */
{id:'t3q1',topic:'t3',d:1,q:'לפי מה מסודרים היסודות בטבלה המחזורית?',o:['לפי מספר אטומי עולה','לפי סדר האלף-בית','לפי מסת האטום בלבד','לפי צבע היסוד'],a:0,h1:'מימן ראשון — יש לו פרוטון אחד.',h2:'מספר הפרוטונים עולה משמאל לימין.',e:'הטבלה מסודרת לפי מספר אטומי (מספר פרוטונים) עולה: מימן 1, הליום 2, ליתיום 3 וכן הלאה.'},
{id:'t3q2',topic:'t3',d:1,q:'מה משותף ליסודות הנמצאים באותו טור (עמודה) בטבלה?',o:['הם שייכים לאותה משפחה כימית ותכונותיהם הכימיות דומות','יש להם בדיוק אותו מספר פרוטונים','הם תמיד באותו מצב צבירה','אין ביניהם שום קשר'],a:0,h1:'טור = משפחה.',h2:'כמו בני משפחה אחת — דומים באופי.',e:'טור בטבלה הוא משפחה כימית: ליסודות באותה משפחה תכונות כימיות דומות (למשל כל המתכות האלקליות פעילות מאוד).'},
{id:'t3q3',topic:'t3',d:2,q:'מה מייצגת שורה (מחזור) בטבלה המחזורית?',o:['את מספר רמות האנרגיה האלקטרוניות של האטום','את המשפחה הכימית','את מספר הנויטרונים','את מצב הצבירה של היסוד'],a:0,h1:'שורה ראשונה = רמת אנרגיה אחת.',h2:'יורדים שורה — מתווספת רמה.',e:'מספר השורה (המחזור) שווה למספר רמות האנרגיה האלקטרוניות. בשורה הראשונה יש רק שני יסודות: מימן והליום.'},
{id:'t3q4',topic:'t3',d:1,q:'מה נכון לגבי המתכות האלקליות (טור 1)?',o:['פעילות מאוד כימית, רכות (נחתכות בסכין) ומבריקות','יציבות וכמעט לא מגיבות','אל-מתכות רעילות','גזים חסרי ריח'],a:0,h1:'נתרן ואשלגן — איך הן במים?',h2:'הן כל-כך פעילות שלא מוצאים אותן טהורות בטבע.',e:'המתכות האלקליות פעילות מאוד (מגיבות בקלות), רכות, מבריקות, מוליכות חשמל וחום, ובטבע מופיעות בתוך תרכובות.'},
{id:'t3q5',topic:'t3',d:1,q:'מה נכון לגבי ההלוגנים (טור 17, קבוצה 7)?',o:['אל-מתכות פעילות מאוד, רעילות ובעלות ריח חריף','מתכות רכות ומבריקות','גזים יציבים שלא מגיבים','מתכות מעבר כבדות'],a:0,h1:'כלור בבריכה — בשביל מה?',h2:'משמשים כחומרי חיטוי.',e:'ההלוגנים (פלואור, כלור, ברום, יוד) הם אל-מתכות פעילות מאוד, רעילות ובעלות ריח חריף, ומשמשות כחומרי חיטוי. מצב הצבירה משתנה במורד הטור: גז → נוזל → מוצק.'},
{id:'t3q6',topic:'t3',d:1,q:'מה נכון לגבי הגזים האצילים (טור 18)?',o:['יציבים מאוד וכמעט אינם מגיבים כימית','פעילים מאוד כימית','מתכות מבריקות','נוזלים בטמפרטורת החדר'],a:0,h1:'בלון הליום — למה הוא בטוח?',h2:'"אצילים" = לא מתערבבים עם אחרים.',e:'הגזים האצילים (הליום, ניאון, ארגון ועוד) יציבים מאוד וכמעט אינם מגיבים. הם מופיעים כאטומים בודדים, גזים חסרי ריח וטעם.'},
{id:'t3q7',topic:'t3',d:1,q:'איזו משפחה יציבה כל-כך עד שכמעט אינה מגיבה כימית?',o:['הגזים האצילים','המתכות האלקליות','ההלוגנים','המתכות האלקליות-עפרוריות'],a:0,h1:'טור 18.',h2:'הליום, ניאון, ארגון.',e:'הגזים האצילים בטור 18 יציבים מאוד — רמת האנרגיה החיצונית שלהם מלאה, ולכן כמעט אין להם "צורך" להגיב.'},
{id:'t3q8',topic:'t3',d:1,board:true,q:'אילו תכונות מאפיינות מתכות? (כמו ששאלו בכיתה)',o:['מבריקות, מוליכות חשמל וחום, ניתנות לריקוע','אינן מוליכות חשמל, שבירות','גזים חסרי צבע תמיד','אינן מגיבות כלל'],a:0,h1:'חשבו על ברזל, נחושת, זהב.',h2:'חוטי חשמל עשויים מנחושת — למה?',e:'מתכות מבריקות, מוליכות חשמל וחום, ניתנות לריקוע ולעיבוד, ורובן מוצקות בטמפרטורת החדר. דוגמאות: ברזל, נחושת, זהב, אלומיניום.'},

function blankP(){return{v:1,topics:{t1:{a:0,c:0},t2:{a:0,c:0},t3:{a:0,c:0}},wrong:{},exams:[],days:{},lessons:{}}}
function loadP(){try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p&&p.v===1)return p}catch(e){}return blankP()}
function saveP(p){localStorage.setItem(PKEY,JSON.stringify(p))}

function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(P.days[k]&&P.days[k].q>0){n++;d.setDate(d.getDate()-1)}else{if(k===dayKey()){d.setDate(d.getDate()-1);continue}break}}return n}
function acc(t){const x=P.topics[t];return x.a?Math.round(100*x.c/x.a):null}

/* --- איור אטום (SVG משוחזר, ללא רמז לזהות היסוד) --- */
function atomSVG(spec){
 const p=spec.p,n=spec.n,e=spec.e,W=220,H=220,cx=110,cy=110;
 function ringElectrons(count,r,offset){
  let out='';
  for(let i=0;i<count;i++){const a=offset+i*2*Math.PI/count-Math.PI/2;
   const x=(cx+r*Math.cos(a)).toFixed(1),y=(cy+r*Math.sin(a)).toFixed(1);
   out+='<circle cx="'+x+'" cy="'+y+'" r="7" fill="#fff" stroke="#4338a8" stroke-width="2"/><text x="'+x+'" y="'+(+y+4)+'" text-anchor="middle" font-size="11" font-weight="bold" fill="#c73e4e">−</text>'}
  return out}
 let orbits='<circle cx="'+cx+'" cy="'+cy+'" r="58" fill="none" stroke="#9aa" stroke-width="1.2" stroke-dasharray="4 3"/>';
 let els=ringElectrons(Math.min(e,2),58,0);
 if(e>2){orbits+='<circle cx="'+cx+'" cy="'+cy+'" r="92" fill="none" stroke="#9aa" stroke-width="1.2" stroke-dasharray="4 3"/>';els+=ringElectrons(Math.min(e-2,8),92,0.6)}
 let nuc='<circle cx="'+cx+'" cy="'+cy+'" r="34" fill="#eceafa" stroke="#4338a8" stroke-width="2.5"/>';
 const tot=p+n,cols=Math.ceil(Math.sqrt(tot));let i=0;
 for(let k=0;k<tot;k++){
  const isP=k<p;const row=Math.floor(k/cols),col=k%cols;
  const rowsN=Math.ceil(tot/cols);
  const x=cx+(col-(cols-1)/2)*13, y=cy+(row-(rowsN-1)/2)*13;
  if(isP)nuc+='<circle cx="'+x+'" cy="'+y+'" r="6.5" fill="#ffd9de" stroke="#c73e4e" stroke-width="1.4"/><text x="'+x+'" y="'+(y+3.5)+'" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c73e4e">+</text>';
  else nuc+='<circle cx="'+x+'" cy="'+y+'" r="6.5" fill="#e8e8ec" stroke="#8a8fa8" stroke-width="1.4"/>';
  i++}
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:230px;display:block;margin:6px auto" role="img" aria-label="איור אטום: גרעין עם חלקיקים חיוביים ונייטרליים, אלקטרונים סביב">'
  +orbits+els+nuc
  +'</svg>';
}

function examPick(){

 /* דגש לנושא החלש ביותר: מעבירים שאלה אחת מהנושא החזק לחלש */
 const accs=TOPICS.map(function(t){return{id:t.id,a:acc(t.id)}});
 const withData=accs.filter(function(x){return x.a!==null});
 if(withData.length>=2){
  withData.sort(function(a,b){return a.a-b.a});
  const weakest=withData[0].id,strongest=withData[withData.length-1].id;
  if(withData[withData.length-1].a-withData[0].a>=20&&per[strongest]>5){per[strongest]--;per[weakest]++}
 }
 let out=[];
 Object.keys(per).forEach(function(tid){
  const pool=shuffle(QUESTIONS.filter(function(q){return q.topic===tid}));
  out=out.concat(pool.slice(0,per[tid]));
 });
 /* השלמה אם חסר (לא אמור לקרות עם הבנק הנוכחי) */
 if(out.length<EXAM_Q){const rest=shuffle(QUESTIONS.filter(function(q){return out.indexOf(q)<0}));out=out.concat(rest.slice(0,EXAM_Q-out.length))}

const CB_APP='madaim',CB_KEYS=[PKEY,TKEY];
async function cbBackup(force){

  const r=await fetch(CB_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({code:code,app:CB_APP,payload:{format:'shared-backup-v1',app:CB_APP,savedAt:new Date().toISOString(),localStorage:ls}})});
  const j=await r.json();if(j&&j.ok)localStorage.setItem('cb_last_'+CB_APP,today);

}

  if(!j.ok||!j.payload){alert('לא נמצא גיבוי ענן למדעיקה'+(j.error?': '+j.error:''));return}
  const p=j.payload;
  if(p.format!=='shared-backup-v1'||!p.localStorage){alert('קובץ הגיבוי לא במבנה המוכר');return}
  if(!confirm('לשחזר את הגיבוי מ-'+(p.savedAt||'?')+'? המידע הנוכחי באפליקציה יוחלף.'))return;
  Object.entries(p.localStorage).forEach(function(kv){localStorage.setItem(kv[0],kv[1])});
  alert('השחזור הושלם. האפליקציה נטענת מחדש.');location.hash='';location.reload();
 }catch(e){alert('השחזור נכשל: '+e.message)}

 const payload=JSON.stringify({v:1,code:trackCode(),app:TRACK_APP,at:new Date().toISOString(),id:Date.now().toString(36)+Math.random().toString(36).slice(2,10),...e});
 try{if(navigator.sendBeacon&&navigator.sendBeacon(TRACK_URL,new Blob([payload],{type:'text/plain'})))return;
 fetch(TRACK_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:payload}).catch(function(){})}catch(_){}
}
let _tmode={mode:'other',topic:'',since:Date.now(),started:false};
function trackFlush(){if(!trackOn())return;const now=Date.now();const sec=Math.min(300,Math.max(0,Math.round((now-_tmode.since)/1000)));if(sec>0&&_tmode.started)trackPost({type:'time',mode:_tmode.mode,topic:_tmode.topic,seconds:sec});_tmode.since=now}
function trackMode(m,t){if(!trackOn())return;if(!_tmode.started){_tmode.started=true;trackPost({type:'session_open'})}trackFlush();_tmode.mode=m;_tmode.topic=t||'';_tmode.since=Date.now()}
function trackMilestone(type,detail){if(!trackOn())return;if(!_tmode.started){_tmode.started=true;trackPost({type:'session_open'})}trackPost({type:type,...(detail||{})})}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(_tmode.started){trackFlush();trackPost({type:'session_close'});_tmode.started=false}}
 else if(_tmode.started){_tmode.since=Date.now()}
});
window.addEventListener('pagehide',function(){if(_tmode.started){trackFlush();trackPost({type:'session_close'});_tmode.started=false}});
setInterval(function(){if(!document.hidden&&_tmode.started)trackFlush()},60000);
function mountTrackToggle(){
 var btn=document.createElement('button');btn.type='button';btn.id='trackingToggle';
 btn.textContent=trackOn()?'מעקב לאביחי: פעיל · לחצו לכיבוי':'הפעלת מעקב לימוד לאביחי';
 btn.style.cssText='display:block;margin:14px auto 0;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:600 12px Heebo,Arial;opacity:.92;cursor:pointer';
 btn.title='הנתונים על שימוש, זמן וציונים נשלחים לגיליון הפרטי של מיקי בחשבון Google שלו';
 btn.onclick=function(){
  if(trackOn()){if(confirm('לכבות מעקב במכשיר זה?')){if(_tmode.started){trackPost({type:'session_close'});_tmode.started=false}localStorage.removeItem(TKEY_TRACK);btn.textContent='הפעלת מעקב לימוד לאביחי'}}
  else if(confirm('להפעיל מעקב במכשיר של אביחי? זמני שימוש לפי מצב, נושאים וציונים יישלחו לגיליון הפרטי של מיקי ב-Google. אין להפעיל במכשיר אחר.')){
   var entered=prompt('קוד ההפעלה מופיע בלשונית הסבר בגיליון הפרטי של מיקי:');
   if(!entered||!/^[a-f0-9]{32}$/i.test(entered.trim()))return;
   localStorage.setItem(TKEY_TRACK,entered.trim());btn.textContent='מעקב לאביחי: פעיל · לחצו לכיבוי';
  }};
 app.appendChild(btn);
}

/* --- הוספה למסך הבית (PWA) --- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(location.hash===''||location.hash==='#/progress')render()});
function installBox(){
 const dismissed=localStorage.getItem(IKEY);
 if(dismissed&&!deferredInstall)return '';
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 let inner='';
 if(deferredInstall)inner='<button class="btn btn-pri btn-block" onclick="doInstall()">📲 הוספה למסך הבית — כמו אפליקציה</button>';
 else if(ios)inner='<div class="inst-box">📲 <b>להוספה למסך הבית (אייפון):</b> לחצו על כפתור השיתוף ב-Safari ⬆️ ואז "הוסף למסך הבית".</div><button class="btn btn-ghost btn-block" onclick="localStorage.setItem(\'madaim-install-hint-v1\',\'1\');render()">הבנתי, אל תציג שוב</button>';
 else inner='<div class="inst-box">📲 <b>להוספה למסך הבית:</b> מתפריט הדפדפן (⋮) בחרו "הוספה למסך הבית" / "התקנת אפליקציה".</div><button class="btn btn-ghost btn-block" onclick="localStorage.setItem(\'madaim-install-hint-v1\',\'1\');render()">הבנתי, אל תציג שוב</button>';
 return '<div class="card">'+inner+'</div>';
}
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;localStorage.setItem(IKEY,'1');render()}

/* --- שחזור דרך #restore --- */
if(location.hash==='#restore'){location.hash='';setTimeout(cbRestore,400)}
render();
</script>
